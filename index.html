    <tr><td>Managing product delivery</td><td>Controls the link between PM and team manager: agreed requirements for accepting, executing and delivering work</td><td>Work is authorized and agreed · teams know what to produce, effort, cost and timescale · products delivered to expectations and within tolerance · accurate progress reported to the PM</td></tr>
    <tr><td>Managing a stage boundary</td><td>Gives the board enough information to review the stage, approve the next stage (or exception) plan and confirm continued justification</td><td>Assure the board the stage's products are complete · prepare the next stage or exception plan · review and update the PID · record lessons · request authorization for the next stage</td></tr>
    <tr><td>Closing a project</td><td>A fixed point at which acceptance of the project product is confirmed and the objectives are recognized as achieved (or the project has nothing more to contribute)</td><td>User acceptance checked · business can support the products · performance reviewed against baselines · benefits assessed and post-project reviews planned · open issues and risks handed on · orderly closure, even when premature</td></tr>
  </table>
  <div class="callout trap"><div class="tag">Two traps</div><strong>1.</strong> SU produces the Project Brief; <strong>IP</strong> produces the PID — don't swap them. <strong>2.</strong> Highlight Report is from <em>CS</em> (PM→Board); Checkpoint Report is from <em>MP</em> (Team Manager→PM).</div>
  <h3 class="sub">Visual walkthrough — the Meridian project</h3>
  <p>The same seven processes, illustrated end-to-end on the office-relocation scenario. Tap any image to enlarge.</p>
  ${bpFigure('03-process-timeline')}
  ${bpFigure('04-starting-up')}
  ${bpFigure('05-directing')}
  ${bpFigure('06-initiating')}
  ${bpFigure('07-cs-mp-engine')}
  ${bpFigure('09-managing-product-delivery')}
  ${bpFigure('11-stage-boundary')}
  ${bpFigure('13-closing')}
  ${bpFigure('15-process-matrix')}`,
  `<div class="recall"><div class="tag">Recall check</div><ol>
    <li>Draw the lifecycle from memory and label all 7 processes.</li>
    <li>SU's trigger and main output? IP's main output?</li>
    <li>The five activities of Directing a Project.</li>
    <li>Which report comes from CS, and which from MP?</li>
  </ol></div>`);

RENDER.products = (c)=>courseShell(c,'products','Part 4','Management Products',
  'PRINCE2 7 holds most project information in two places: the PID (compiled during initiation) and the project log (the live record). The exam asks what each product is for, which process creates or updates it, and who receives it.',
  `<h3 class="sub">The PID: the package that authorizes the project</h3>
  <p>The <strong>project initiation documentation</strong> is compiled during <em>initiating a project</em> to gain authorization, then used as the basis for managing the project. It is not necessarily one document: it can be a collection of information, including data held in tools. Together with the current stage plan it forms the "contract" between the project manager and the project board, and it is kept up to date.</p>
  <table><tr><th>Part of the PID</th><th>What it holds</th></tr>
    <tr><td>Project definition</td><td>Background, objectives and desired outcomes, scope (inclusions and exclusions), constraints and assumptions, users and other interested parties, interfaces</td></tr>
    <tr><td>Project approach</td><td>The choice of solution and delivery method used to deliver the business option selected in the business case</td></tr>
    <tr><td>Business case</td><td>The justification, and the selected business option, based on estimated costs, risks and benefits</td></tr>
    <tr><td>Project management team structure</td><td>A chart of who is involved in the project</td></tr>
    <tr><td>Role descriptions</td><td>The roles and responsibilities in the project management team (including accountability for sustainability targets)</td></tr>
    <tr><td>Management approaches</td><td>Benefits, change, commercial, communication, digital and data, issue, quality, risk and sustainability management</td></tr>
    <tr><td>Project plan</td><td>How and when the objectives are achieved: major products, activities, resources and people; the baseline for monitoring progress</td></tr>
    <tr><td>Tailoring</td><td>How PRINCE2 is tailored for this project, for example changes of terminology</td></tr>
  </table>
  <div class="callout key"><div class="tag">Three uses of the PID</div>1. Ensure the project has a sound basis before the board makes a major commitment. 2. Act as the base document against which the board and project manager assess progress, issues and ongoing viability. 3. Give anyone joining the project a single source of reference.</div>
  <h3 class="sub">The project log: the live record</h3>
  <p>The project log holds the current and historic record of project activity and progress. Each entry carries an identifier, date logged, logged by, date updated, status, classification where needed, and details.</p>
  <table><tr><th>Part of the project log</th><th>Purpose</th><th>Practice</th></tr>
    <tr><td>Daily log</td><td>Individual observations, actions and events; collated, they may alert the PM to a new issue or risk</td><td>Progress</td></tr>
    <tr><td>Lessons log</td><td>Captures lessons for reporting when progress is reviewed</td><td>Progress</td></tr>
    <tr><td>Issue register</td><td>All issue reports raised, with their status and date of closure</td><td>Issues</td></tr>
    <tr><td>Risk register</td><td>Identified threats and opportunities, with their status and history</td><td>Risk</td></tr>
    <tr><td>Quality register</td><td>All quality management activities planned or carried out; used to review progress</td><td>Quality</td></tr>
    <tr><td>Product register</td><td>All products required by a plan, and their status</td><td>Quality</td></tr>
  </table>
  <div class="callout"><div class="tag">Registers are formal</div>A register is a formal repository managed by the project manager; the project board agrees its format, composition and use. Minor, informal items go in the daily log instead.</div>
  <h3 class="sub">Reports: who sends what to whom</h3>
  <table><tr><th>Report</th><th>Produced in</th><th>From → To</th><th>Purpose</th></tr>
    <tr><td>Checkpoint report</td><td>Managing product delivery</td><td>Team manager → PM</td><td>Status of a work package, at the frequency set in the work package description</td></tr>
    <tr><td>Highlight report</td><td>Controlling a stage</td><td>PM → project board (and other stakeholders)</td><td>Summary of stage status at intervals the board defines</td></tr>
    <tr><td>Issue report</td><td>Controlling a stage</td><td>PM → whoever decides</td><td>Impact of an issue on the baseline, options, and a recommended decision</td></tr>
    <tr><td>Exception report</td><td>Controlling a stage</td><td>PM → project board</td><td>A stage or project plan is forecast to exceed tolerance</td></tr>
    <tr><td>End stage report</td><td>Managing a stage boundary</td><td>PM → project board</td><td>Progress to date and the overall situation, so the board can decide what to do next</td></tr>
    <tr><td>End project report</td><td>Closing a project</td><td>PM → project board</td><td>How the project performed against the version of the PID used to authorize it</td></tr>
    <tr><td>Lessons report</td><td>Any time; at least in closing a project</td><td>PM → project board, for the business</td><td>Passes on lessons and triggers actions so they become embedded in ways of working</td></tr>
  </table>
  <h3 class="sub">Which products support which practice</h3>
  <table><tr><th>Practice</th><th>Key management products (syllabus)</th></tr>
    <tr><td>Business case</td><td>Project brief · business case · benefits management approach · sustainability management approach</td></tr>
    <tr><td>Organizing</td><td>Project management team structure · role descriptions · commercial management approach</td></tr>
    <tr><td>People</td><td>Change management approach · communication management approach</td></tr>
    <tr><td>Plans</td><td>Plans (project, stage, team, exception) · project product description · work package description</td></tr>
    <tr><td>Quality</td><td>Product description · quality management approach · quality register · product register</td></tr>
    <tr><td>Risk</td><td>Risk management approach · risk register</td></tr>
    <tr><td>Issues</td><td>Issue management approach · issue register · issue report</td></tr>
    <tr><td>Progress</td><td>Checkpoint, highlight, end stage, end project, exception and lessons reports · daily log · lessons log · digital and data management approach</td></tr>
  </table>
  <h3 class="sub">What's inside the core products</h3>
  <p>Questions ask what a product is <em>for</em> and what it <em>contains</em>. The essentials:</p>
  <table><tr><th>Product</th><th>Key contents</th></tr>
    <tr><td>Project brief</td><td>Built in starting up a project: project definition · outline business case · project product description · project approach · team structure and role descriptions · references</td></tr>
    <tr><td>Business case</td><td>Reasons · business options · expected benefits and dis-benefits · timescale · costs · investment appraisal · major risks</td></tr>
    <tr><td>Project product description</td><td>The project's major products and purpose · the user's quality expectations · acceptance criteria · acceptance methods. Created in starting up a project, refined in initiation</td></tr>
    <tr><td>Product description</td><td>Purpose · composition · derivation · quality specifications (plus format, quality method and responsibilities). Written as soon as the need for the product is identified</td></tr>
    <tr><td>Work package description</td><td>Work to be done (with its work breakdown structure) · team manager · product descriptions · techniques · change control requirements · constraints · reporting · tolerances · approval · agreement</td></tr>
    <tr><td>Plan (any level)</td><td>What, where, when, how and by whom: products, schedule, budget, dependencies, assumptions, tolerances and controls</td></tr>
    <tr><td>A management approach</td><td>The procedures, techniques and standards to apply, and the responsibilities for that aspect of the project</td></tr>
    <tr><td>Highlight report</td><td>Period covered · stage status · products this period and next · tolerance status · key issues and risks · requests to the board</td></tr>
    <tr><td>End project report</td><td>Performance against the PID used to authorize the project · benefits achieved so far · lessons · follow-on action recommendations</td></tr>
  </table>
  <div class="callout trap"><div class="tag">Dropped from v7: don't revise it</div>Sorting products into "baselines, records and reports", counting "26 products", configuration item records and the product status account are 6th-edition material. The v7 syllabus tests the purpose of named products, not a classification.</div>
  <div class="callout"><div class="tag">Who makes what</div>The project manager creates most products. The <strong>executive</strong> is responsible for the business case. The <strong>senior user</strong> specifies the user's quality expectations and acceptance criteria. <strong>Team managers</strong> produce checkpoint reports and any team plans.</div>`,
  `<div class="recall"><div class="tag">Recall check</div><ol>
    <li>The three uses of the PID, and four things it contains.</li>
    <li>The six parts of the project log, and which of them the board must agree as formal registers.</li>
    <li>Which report goes from team manager to PM, and how often is set where?</li>
    <li>What does the end project report compare the project's performance against?</li>
  </ol></div>`);

RENDER.roles = (c)=>courseShell(c,'roles','Part 5','Roles & Responsibilities',
  'A fixed role structure. A big share of exam marks come from one question: "who is allowed to do what?" Tap any role below for exactly what it does, when, how it reports — and what it must never do.',
  `<h3 class="sub" style="margin-top:0">Who does what — the relationship map</h3>
  <p>The highest-yield view for the exam. Tap each role; pay special attention to the red <strong>Never</strong> rows — the forbidden combinations are the single most-tested trap.</p>
  ${diagRoleMap()}
  <div class="callout trap"><div class="tag">The "never" rules, in one place</div><strong>Executive ≠ Project Manager</strong> (directing vs managing must stay separate). <strong>Project Manager ≠ Project Assurance</strong> (assurance must be independent). <strong>Project Support ≠ Project Assurance</strong> (keeps assurance independent). Only <strong>one Executive</strong>, and it can't be delegated. The PM <em>may</em> double as Team Manager or Project Support on a small project.</div>
  <h3 class="sub">Reports-to chain, at a glance</h3>
  <p>Team Manager → <strong>Project Manager</strong> → <strong>Project Board</strong> → business layer. Everything from the delivery level escalates <em>through</em> the PM — a Team Manager never goes straight to the Board.</p>
  ${diagOrg()}
  ${bpFigure('02-org-levels','The four organization levels, mapped onto the Meridian cast')}
  <h3 class="sub">The Project Board — three interests, one board</h3>
  <table><tr><th>Role</th><th>Interest</th><th>Key points</th></tr>
    <tr><td>Executive</td><td>Business</td><td>Ultimately accountable; owns the Business Case; chairs the Board. <strong>Cannot be the PM.</strong></td></tr>
    <tr><td>Senior User</td><td>User</td><td>Represents users; specifies the user's quality expectations and acceptance criteria; ensures ongoing user commitment so benefits are realized after the project.</td></tr>
    <tr><td>Senior Supplier</td><td>Supplier</td><td>Represents those who design/build/deliver; accountable for supplier-side product quality.</td></tr>
  </table>
  <p>Collectively the Board is accountable for the project's success, directs it within the remit set by the business layer, and carries out the five activities of Directing a Project.</p>
  <div class="callout key"><div class="tag">Combining Board roles</div>On smaller, less complex projects the <strong>executive can be combined with the senior user or the senior supplier</strong>. Combining <strong>senior user and senior supplier is not recommended</strong>: it creates a conflict of interest and weakens representation of both communities. Roles can be shared or combined, but every responsibility must be allocated.</div>
  <h3 class="sub">Project & delivery levels</h3>
  <div class="card">
    <p><strong>Project Manager</strong> — day-to-day management on the Board's behalf, within its constraints. Cannot be the Executive; cannot be Project Assurance. <em>Can</em> double as Team Manager or Project Support on small projects.</p>
    <p style="margin-bottom:0"><strong>Team Manager</strong> — delivers Work Packages; reports to the PM via Checkpoint Reports. Optional: in small projects, members report straight to the PM.</p>
  </div>
  <h3 class="sub">Support & assurance</h3>
  <div class="card">
    <p><strong>Project Assurance</strong> — independent oversight for the Board; three roles mirroring business/user/supplier. <strong>Cannot be the Project Manager</strong> (independence).</p>
    <p><strong>Project Support</strong> — administrative help: the project log, document control, tools, planning support. <em>Can</em> be done by the PM on small projects; must stay separate from project assurance.</p>
    <p style="margin-bottom:0"><strong>Change Authority</strong> — the Board may delegate change decisions to it within set limits. Can be the PM, a separate person, or the Board itself.</p>
  </div>
  <h3 class="sub">Organizing products in the PID</h3>
  <div class="card">
    <p><strong>Project management team structure</strong> — a chart of who is involved. <strong>Role descriptions</strong> — each role's responsibilities, including who is accountable for sustainability targets. <strong>Commercial management approach</strong> — how commercial relationships with suppliers (procurement and contracts) are managed.</p>
    <p style="margin-bottom:0"><strong>Work breakdown structure</strong> — a hierarchy of the work to be done, usually shown visually; most useful when there are several work packages. If only one work package is used, it is best not to mix internal and external team members in it.</p>
  </div>
  <div class="callout trap"><div class="tag">Memorise the "cannots"</div>Executive <strong>≠</strong> Project Manager · Project Manager <strong>≠</strong> Project Assurance · Board roles cannot be delegated to the PM. (PM <em>may</em> take on Team Manager or Project Support on small projects.)</div>`,

RENDER.tailoring = (c)=>courseShell(c,'tailoring','Part 6','Key Concepts & Tailoring',
  'Learning outcome 1 (2 marks) plus tailoring: what a project is, why project management is used, the five integrated elements, the project context, delivery approaches, and how PRINCE2 is tailored.',
  `<h3 class="sub" style="margin-top:0">Projects and project management</h3>
  <div class="card">
    <p><strong>A project</strong> is a temporary organization created to deliver one or more business products according to an agreed business case. Projects introduce change and differ from business as usual: they are <strong>temporary</strong> (a defined start and end), <strong>cross-functional</strong> (a multi-skilled team across functions), <strong>unique</strong> (different teams, customers, products, locations) and they bring <strong>uncertainty</strong> (threats and opportunities not met in routine operations).</p>
    <p><strong>Project management</strong> is the planning, delegating, monitoring and control of all aspects of the project, and the motivation of those involved, to achieve the objectives within the expected performance targets.</p>
    <p style="margin-bottom:0"><strong>Seven aspects of performance:</strong> time · cost · quality · scope · benefits · risk · sustainability.</p>
  </div>
  <h3 class="sub">Why project management is used</h3>
  <p>A project's characteristics create common challenges: ambiguity, resource availability, and keeping stakeholders informed. Project management addresses them by reducing and managing ambiguity: it unites the parties involved and clarifies objectives and working practices, so the objectives are met within the expected performance targets.</p>
  <h3 class="sub">The five integrated elements</h3>
  <p><strong>Principles</strong> (seven, all applied) · <strong>people</strong> (those working on and affected by the project, placed at the centre) · <strong>practices</strong> (seven aspects applied throughout) · <strong>processes</strong> (seven, across the lifecycle) · <strong>project context</strong> (the setting the method is tailored to).</p>
  <h3 class="sub">The project context</h3>
  <p>PRINCE2 assumes no particular setting. It works across the <strong>organizational context</strong> (stand-alone, or part of a programme or portfolio), the <strong>commercial context</strong> (customer and supplier may be different organizations), the <strong>delivery method</strong>, <strong>sustainability</strong> commitments, and <strong>scale</strong> (simplified for small projects, expanded for large ones; scale is relative to the organization).</p>
  <h3 class="sub">Delivery approaches</h3>
  <table><tr><th>Approach</th><th>Meaning</th></tr>
    <tr><td>Linear-sequential</td><td>Steps occur in sequence; the product becomes available during or at the end of the project</td></tr>
    <tr><td>Iterative-incremental</td><td>Steps repeat throughout the project, delivering in increments; also called the agile approach</td></tr>
    <tr><td>Hybrid</td><td>Different elements of the project use either of the two approaches</td></tr>
  </table>
  <p>PRINCE2 provides the controlled environment around whichever specialist delivery method is used. For an iterative-incremental project, the project plan may provide several delivery stages in which quality and acceptance criteria are refined alongside development, using a product backlog.</p>
  <h3 class="sub">Features and benefits of PRINCE2</h3>
  <p><strong>Proven</strong> (established practice and governance) · <strong>universal</strong> (any project, any scale, alongside specialist models) · <strong>flexible</strong> (can be tailored) · <strong>common language and concepts</strong> (consistency, reuse, staff mobility, easier handovers) · <strong>outcome-focused</strong> (viability against the business case, not completion for its own sake) · <strong>increased organizational maturity</strong> (learning and continual improvement) · <strong>part of an integrated suite</strong> (works with programme and risk management guidance).</p>
  <div class="callout trap"><div class="tag">Out of PRINCE2's scope</div>Specialist, industry-specific work and detailed techniques (critical path analysis, estimating, earned value) are not part of the method: they are well documented elsewhere.</div>
  <h3 class="sub">Tailoring: the rules</h3>
  <div class="card">
    <ol style="margin-left:20px;font-size:15px">
      <li style="margin:8px 0"><strong>Every PRINCE2 project must be tailored</strong> to its size, environment, complexity, importance, capability and risk. Untailored, the management effort is unlikely to fit the project.</li>
      <li style="margin:8px 0"><strong>Principles cannot be tailored away</strong>. All seven must be applied; they guide how everything else is tailored.</li>
      <li style="margin:8px 0"><strong>The project manager is responsible</strong> for tailoring and recommends it after consulting lessons and standards; <strong>the project board is accountable</strong> and approves it at the end of initiation and whenever a change to the approach is proposed.</li>
      <li style="margin:8px 0"><strong>Tailoring is recorded in the PID.</strong></li>
    </ol>
  </div>
  <h3 class="sub">What can be tailored</h3>
  <p>Processes (combine or adapt activities) · practices (more or less formality) · management products (combine, simplify, hold as data in tools) · roles (share or combine within the rules) · terminology (use the organization's own terms). Effective project management needs <strong>information, not necessarily documents</strong>, and <strong>decisions, not necessarily meetings</strong>.</p>
  <div class="callout key"><div class="tag">A tailored two-stage project</div>No separate project brief: the mandate fed a simple PID (justification, a basic plan with some product descriptions, the controls). A daily log recorded risks, issues, lessons and quality results. After the PID there was one more management stage; regular checkpoints with verbal reporting fed highlight reports. The end project report also carried lessons, follow-on actions and the benefits management approach. Fewer products, all seven principles intact.</div>`,
  `<div class="recall"><div class="tag">Recall check</div><ol>
    <li>The four project characteristics plus "introduces change", and the seven aspects of performance.</li>
    <li>The three delivery approaches, one line each.</li>
    <li>Who is responsible for tailoring, who approves it, and where it is recorded.</li>
    <li>Three features of PRINCE2 and what each gives the organization.</li>
  </ol></div>`);

/* ============ PRACTICE ENGINES ============ */

/* ---------------- FLASHCARDS (SM-2 spaced repetition) ---------------- */
/* Card memory shape: {ease, interval(days), reps, lapses, due(ts), last(ts)} */
let fcQueue=[], fcIdx=0, fcAgainPool=[];
const DAY=86400000;
function startOfTomorrow(days){
  // due at start of the day `days` out, not an exact-millisecond offset
  const d=new Date(); d.setHours(0,0,0,0); return d.getTime()+Math.max(0,Math.round(days))*DAY;
}
function fcSortKey(key){
  const m=state.cards[key];
  if(!m) return 0;              // unseen → highest priority
  return m.due||0;
}
function buildFcQueue(deck){
  let pool=CARDS.map((c,i)=>({c,key:'c'+i})).filter(x=>deck==='all'||x.c.deck===deck);
  pool.sort((a,b)=>fcSortKey(a.key)-fcSortKey(b.key));
  const now=Date.now();
  const due=pool.filter(x=>{const m=state.cards[x.key];return !m||(m.due||0)<=now;});
  return due.length?due:pool;   // if nothing due, allow a free review round
}
function isLeech(key){const m=state.cards[key];return m&&(m.lapses||0)>=4;}
RENDER.flashcards=(c)=>{
  const decks=['all',...[...new Set(CARDS.map(x=>x.deck))]];
  const seen=Object.keys(state.cards).length;
  const now=Date.now();
  const dueNow=CARDS.filter((_,i)=>{const m=state.cards['c'+i];return m&&(m.due||0)<=now;}).length;
  const fresh=CARDS.filter((_,i)=>!state.cards['c'+i]).length;
  const leeches=CARDS.filter((_,i)=>isLeech('c'+i)).length;
  c.innerHTML=`
    <div class="eyebrow">Practice</div>
    <h1 class="page">Flashcards</h1>
    <p class="lede">Real spaced repetition (SM-2). Rate honestly — intervals grow as you recall well and reset when you lapse. <strong>Again</strong> cards reappear before the round ends.</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px">
      <span class="pill">${seen}/${CARDS.length} started</span>
      <span class="pill ${dueNow?'':''}">${dueNow} due now</span>
      <span class="pill">${fresh} new</span>
      ${leeches?`<span class="pill" style="background:var(--red-soft);color:var(--red)">${leeches} struggling</span>`:''}
    </div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px" id="fcDecks">
      ${decks.map(d=>`<button class="btn btn-ghost" style="padding:8px 16px" onclick="App.startFc('${d}')">${d==='all'?'All decks':d}</button>`).join('')}
    </div>
    <div id="fcArea"></div>`;
};
function startFc(deck){
  fcQueue=buildFcQueue(deck); fcIdx=0; fcAgainPool=[];
  renderFc();
}
function renderFc(){
  const area=document.getElementById('fcArea');
  // pull in any "Again" cards once the main queue is exhausted
  if(fcIdx>=fcQueue.length && fcAgainPool.length){
    fcQueue=fcQueue.concat(fcAgainPool); fcAgainPool=[];
  }
  if(fcIdx>=fcQueue.length){
    area.innerHTML=`<div class="card" style="text-align:center;padding:40px">
      <div class="serif" style="font-size:24px;font-weight:600;margin-bottom:8px">Round complete ✓</div>
      <p style="color:var(--ink-soft)">Reviewed ${fcQueue.length} card${fcQueue.length!==1?'s':''}. Intervals updated and saved.</p>
      <button class="btn btn-primary" onclick="go('flashcards')">Back to decks</button>
      <button class="btn btn-gold" onclick="go('drill')">Drill questions →</button></div>`;
    return;
  }
  const {c:card,key}=fcQueue[fcIdx];
  const leech=isLeech(key);
  area.innerHTML=`
    <div style="text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:6px">Card ${fcIdx+1} of ${fcQueue.length}${fcAgainPool.length?` · ${fcAgainPool.length} to redo`:''}</div>
    <div class="fc-stage">
      <div class="flashcard" id="flash" role="button" tabindex="0" aria-label="Flashcard. Activate to reveal the answer."
           onclick="App.flipFc()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.flipFc()}">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-deck">${card.deck}${leech?' · ⚠ struggling':''}</div>
            <div class="fc-text">${card.front}</div><div class="fc-hint">tap or press Enter to reveal</div></div>
          <div class="fc-face fc-back">
            <div class="fc-deck">${card.deck} · answer</div>
            <div class="fc-text">${card.back}</div><div class="fc-hint">how well did you recall it?</div></div>
        </div>
      </div>
      <div class="fc-rate hidden" id="fcRate">
        <button class="btn btn-ghost" onclick="App.rateFc(0)">Again</button>
        <button class="btn btn-ghost" onclick="App.rateFc(1)">Hard</button>
        <button class="btn btn-primary" onclick="App.rateFc(2)">Good</button>
        <button class="btn btn-gold" onclick="App.rateFc(3)">Easy</button>
      </div>
    </div>`;
}
function flipFc(){
  const el=document.getElementById('flash');
  if(!el||el.classList.contains('flipped'))return;
  el.classList.add('flipped');
  document.getElementById('fcRate').classList.remove('hidden');
}
function rateFc(grade){            // 0 Again, 1 Hard, 2 Good, 3 Easy
  const {key}=fcQueue[fcIdx];
  const prev=state.cards[key]||{ease:2.5,interval:0,reps:0,lapses:0};
  let {ease,interval,reps,lapses}=prev;
  if(grade===0){                   // lapse
    reps=0; lapses=(lapses||0)+1; interval=1; ease=Math.max(1.3,ease-0.2);
    fcAgainPool.push(fcQueue[fcIdx]);          // show again this session
  }else{
    reps=(reps||0)+1;
    if(grade===1){ ease=Math.max(1.3,ease-0.15); interval = reps===1?1:Math.max(1,Math.round(interval*1.2)); }
    else if(grade===2){ interval = reps===1?1:reps===2?3:Math.round(interval*ease); }
    else { ease=ease+0.15; interval = reps===1?2:reps===2?4:Math.round(interval*ease*1.3); }
  }
  state.cards[key]={ease:+ease.toFixed(2),interval,reps,lapses,due:startOfTomorrow(interval),last:Date.now()};
  save();
  fcIdx++; renderFc();
}

RENDER.drill=(c)=>{

};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startDrill(sec){
  let pool;
  if(sec==='mistakes'){
    const miss=state.missQ||{}, now=Date.now();
    const keys=Object.keys(miss);
    const dueKeys=keys.filter(k=>(miss[k].due||0)<=now);
    const useKeys=dueKeys.length?dueKeys:keys;   // if none due, review all tracked mistakes
    pool=useKeys.map(k=>({q:QUESTIONS[+k.slice(1)],gi:+k.slice(1)})).filter(x=>x.q&&!x.q.retired);
  }else{
    pool=QUESTIONS.map((q,i)=>({q,gi:i})).filter(x=>!x.q.retired&&(sec==='all'||(sec==='official'?x.q.of:x.q.s===sec)));
  }
  drill={pool:shuffle(pool),idx:0,correct:0,answered:false,sec};
  document.getElementById('drillSetup').classList.add('hidden');
  renderDrill();
}
function renderDrill(){
  const area=document.getElementById('drillArea');
  if(drill.idx>=drill.pool.length){
    const pct=Math.round(drill.correct/drill.pool.length*100);
    area.innerHTML=`<div class="card" style="text-align:center;padding:36px">
      <div class="verdict ${pct>=80?'pass':''}" >${drill.correct} / ${drill.pool.length} correct · ${pct}%</div>
      <p style="color:var(--ink-soft)">${pct>=85?'Strong. This topic is close to exam-ready.':pct>=60?'Decent — re-read the weak spots and drill again.':'Re-read the section, then come back.'}</p>
      <button class="btn btn-primary" onclick="startDrill('${drill.sec}')">Drill again</button>
      <button class="btn btn-ghost" onclick="go('drill')">Pick another topic</button></div>`;
    return;
  }
  const {q,gi}=drill.pool[drill.idx];
  drill.answered=false;
  area.innerHTML=`
    <div class="q-card">
      <div class="q-meta"><span class="q-sec-tag">${SEC_LABEL[q.s]}${q.type?` · <span class="q-fmt">${q.type}</span>`:''}</span><span>${drill.idx+1} / ${drill.pool.length} · score ${drill.correct}</span></div>
      <div class="q-text">${q.q}</div>
      <div id="drillOpts">${q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i},${gi})"><span class="ltr">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="explain" id="drillExp"></div>
      <div class="exam-nav hidden" id="drillNext"><span></span><button class="btn btn-primary" onclick="drill.idx++;renderDrill();">${drill.idx+1>=drill.pool.length?'See results':'Next'} →</button></div>
    </div>`;
}
function answerDrill(choice,gi){
  if(drill.answered) return;
  drill.answered=true;
  const q=QUESTIONS[gi];
  const right=q.a;
  const opts=document.querySelectorAll('#drillOpts .opt');
  opts.forEach((b,i)=>{b.disabled=true;if(i===right)b.classList.add('correct');if(i===choice&&choice!==right)b.classList.add('wrong');});
  const ok=choice===right;
  if(ok)drill.correct++;
  // stats
  const s=q.s; const st=state.drillStats[s]||{seen:0,right:0}; st.seen++; if(ok)st.right++; state.drillStats[s]=st;
  // spaced re-queue of mistakes (same interval ladder as flashcards)
  if(!state.missQ) state.missQ={};
  const key='q'+gi;
  const DAY=86400000, LADDER=[1,3,8,20,50];
  const startDay=(d)=>{const t=new Date();t.setHours(0,0,0,0);return t.getTime()+Math.max(0,Math.round(d))*DAY;};
  if(!ok){
    // wrong: (re)start at the bottom of the ladder, due tomorrow
    state.missQ[key]={step:0, due:startDay(LADDER[0]), last:Date.now()};
  }else if(state.missQ[key]){
    // right: advance one step; graduate (remove) once past the last interval
    const step=(state.missQ[key].step||0)+1;
    if(step>=LADDER.length){ delete state.missQ[key]; }       // mastered
    else { state.missQ[key]={step, due:startDay(LADDER[step]), last:Date.now()}; }
  }
  save();
  const exp=document.getElementById('drillExp');
  exp.className='explain show '+(ok?'right':'wrong');
  exp.innerHTML=`<span class="v">${ok?'Correct':'Not quite — answer: '+LETTERS[right]}</span>${q.e}`;
  document.getElementById('drillNext').classList.remove('hidden');
}

// Map internal section tags → the 5 official PRINCE2 7 learning outcomes
const LO_MAP={
  concepts:['tailoring'],        // key concepts & general (incl. integrated elements, tailoring)
  principles:['principles'],
  people:['people'],             // LO3: ecosystem, change, stakeholders, culture, leadership, communication
  practices:['practices','products','roles'], // LO4: roles sit under the organization practice (syllabus 4.2.5)
  processes:['processes']
};
const LO_WANT={concepts:2, principles:5, people:8, practices:36, processes:9}; // real exam distribution = 60
function startExam(){
  const recent=new Set(state.recentSeen||[]);
  let q=[], usedGi=[];
  Object.keys(LO_WANT).forEach(lo=>{
    const tags=LO_MAP[lo];
    let pool=QUESTIONS.map((qq,i)=>({qq,gi:i})).filter(x=>!x.qq.retired&&tags.indexOf(x.qq.s)!==-1);
    const offi=pool.filter(x=>x.qq.of), rest=pool.filter(x=>!x.qq.of);
    const order=a=>shuffle(a.filter(x=>!recent.has(x.gi))).concat(shuffle(a.filter(x=>recent.has(x.gi))));
    const picked=order(offi).concat(order(rest)).slice(0,LO_WANT[lo]);
    picked.forEach(p=>p.lo=lo);   // tag each picked question with its outcome
    q=q.concat(picked); usedGi=usedGi.concat(picked.map(x=>x.gi));
  });
  q=shuffle(q);
  state.recentSeen=(state.recentSeen||[]).concat(usedGi).slice(-240);
  exam={active:true,q,idx:0,answers:new Array(q.length).fill(null),flags:new Array(q.length).fill(false),
    start:Date.now(),end:Date.now()+60*60000};
  save(); examSave();
  startExamTimer();
  go('exam');
}
function startExamTimer(){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    const el=document.getElementById('examTimer'); if(!el){return;}
    const left=Math.max(0,exam.end-Date.now());
    const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
    el.textContent=`${m}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('warn',left<5*60000);
    if(left<=0){clearInterval(examTimer);submitExam();}
  },500);
}

/* keep an unfinished mock across page refreshes (same browser, same device) */
const EXAM_LS='p2-exam-live';
function examSave(){
  try{
    if(!exam||!exam.active){ localStorage.removeItem(EXAM_LS); return; }
    localStorage.setItem(EXAM_LS, JSON.stringify({gi:exam.q.map(x=>x.gi), lo:exam.q.map(x=>x.lo), idx:exam.idx,
      answers:exam.answers, flags:exam.flags, start:exam.start, end:exam.end, n:QUESTIONS.length}));
  }catch(e){}
}
function examRestore(){
  try{
    const s=JSON.parse(localStorage.getItem(EXAM_LS)||'null');
    if(!s||!Array.isArray(s.gi)||s.n!==QUESTIONS.length||s.gi.some(g=>!QUESTIONS[g])){ localStorage.removeItem(EXAM_LS); return; }
    exam={active:true, q:s.gi.map((g,i)=>({qq:QUESTIONS[g], gi:g, lo:s.lo[i]})), idx:s.idx||0,
      answers:s.answers, flags:s.flags, start:s.start, end:s.end};
  }catch(e){ try{localStorage.removeItem(EXAM_LS);}catch(_){} }
}
function pickExam(j){exam.answers[exam.idx]=j;save();examSave();renderExamQ(document.getElementById('content'));}
function toggleFlag(){exam.flags[exam.idx]=!exam.flags[exam.idx];examSave();renderExamQ(document.getElementById('content'));}
function examGo(j){if(j<0||j>=exam.q.length)return;exam.idx=j;examSave();renderExamQ(document.getElementById('content'));}
function confirmSubmit(){
  const un=exam.answers.filter(a=>a===null).length;
  if(un>0){if(!confirm(`${un} question${un!==1?'s':''} still unanswered. Submit anyway?`))return;}
  submitExam();
}
const LO_LABEL={concepts:'Key concepts', principles:'Principles', people:'People', practices:'Practices', processes:'Processes'};
function submitExam(){
  clearInterval(examTimer);
  let correct=0; const bySec={};
  Object.keys(LO_LABEL).forEach(lo=>bySec[lo]={right:0,total:0});
  const detail=exam.q.map((item,i)=>{
    const q=item.qq; const lo=item.lo||q.lo||'unclassified';
    bySec[lo].total++;
    const chosen=exam.answers[i];
    const ok=chosen===q.a;
    if(ok){correct++;bySec[lo].right++;}
    return {q, chosen, ok, flagged:exam.flags[i], lo};
  });
  const pct=Math.round(correct/exam.q.length*100);
  const flaggedTotal=exam.flags.filter(Boolean).length;
  const flaggedRight=detail.filter(d=>d.flagged&&d.ok).length;
  const rec={pct,correct,date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
  state.examHistory.push(rec);
  if(state.examBest===null||pct>state.examBest)state.examBest=pct;
  exam.active=false; examSave();
  exam.result={pct,correct,bySec,detail,flaggedTotal,flaggedRight};
  save();
  renderExamResult(document.getElementById('content'));
}

const REF_FALLBACK_H={people:'People in Successful Projects'};
const REF_SEC_VID={principles:2,practices:3,processes:4,products:7,roles:6,tailoring:5,people:'3a'};

function refFor(q){
  if(q.ref){ const k=REF_TARGETS.findIndex(t=>t.h===q.ref); if(k>=0) return {i:k,t:REF_TARGETS[k]}; }
  const strip=s=>String(s).replace(/<[^>]+>/g,' ');
  const stem=strip(String(q.q).split('\n')[0]), rest=strip(q.o[q.a]+' '+q.e);
  let best=-1,bestScore=0;
  REF_TARGETS.forEach((t,i)=>{
    // words in the question itself count 3x; words only in the answer/explanation count 1x
    const a=new Set((stem.match(t.re)||[]).map(x=>x.toLowerCase()));
    const b=new Set((rest.match(t.re)||[]).map(x=>x.toLowerCase()).filter(x=>!a.has(x)));
    let score=a.size*3+b.size; if(!score) return;
    if(REF_SEC[t.v]===q.s) score+=0.5;
    if(score>bestScore){best=i;bestScore=score;}
  });
  if(best>=0) return {i:best,t:REF_TARGETS[best]};
  return {i:-1,t:{v:REF_FALLBACK[q.s]||'dashboard',h:REF_FALLBACK_H[q.s]||null,vid:REF_SEC_VID[q.s]}};
}
function refViewLabel(v){ const x=VIEWS.find(z=>z.id===v); return x?x.label:v; }
function refLinks(q){
  const r=refFor(q), t=r.t;
  const where = t.h ? `${refViewLabel(t.v)} › ${t.h.replace(/^"|"$/g,'')}` : refViewLabel(t.v);
  const main = r.i>=0
    ? `<button class="ref-link" onclick="App.goRef(${r.i})">${where}</button>`
    : `<button class="ref-link" onclick="App.goRefView('${t.v}','${q.s}')">${where}</button>`;
  const vid = t.vid ? `<button class="ref-link ref-vid" onclick="App.goVid('${t.vid}')">Video · Module ${t.vid}</button>` : '';
  return `<div class="ref-row"><span class="ref-lbl">Study it</span>${main}${vid}</div>`;
}

let refReturnY=0;
function refBackBar(){
  const old=document.getElementById('refBack'); if(old) old.remove();
  const b=document.createElement('button');
  b.id='refBack'; b.className='ref-back'; b.type='button';
  b.textContent='← Back to answer review';
  b.onclick=backToReview;
  document.body.appendChild(b);
}
function refFlash(h){
  const c=document.getElementById('content'); if(!c||!h) return;
  const els=[...c.querySelectorAll('h2,h3,h4,.tag')];
  const el=els.find(e=>e.textContent.trim().startsWith(h))||els.find(e=>e.textContent.includes(h));
  if(!el) return;
  const box=el.closest('.pblock')||(el.classList.contains('tag')?el.closest('.callout'):null)||el;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // offset for the sticky mobile top bar so the target isn't hidden underneath it
  let off=20; document.querySelectorAll('body *').forEach(e=>{ if(e.id==='refBack')return; const s=getComputedStyle(e);
    if((s.position==='sticky'||s.position==='fixed')&&s.top==='0px'&&e.offsetHeight<200&&e.offsetWidth>window.innerWidth/2&&s.display!=='none') off=Math.max(off,e.offsetHeight+16); });
  window.scrollTo({top:box.getBoundingClientRect().top+window.scrollY-off,behavior:reduce?'auto':'smooth'});
  box.classList.add('ref-hit'); setTimeout(()=>box.classList.remove('ref-hit'),2600);
}
function refJump(v,h){
  refReturnY=window.scrollY||0;
  go(v); window.scrollTo({top:0,behavior:'instant'}); refBackBar();
  setTimeout(()=>refFlash(h),60);
}
function goRef(i){ const t=REF_TARGETS[i]; if(t) refJump(t.v,t.h); }
function goRefView(v,s){ refJump(v,REF_FALLBACK_H[s]||null); }
function goVid(n){ refJump('videos','Module '+n+' ·'); }
function backToReview(){
  const b=document.getElementById('refBack'); if(b) b.remove();
  if(!exam||!exam.result){ go('exam'); return; }
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active', x.dataset.v==='exam'));
  renderReview();
  const y=refReturnY; requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));
}

      <p><strong>1. Business layer</strong> (commissioning: corporate, programme management or the customer) — sits outside the project, provides the mandate, identifies the executive, sets project tolerances and decides on any forecast breach of them. <strong>2. Directing</strong> — the Project Board. <strong>3. Managing</strong> — the Project Manager. <strong>4. Delivering</strong> — Team Managers (or team members directly).</p>
      <p>Authority and tolerance <em>cascade down</em>; exceptions <em>escalate up</em>. That single sentence ties Organization to Progress and to "manage by exception".</p>
      <h4 class="sub" style="font-size:16px">The three interests — why three</h4>
      <p>Every project balances what the <strong>business</strong> will fund (Executive), what <strong>users</strong> need from the outputs (Senior User), and what <strong>suppliers</strong> can build (Senior Supplier). All three must be represented on the Board so decisions aren't made blind to one side.</p>
      <h4 class="sub" style="font-size:16px">Assurance vs Support vs Change Authority</h4>
      <p><strong>Project Assurance</strong> — the Board's independent check that the project is being run properly; three strands mirroring the three interests; <em>cannot</em> be the PM. <strong>Project Support</strong> — administration, the project log, tools and planning support; <em>can</em> be the PM on a small project, but must be kept separate from project assurance. <strong>Change Authority</strong> — a delegated decision-maker for changes within limits the Board sets.</p>
      <h4 class="sub" style="font-size:16px">The organizational design and development technique — five steps</h4>
      <p><strong>1. Understand the organizational ecosystem</strong> — the existing structures, governance, management approaches and people of the organizations involved, before designing anything.<br>
      <strong>2. Design the project ecosystem</strong> — the team structure, the people and resources needed, working practices, and the behaviours and culture wanted.<br>
      <strong>3. Develop the project ecosystem</strong> — put the design in place and keep improving it, e.g. onboarding new members through inductions, site visits or certification.<br>
      <strong>4. Manage changes to the project ecosystem</strong> — the capabilities needed change over the lifecycle, so people move on and off the project at transition points, guided by feedback.<br>
      <strong>5. Transition the project into the organizational ecosystem</strong> — at the end, products, people and learning go back to the business.</p>
      <div class="callout trap"><div class="tag">Which step is it?</div>Studying existing governance before choosing a team structure → <strong>understand</strong>. Deciding the people, working practices and culture → <strong>design</strong>. An induction or site visit for a new member → <strong>develop</strong>. A new skill mix needed in a later phase → <strong>manage changes</strong>. Handing products, people and lessons back → <strong>transition</strong>.</div>
      <h4 class="sub" style="font-size:16px">Combining roles and the work breakdown structure</h4>
      <p>The executive may be combined with the senior user or senior supplier on smaller projects; combining senior user and senior supplier is not recommended (conflict of interest). Roles can be shared or combined, but all responsibilities must be allocated. The <strong>work breakdown structure</strong> shows the hierarchy of work to be done and is most useful when there are several work packages. The <strong>commercial management approach</strong> sets out how supplier relationships, procurement and contracts are managed.</p>
      <div class="callout"><div class="tag">Composition: Communication Management Approach</div>How and when the project communicates with stakeholders: stakeholder analysis, information needs, methods, frequency, roles. Produced in IP.</div>`})}

    ${deepPractice({id:'plans',num:'3',name:'Plans',
      purpose:'Facilitate communication and control by defining how, when and at what cost products are delivered.',
      body:`
      <h4 class="sub" style="font-size:16px">The planning technique — six steps, with risk analysis throughout</h4>
      <p><strong>1. Defining and analysing products</strong> — what must be delivered (detail below).<br>
      <strong>2. Organizing work packages</strong> — group products and their activities into work packages: at least one product each, closely related people, resources and activities, no overlap, and dependencies documented. Dependencies can be <strong>internal</strong> (within the project) or <strong>external</strong> (outside its control).<br>
      <strong>3. Preparing estimates</strong> — resources, people, duration, cost, benefits and risk.<br>
      <strong>4. Preparing the schedule</strong> — sequence, resource allocation and a graphical representation.<br>
      <strong>5. Preparing the budget</strong> — activity costs, the risk budget, the change budget and cost tolerances.<br>
      <strong>6. Documenting the plan</strong> — the plan’s parts plus a short narrative explaining it at a high level.</p>
      <p><strong>Analysing risks</strong> is not a separate step: it runs alongside all six. The whole technique is repeated for project, stage and team plans.</p>
      <div class="callout trap"><div class="tag">Which step is it?</div>Writing the project product description or a product breakdown structure → <strong>defining and analysing products</strong>. Grouping products into packages for teams → <strong>organizing work packages</strong>. Risk budget and change budget → <strong>preparing the budget</strong>.</div>
      <h4 class="sub" style="font-size:16px">Inside step 1 · product-based planning</h4>
      <p>This is the heart of "focus on products" made operational:</p>
      ${diagPlanning()}
      <p><strong>1. Write the Project Product Description</strong> — what the project as a whole must deliver, and its acceptance criteria.<br>
      <strong>2. Create the Product Breakdown Structure (PBS)</strong> — decompose the project into a hierarchy of products.<br>
      <strong>3. Write Product Descriptions</strong> — for each significant product: purpose, composition, derivation, quality specifications, quality method.<br>
      <strong>4. Create the Product Flow Diagram</strong> — the sequence and dependencies in which products are produced.</p>
      <div class="callout key"><div class="tag">Order matters on the exam</div>Products first (what), <em>then</em> activities and dependencies (how), <em>then</em> estimates and schedule. A question that puts "identify activities" before "define products" is describing activity-based planning — the wrong answer.</div>
      <h4 class="sub" style="font-size:16px">Three levels + the exception</h4>
      <p><strong>Project Plan</strong> (whole project, in the PID, Board approves) · <strong>Stage Plan</strong> (next stage in detail, made near the end of the current stage) · <strong>Team Plan</strong> (optional, by a Team Manager). An <strong>Exception Plan</strong> replaces a Stage Plan or Project Plan after a forecast tolerance breach — it covers from the present to the end of the plan it replaces, and needs the same approval as the original.</p>
      <h4 class="sub" style="font-size:16px">Planning horizon and stages</h4>
      <p>The <strong>planning horizon</strong> is how far ahead you can plan with accuracy. That is why PRINCE2 plans the whole project at a high level (project plan) and only the next stage in detail (stage plan), produced near the end of the current stage. The number and length of stages balance the planning horizon, risk, complexity, key decision points and any programme alignment. Stages <strong>do not overlap</strong>; work packages may run in parallel and should ideally not span a stage boundary. An iterative-incremental project may use several delivery stages, refining quality and acceptance criteria through a product backlog.</p>
      <h4 class="sub" style="font-size:16px">What's in a Plan</h4>
      <p>Plan description · prerequisites · external dependencies · planning assumptions · lessons incorporated · monitoring/control · the products (Product Descriptions) · schedule · tolerances · controls.</p>`})}

    ${deepPractice({id:'quality',img:'19-quality-trail',num:'4',name:'Quality',
      purpose:'Define and implement the means by which the project verifies products are fit for purpose.',
      body:`
      <h4 class="sub" style="font-size:16px">The quality audit trail — a five-link chain</h4>
      <p>This sequence is exam gold; learn it end to end:</p>
      ${diagQuality()}
      <p><strong>1. User's quality expectations</strong> — a general statement of the quality wanted (captured early, in the Project Product Description / Project Brief).<br>
      <strong>2. Acceptance criteria</strong> — a <em>prioritised, measurable</em> list defining what makes the final product acceptable (also in the project product description; the senior user specifies them).<br>
      <strong>3. Quality specifications</strong> — specific, per-product standards (in each Product Description).<br>
      <strong>4. Quality Register</strong> — the running log of planned and completed quality activities (who, when, result).<br>
      <strong>5. Quality records / acceptance records</strong> — the evidence that criteria were met.</p>
      <h4 class="sub" style="font-size:16px">The quality management technique — plan, control, accept</h4>
      <p><strong>Quality planning</strong> — gather user inputs (the user’s quality expectations and acceptance criteria, captured in the project product description in starting up a project); detail the user requirements as quality specifications in product descriptions; describe the quality management approach; obtain project board approval.<br>
      <strong>Quality control</strong> — implement the quality management approach; carry out quality control activities and record each one and its result in the quality register (a failed check can be repeated if the product is expected to pass); assess quality issues and raise exceptions if needed; obtain user approval of products.<br>
      <strong>Accepting products</strong> — acceptance transfers ownership of, or responsibility for, a product from the project or supplier to the project board on behalf of the user.</p>
      <div class="callout trap"><div class="tag">Which step is it?</div>Capturing the user’s quality expectations → <strong>quality planning</strong> (gathering user inputs). Recording a test result in the quality register → <strong>quality control</strong>. The user taking ownership of a tested product → <strong>accepting products</strong>.</div>
      <h4 class="sub" style="font-size:16px">Three quality words that get confused</h4>
      <p><strong>Quality planning</strong> — defining what "fit for purpose" means (the criteria). <strong>Quality control</strong> — checking products against those criteria as they're built (reviews, tests). <strong>Quality assurance</strong> — independent confidence that the techniques used are sufficient to show the quality requirements are met; engaged throughout the lifecycle, independently of the project team. Don't confuse it with <strong>project assurance</strong>, which is the project board's responsibility and checks that the project is being conducted correctly.</p>
      <div class="callout key"><div class="tag">Composition: Quality Management Approach</div>How quality will be managed on this project: standards, responsibilities, the quality-control and assurance arrangements, tools, and how the Quality Register will be used. Produced in IP.</div>`})}

    ${deepPractice({id:'risk',img:'16-risk-responses',num:'5',name:'Risk',
      purpose:'Identify, assess and control uncertainty, improving the project\u2019s chance of success.',
      body:`
      <h4 class="sub" style="font-size:16px">The risk management procedure — 4 steps + communicate</h4>
      ${diagRisk()}
      <p><strong>1. Identify</strong> — context first (the Risk Management Approach), then the risks themselves; write each as cause → event → effect.<br>
      <strong>2. Assess</strong> — estimate each risk's probability and impact (its size), plus proximity (how soon) and velocity (how fast it would hit), then evaluate the combined risk profile.<br>
      <strong>3. Plan</strong> — choose responses.<br>
      <strong>4. Implement</strong> — assign risk owners and risk action owners; carry out responses.<br>
      <strong>Communicate</strong> sits at the centre and runs through all four steps (Highlight, End Stage, End Project reports), not as a final step.</p>
      <h4 class="sub" style="font-size:16px">Responses — memorise by category</h4>
      <p><strong>Paired:</strong> Avoid (threat) / Exploit (opportunity) make the uncertain situation certain. Reduce (threat) / Enhance (opportunity) change the probability or impact.<br>
      <strong>Both threats and opportunities:</strong> Transfer (part of the risk to a third party, e.g. insurance) · Share (pain/gain) · Accept · Prepare contingent plans. (There is no Reject or Fallback response in v7.)<br>
      Only avoid, reduce, exploit and enhance are specific to one side — a common trap.</p>
      <h4 class="sub" style="font-size:16px">Owner vs action owner, and the budget</h4>
      <p>The <strong>risk owner</strong> is accountable for managing a specific risk. The <strong>risk action owner</strong> carries out a specific response action (may be a different person; the official manual notes it is also known as the risk actionee). The <strong>risk budget</strong> is a sum of money to fund specific responses to threats and opportunities (for example, contingent plans); it can include a provision for unknown risks. The risk management approach defines how it is controlled and accessed, so it isn't treated as spare project budget.</p>
      <h4 class="sub" style="font-size:16px">Risk definitions the exam uses</h4>
      <p><strong>Risk appetite</strong> — the amount and type of risk the business is willing to take in pursuit of its objectives. <strong>Risk tolerance</strong> — a measurable threshold for the tolerable range of outcomes for each objective at risk, in the same units as that objective. <strong>Risk exposure</strong> — the degree to which an objective is at risk (neutral: can be positive or negative). <strong>Probability</strong> — the chance it occurs. <strong>Impact</strong> — the effect on objectives if it occurs. <strong>Proximity</strong> — how near in time. <strong>Velocity</strong> — how quickly it would affect objectives. <strong>Cause → event → effect</strong>: the source (a driver, not a risk itself), the uncertain event, and its impact on objectives. <strong>Residual risk</strong> — what remains after a response; <strong>secondary risk</strong> — a new risk created by a response.</p>
      <div class="callout trap"><div class="tag">Decision bias</div><strong>Optimism bias</strong> discounts downside risk. <strong>Loss aversion</strong> values avoiding a loss over making a gain. <strong>Groupthink</strong> puts group cohesion above a dissenting view. <strong>Proximity bias</strong> treats nearer situations as riskier and more important than later ones. A supportive risk culture counters them.</div>
      <div class="callout key"><div class="tag">Composition: Risk Management Approach</div>How risk is managed here: procedure, tools, roles/responsibilities, risk categories, scales for probability/impact/proximity, risk tolerance, the Risk Budget, and how the Risk Register is maintained. Produced in IP.</div>`})}

    ${deepPractice({id:'issues',img:'17-issue-types',num:'6',name:'Issues',
      purpose:'Identify, assess and control any unplanned events that may affect the project.',
      body:`
      <h4 class="sub" style="font-size:16px">Risk vs issue — the one-word test</h4>
      <p>A <strong>risk</strong> <em>might</em> happen (future, uncertain). An <strong>issue</strong> <em>has</em> happened (now, real). When a risk materialises, it becomes an issue.</p>
      <h4 class="sub" style="font-size:16px">Types of issue (PRINCE2 7)</h4>
      <p>An issue is an event relevant to the project that requires project management consideration: an unplanned event that <em>has occurred</em> and needs management action (a risk, by contrast, <em>might</em> happen). Issues can be raised at any time by anyone. Know each type by its meaning:</p>
      <p><strong>1. Problem</strong> — an issue with an immediate and negative impact.<br>
      <strong>2. Concern</strong> — an issue whose timelines and impact need to be assessed.<br>
      <strong>3. Event external to the project</strong> — something outside the project that may impact it.<br>
      <strong>4. Business opportunity</strong> — an unanticipated positive consequence for the project or user organisation.<br>
      <strong>5. Request for change</strong> — a proposal for a change to a project baseline.<br>
      <strong>6. Off-specification</strong> — a product that will not meet its quality specifications.</p>
      <div class="callout"><div class="tag">Don't learn a count</div>The syllabus lists change, problem/concern, business opportunity, request for change and off-specification; the workbook also lists event external to the project and treats problem and concern separately. Questions test the meaning of each type, not how many there are. A <strong>concession</strong> is an off-specification the board accepts without corrective action.</div>
      <div class="callout key"><div class="tag">Issue management includes change control</div>In PRINCE2 7, the Issues practice <em>encompasses change control</em>. A <strong>change</strong> is a modification to any approved product in the project baseline; a <strong>change budget</strong> funds authorised changes. Issues are logged in the <strong>Issue Register</strong> (part of the project log).</div>
      <h4 class="sub" style="font-size:16px">The change control procedure — 5 steps</h4>
      ${diagChange()}
      <p><strong>Capture</strong> (log it) → <strong>Assess</strong> (impact on objectives, Business Case, risk) → <strong>Recommend</strong> (identify, evaluate and recommend options) → <strong>Decide</strong> (PM, Change Authority, or Board per the limits) → <strong>Implement</strong>.</p>
      <div class="callout"><div class="tag">Daily Log vs Issue Register</div>Minor issues the PM handles informally go in the <strong>Daily Log</strong>. Anything formally managed through change control goes in the <strong>Issue Register</strong>, with an <strong>Issue Report</strong> for the detail.</div>
      <div class="callout key"><div class="tag">Composition: Issue Management Approach</div>How issues and changes are handled: the procedure, roles (incl. Change Authority and its limits), any change budget, tools, and how the Issue Register is used. Produced in IP.</div>`})}

    ${deepPractice({id:'progress',img:'18-tolerance-cascade',num:'7',name:'Progress',
      purpose:'Monitor actual vs planned achievement, forecast viability, and control unacceptable deviations.',
      body:`
      <h4 class="sub" style="font-size:16px">Tolerances and the cascade</h4>
      <p>Seven tolerance areas (performance aspects): <strong>Time · Cost · Scope · Quality · Benefits · Risk · Sustainability.</strong> The business layer sets project tolerances → the Board sets stage tolerances for the PM → the PM sets Work Package tolerances for Team Managers. Each level works freely within tolerance; a <em>forecast</em> breach triggers escalation to the level above.</p>
      <h4 class="sub" style="font-size:16px">Two kinds of control</h4>
      <p><strong>Time-driven</strong> — happen on a regular cadence (Highlight Report, Checkpoint Report). <strong>Event-driven</strong> — triggered by something occurring (Exception Report, End Stage Report, completion of a Work Package).</p>
      <h4 class="sub" style="font-size:16px">Who reports what to whom</h4>
      <p><strong>Checkpoint Report</strong>: Team Manager → PM (time-driven, on a Work Package). <strong>Highlight Report</strong>: PM → Board (time-driven, during a stage). <strong>Exception Report</strong>: PM → Board (event-driven, on forecast breach). <strong>End Stage Report</strong>: PM → Board (event-driven, at SB). <strong>End Project Report</strong>: PM → Board (at CP).</p>
      <div class="callout"><div class="tag">What progress control relies on</div>Approved <strong>plans</strong> to measure against, the <strong>project log</strong> (the running record), <strong>reports</strong>, and <strong>forecasts</strong>: an exception is a <em>forecast</em> deviation beyond tolerance, so you don't wait for it to happen. If project tolerances are forecast to be exceeded, the board no longer has authority and must refer the matter to the business layer.</div>`})}

    <div style="margin-top:30px;display:flex;gap:12px;flex-wrap:wrap">

      <button class="btn btn-ghost" onclick="go('practices')">Back to summary</button>
    </div>`;
};

/* ---------------- 7th EDITION ---------------- */
RENDER.edition = (c)=>{
  markRead('edition');
  c.innerHTML = `
    <div class="eyebrow">7th Edition (2023)</div>
    <h1 class="page">What's New in PRINCE2 7<span class="small">the recently-tested material</span></h1>
    <p class="lede">PRINCE2 was substantially refreshed in 2023. Current exams concentrate questions in exactly the areas that changed — so these are worth knowing precisely, not just in passing.</p>

    ${bpFigure('00-framework-overview','The five integrated elements, project characteristics, and the People element')}

    <div class="card">
      <h3 class="sub" style="margin-top:0">1. "Themes" are now "Practices"</h3>
      <p>The seven <strong>themes</strong> of the 6th edition were renamed the seven <strong>practices</strong>. The substance is largely continuous, but the exam uses the new word. The 6th-edition theme "Change" is now the <strong>Issues</strong> practice. The set is: Business Case, Organization, Plans, Quality, Risk, Issues, Progress.</p>
    </div>

    <div class="card">
      <h3 class="sub" style="margin-top:0">2. Five "people" / management elements framing</h3>
      <p>7th edition foregrounds the integrated elements of the method working together — <strong>principles, people, practices, processes</strong>, applied in a <strong>project context</strong>. The explicit attention to <strong>people</strong> (leadership, stakeholder engagement, the human side of change) is new emphasis relative to the 6th edition's more document-centric framing.</p>
      <div class="callout"><div class="tag">Why it's tested</div>Expect a question that lists the integrated elements, or asks what 7th edition added focus on. "People" is the answer that distinguishes 7 from 6.</div>
    </div>

    <div class="card">
      <h3 class="sub" style="margin-top:0">3. Sustainability — the new seventh performance aspect</h3>
      <p>This is the headline addition. PRINCE2 7 adds <strong>sustainability</strong> as the <strong>seventh aspect of performance</strong>. The six aspects from the 6th edition — <strong>time, cost, scope, quality, benefits, risk</strong> — are now joined by <strong>sustainability</strong>, giving <strong>seven</strong>. You can set a <strong>tolerance</strong> against all seven, sustainability included.</p>
      <div class="callout key"><div class="tag">Exam-critical — get this right</div>PRINCE2 7 has <strong>SEVEN</strong> performance aspects, and tolerances are set against all seven: <strong>time, cost, scope, quality, benefits, risk, sustainability</strong>. Sustainability is a full tolerance area, not a separate "target" sitting outside the set. The official PeopleCert sample paper confirms this — e.g. a carbon-reduction target is captured <em>as a sustainability tolerance</em>. Sustainability targets and tolerances are documented in the <strong>sustainability management approach</strong>. If any source says "six tolerances", it is describing the old 6th edition — wrong for your exam.</div>
    </div>

    <div class="card">
      <h3 class="sub" style="margin-top:0">4. Digital and data emphasis</h3>
      <p>7th edition reflects modern delivery: explicit acknowledgement of <strong>digital tooling, data management, and how information flows</strong> through the method, rather than assuming paper documents. Management products are "information sets" that can live in tools, not necessarily standalone documents — reinforcing that <strong>tailoring</strong> applies to how products are held and formatted.</p>
    </div>

    <div class="card">
      <h3 class="sub" style="margin-top:0">5. What did NOT change</h3>
      <p>The <strong>7 principles are unchanged</strong> in number and intent. The <strong>7 processes are unchanged</strong>. The role structure (Project Board, three interests, PM, Team Manager, Assurance, Support) is intact. The four-layer model still holds. So most of what you've learned transfers directly — the deltas above are the surface area where 7 differs from 6.</p>
    </div>

    <div class="callout trap"><div class="tag">Don't over-rotate</div>It's tempting to assume everything changed. It didn't. The high-yield 7th-edition facts are: <strong>themes→practices</strong>, <strong>people</strong> added as the 5th integrated element, and <strong>sustainability</strong> added as the 7th performance aspect (so seven tolerances, not six). Bank those three cleanly and you've covered most edition-specific questions.</div>

    <div class="recall"><div class="tag">Recall check</div><ol>
      <li>What were "themes" renamed to, and which 6th-edition theme became the Issues practice?</li>
      <li>Name the integrated elements 7th edition emphasises — which is the newly foregrounded one?</li>
      <li>How many performance aspects does PRINCE2 7 have, and which was added? Can you set a tolerance against it?</li>
      <li>Name three things that did NOT change from the 6th edition.</li>
    </ol></div>

    <div style="margin-top:30px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="go('drill')">Drill this →</button>
      <button class="btn btn-ghost" onclick="go('dashboard')">Dashboard</button>
    </div>`;
};

    note:"Four points in this video are wrong. (1) Ignore the segments saying “Organization” was renamed or is retired: the 6th edition already used Organization, the courseware says “organization practice”, and the syllabus mostly says “organizing”. Both names mean the same practice. (2) It calls “risk actionee” the 6th-edition term. PRINCE2 7’s main term is risk action owner, but the official manual says it is also known as the risk actionee, so neither is wrong. (3) The risk technique is four steps (identify, assess, plan, implement) with communicate at the centre, not five in a row. (4) The on-screen issue-type list shows “request for change” twice. Modules 3a to 3e cover these topics correctly.",
    qa:[
      ['Why is "People" new and important in v7?','The 6th edition had no people element. v7 puts people at the centre because a temporary team, assembled across boundaries, needs active leadership. It is a pillar, not a footnote.'],
      ['What are the people-focused themes?','Leading successful change; leading and managing successful teams (cultural intelligence, competencies, team development, social cohesion); and communication.'],
      ['Change management vs change control — what is the difference?','Change management (People element) is the HUMAN side — helping people adopt the change, via the Change Management Approach. Change control (Issues practice) is about controlling changes to BASELINES. Same word, different homes.'],
      ['Is communication one-way or two-way?','Bidirectional. The Communication Management Approach defines the means and frequency of communication AND feedback — not just broadcasting at stakeholders.'],
      ['What is a "practice", and what was it called before?','An aspect of project management applied continuously, all seven in parallel. Called "themes" in the 6th edition; renamed "practices" in v7.'],
      ['What is the second practice called?','Organization: the courseware calls it the organization practice, and the 6th edition used the same name. The syllabus mostly says "organizing". Both refer to the same practice, so neither name is a trap.'],
      ['What three questions does the Business Case practice answer?','Is the project Desirable (benefits vs cost/risk), Viable (can we deliver it), and Achievable (can the products produce the benefits)?'],
      ['What is the value chain, and the output-vs-benefit trap?','Outputs → Outcomes → Benefits, contributing to business objectives (a capability links an output to the outcome it enables). The classic trap is confusing an output (what you build) with a benefit (the measurable improvement).'],
      ['What is a dis-benefit?','A measurable decline resulting from an outcome, perceived as negative by one or more stakeholders — planned for, not ignored.'],
      ['Who owns the business case vs who specifies benefits?','The Executive owns the business case. The Senior User specifies the benefits and confirms they are on track. The Project Manager owns neither.'],
      ['What are the three Project Board interests?','Business (Executive — one only, chairs the Board, cannot be the PM), User (Senior User), Supplier (Senior Supplier). Can be more than one Senior User/Supplier, but only one Executive.'],
      ['Quality planning vs control vs assurance?','Planning = defining specifications up front. Control = checking products against them as built. Assurance = independent confidence that quality requirements will be met, independent of the project team (not the same as project assurance).'],
      ['What are the four plan types?','Project Plan, Stage Plan, Team Plan (optional), and Exception Plan (replaces a Stage or Project Plan — never a Team Plan).'],
      ['What are the four product-based planning steps?','Create the project product description → create the product breakdown structure → write the product descriptions → create the product flow diagram.'],
      ['Can a risk be positive? What are the paired responses?','Yes — a risk can be a threat (negative) or an opportunity (positive). Paired responses: Avoid/Exploit, Reduce/Enhance; plus Transfer, Share, Accept, and prepare contingent plans. There is no "reject" response in v7.'],
      ['Risk owner vs risk action owner?','The risk owner manages the risk (accountable); the risk action owner carries out a specific response action. It is also known as the risk actionee.'],
      ['What types of issue does PRINCE2 7 recognize?','Problem/concern, event external to the project, business opportunity, request for change, and off-specification. Issue management also encompasses change control.'],
      ['Who decides on a change that affects a baseline?','The PM decides within delegated limits; if a baseline (business case, Project Plan) is affected, the Board or a delegated Change Authority decides. A change budget can fund changes.'],
      ['Time-driven vs event-driven controls?','Time-driven happen at regular intervals (Highlight Reports PM→Board; Checkpoint Reports team→PM). Event-driven are triggered by an event (End Stage Report at a boundary; Exception Report on a forecast breach).']
    ]
  },
  {

      ["What are the five integrated elements of PRINCE2 7?", "Principles, people, practices, processes and the project context. People is new in PRINCE2 7: an option listing four elements without people is the 6th-edition answer."],
      ["Who does \"people\" cover?", "Two groups: those working on the project, and those affected by it. A perfect product still fails if the people affected by it do not adopt it."],
      ["Organizational ecosystem vs project ecosystem?", "The organizational ecosystem is the wider organization and environment the project sits in. The project ecosystem is the people and groups involved in the project and their relationships. They overlap."],
      ["What are the three people-focused areas?", "Leading successful change, leading successful teams, and communication. They run through all of project management, not as separate stages."],

      ["Change management vs change control?", "Change management (people element) helps people adopt the change, from current state to target state. Change control (issues practice) approves, rejects or defers changes to the project baseline."],
      ["What is a stakeholder?", "Any individual, group or organization that can affect, be affected by, or perceive itself to be affected by the project. Perceiving yourself to be affected is enough."],
      ["What is culture, and can a project have its own?", "The set of shared attitudes, values, goals and ways of working of a group. A project can have its own culture, distinct from the business but aligned with the wider ecosystem."],
      ["Leadership vs management?", "Leadership motivates people to achieve the project's objectives: building common understanding, agreeing ways of working, seeking feedback on commitment. Management instructs the execution of tasks: explaining how a task is done, following up on completion."],

      ["What is the communication management approach, and who documents it?", "It defines the means and frequency of communication with, and feedback from, the project ecosystem, so it is two-way. The project manager documents it during initiating a project, as a PID section or a stand-alone product."],

  {

    qa:[
      ["What is the purpose of the business case practice?", "To establish mechanisms to judge whether the project is, and remains, desirable, viable and achievable. The judgement continues through the whole project."],
      ["What is the chain from outputs to business objectives?", "Outputs deliver capabilities. Capabilities, once embedded, create outcomes. Outcomes are measured by benefits (and dis-benefits). Benefits lead to business objectives."],
      ["Output vs outcome vs benefit, with an example?", "Output: a new banking app (the product handed over). Outcome: customers stop visiting branches for routine tasks (the result of using it). Benefit: lower branch costs (the measurable improvement)."],

      ["How does the business case evolve?", "The project mandate (from the business) sets expectations and constraints. The project brief contains the outline business case, in starting up a project. The full business case is developed during initiation."],

      ["When are benefits confirmed?", "During the delivery stages, in the final delivery stage, and after the project has closed. Many benefits only appear once outputs are in use."],
      ["What does the business case document?", "The business justification: expected costs against estimated benefits, offset by the associated risks, and how and when the benefits will be measured."],
      ["What is the benefits management approach?", "It defines the management actions that ensure the project's outcomes are achieved and its benefits realized, including the forecast amount and timing of benefits and their tolerances."],
      ["What is the sustainability management approach?", "Part of the PID. It defines the actions, reviews and controls that ensure the project's sustainability performance targets are achieved."],

  {
    n:'3c', id:'7YsKQ2DitZQ', title:"The Risk Practice",
    blurb:"How risk is measured, the key concepts, the response types, the technique and who does what.",
    note:"The video calls “risk actionee” the 6th-edition name. The official manual says the risk action owner is also known as the risk actionee, so an exam option using “actionee” is not wrong for that reason.",
    qa:[
      ["What is a risk, and how is it measured?", "An uncertain event or set of events that, should it occur, will affect objectives: a threat or an opportunity. It is measured by a combination of probability (likelihood) and impact."],
      ["Is proximity part of how a risk is measured?", "No. Proximity is when the risk could occur, which tells you how urgently to act. The measure is probability and impact. Proximity is estimated in the assess step."],
      ["What is the purpose of the risk practice?", "To identify, assess and control uncertainties and, as a result, improve the ability of the project to succeed."],
      ["Risk appetite vs risk tolerance?", "Appetite is the organization's attitude to taking risk, reflecting its risk culture. Tolerance is the threshold of risk exposure that, if exceeded, must be escalated."],
      ["How is a risk described?", "By cause (the source), event (the uncertain thing that may happen) and effect (the impact on objectives)."],
      ["Risk owner vs risk action owner?", "The risk owner is accountable for managing a particular risk. The risk action owner carries out a specific response, and may be a different person. The official manual notes this role is also known as the risk actionee."],
      ["What is the risk budget?", "Money set aside within the project budget to fund risk responses. The courseware says it should be explicit and ring-fenced."],
      ["What are the risk response types?", "Eight names in six rows. Avoid (threat) and exploit (opportunity) pair up; so do reduce and enhance. Transfer, share, accept and prepare contingent plans each apply to threats and opportunities alike. There is no reject or fallback response."],
      ["Residual vs secondary risk?", "A residual risk is what remains after a response. A secondary risk is a new risk created by the response itself."],
      ["What is the risk management technique?", "Identify, assess, plan, implement, with communicate running throughout. Assess estimates probability, impact and proximity, then evaluates the overall effect."],
      ["Which decision biases does the courseware name?", "Optimism bias, loss aversion, groupthink and proximity bias (overweighting what is near in time). Do not confuse proximity bias with proximity as a risk concept."],
      ["What are the two risk products, and who maintains the register?", "The risk management approach (in the PID) and the risk register (in the project log). The project manager maintains the risk register."],
    ]
  },
  {
