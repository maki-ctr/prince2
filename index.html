<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRINCE2 Foundation — Interactive Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1f24; --ink-soft:#454d56; --paper:#f4f1ea; --paper-2:#ece7dc;
  --card:#fffdf8; --line:#d9d2c4; --line-soft:#e6e0d3;
  --navy:#1c3b5a; --navy-2:#244c73; --gold:#b07c2b; --gold-soft:#d9a94f;
  --green:#2f6b4f; --red:#a93b2e; --red-soft:#f3e3df; --green-soft:#e0ede6;
  --shadow:0 1px 2px rgba(26,31,36,.04),0 8px 24px rgba(26,31,36,.06);
  --shadow-lg:0 4px 12px rgba(26,31,36,.08),0 24px 48px rgba(26,31,36,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Spline Sans',sans-serif; background:var(--paper); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 20% 0%,rgba(28,59,90,.03),transparent 40%),radial-gradient(circle at 90% 100%,rgba(176,124,43,.04),transparent 45%);
  background-attachment:fixed;
}
.serif{font-family:'Fraunces',serif}
.mono{font-family:'Spline Sans Mono',monospace}

/* ---------- Layout shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:260px;flex-shrink:0;background:var(--navy);color:#e8eef3;
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 0;
  border-right:1px solid rgba(0,0,0,.2);
}
.brand{padding:0 26px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.brand .crest{font-family:'Fraunces',serif;font-weight:800;font-size:25px;letter-spacing:-.5px;line-height:1.05}
.brand .crest em{color:var(--gold-soft);font-style:normal}
.brand .sub{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#9bb0c4;margin-top:6px}
.nav{list-style:none;padding:0 14px}
.nav li{margin:1px 0}
.nav button{
  width:100%;text-align:left;background:none;border:none;color:#c3d2e0;
  font-family:'Spline Sans',sans-serif;font-size:14.5px;font-weight:500;
  padding:10px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:11px;
  transition:all .15s;
}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--gold);color:#1a1206;font-weight:600}
.nav .ico{font-size:16px;width:20px;text-align:center;opacity:.9}
.nav-sec{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#7c93a8;padding:18px 18px 7px}
.sb-foot{padding:18px 26px 0;font-size:11.5px;color:#8ba0b4;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;background:var(--navy);color:#fff;padding:14px 18px;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;
}
.topbar .crest{font-family:'Fraunces',serif;font-weight:800;font-size:19px}
.topbar .crest em{color:var(--gold-soft);font-style:normal}
.burger{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 11px;font-size:18px;cursor:pointer}
.content{flex:1;padding:46px 52px 90px;max-width:920px;width:100%;margin:0 auto}

/* ---------- Typography ---------- */
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
h1.page{font-family:'Fraunces',serif;font-weight:800;font-size:42px;line-height:1.05;letter-spacing:-1px;margin-bottom:14px}
h1.page .small{font-size:.5em;color:var(--gold);font-weight:600;display:block;letter-spacing:0}
.lede{font-size:18px;color:var(--ink-soft);max-width:64ch;margin-bottom:34px}
h2.sec{font-family:'Fraunces',serif;font-weight:800;font-size:27px;margin:40px 0 14px;letter-spacing:-.5px;padding-bottom:8px;border-bottom:2px solid var(--line)}
h3.sub{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:26px 0 8px;color:var(--navy)}
p{margin-bottom:14px}
.content a{color:var(--navy-2);text-decoration:underline;text-decoration-color:var(--gold-soft);text-underline-offset:2px}
strong{font-weight:600;color:var(--ink)}

/* ---------- Cards & callouts ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.callout{border-left:4px solid var(--gold);background:var(--paper-2);border-radius:0 12px 12px 0;padding:16px 20px;margin:18px 0}
.callout.trap{border-color:var(--red);background:var(--red-soft)}
.callout.key{border-color:var(--green);background:var(--green-soft)}
.callout .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:5px;color:var(--gold)}
.callout.trap .tag{color:var(--red)}
.callout.key .tag{color:var(--green)}

/* principle/practice/process numbered blocks */
.pblock{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.pblock:last-child{border-bottom:none}
.pnum{flex-shrink:0;width:42px;height:42px;border-radius:12px;background:var(--navy);color:var(--gold-soft);
  font-family:'Fraunces',serif;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.pbody h4{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:4px}
.pbody .stmt{font-size:14.5px;color:var(--ink-soft)}
.pbody .hook{font-size:13px;margin-top:6px;color:var(--gold);font-weight:500}
.pbody .hook b{color:var(--navy)}

table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:13px}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:rgba(0,0,0,.015)}

.lifecycle{background:var(--navy);color:#dce6ef;border-radius:14px;padding:22px;font-family:'Spline Sans Mono',monospace;
  font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre;margin:18px 0}
.lifecycle b{color:var(--gold-soft)}

.recall{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#eef3f8;border-radius:14px;padding:22px 24px;margin:22px 0}
.recall .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:8px}
.recall ol{margin-left:18px;font-size:14.5px}
.recall li{margin:5px 0}

/* ---------- Progress bits ---------- */
.prog-wrap{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:99px;transition:width .5s}
.btn{font-family:'Spline Sans',sans-serif;font-weight:600;font-size:14.5px;border:none;border-radius:11px;padding:11px 22px;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-gold{background:var(--gold);color:#1a1206}
.btn-gold:hover{background:var(--gold-soft);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--navy);background:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--paper-2);color:var(--ink-soft)}
.pill.ok{background:var(--green-soft);color:var(--green)}

/* ---------- Dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.stat .n{font-family:'Fraunces',serif;font-weight:800;font-size:38px;line-height:1;color:var(--navy)}
.stat .n .u{font-size:18px;color:var(--ink-soft)}
.stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px}
.checklist{list-style:none}
.checklist li{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.checklist .box{flex-shrink:0;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .15s}
.checklist .box.done{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Flashcards ---------- */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:10px}
.flashcard{width:100%;max-width:560px;height:min(320px,58vh);perspective:1600px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;padding:34px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow-lg)}
.fc-front{background:var(--card);border:1px solid var(--line)}
.fc-back{background:var(--navy);color:#eef3f8;transform:rotateY(180deg)}
.fc-deck{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px}
.fc-back .fc-deck{color:var(--gold-soft)}
.fc-text{font-family:'Fraunces',serif;font-size:21px;line-height:1.35;white-space:pre-line}
.fc-back .fc-text{font-size:16px;font-family:'Spline Sans',sans-serif;line-height:1.55}
.fc-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-soft);opacity:.7}
.fc-back .fc-hint{color:#9bb0c4}
.fc-rate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- Quiz / drill ---------- */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 30px;box-shadow:var(--shadow-lg);margin-bottom:18px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;color:var(--ink-soft)}
.q-sec-tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.q-text{font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.4;margin-bottom:22px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
  border-radius:13px;padding:15px 17px;margin-bottom:11px;cursor:pointer;font-size:15px;transition:all .14s;font-family:'Spline Sans',sans-serif;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy-2);background:var(--card)}
.opt .ltr{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all .14s}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .ltr{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .ltr{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.explain{border-radius:12px;padding:15px 18px;margin-top:6px;font-size:14.5px;line-height:1.5;display:none}
.explain.show{display:block}
.explain.right{background:var(--green-soft);border-left:4px solid var(--green)}
.explain.wrong{background:var(--red-soft);border-left:4px solid var(--red)}
.explain .v{font-weight:700;display:block;margin-bottom:3px}
.explain.right .v{color:var(--green)}
.explain.wrong .v{color:var(--red)}

.quiz-setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin:20px 0}
.sec-choice{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:all .15s;text-align:left}
.sec-choice:hover{border-color:var(--navy)}
.sec-choice.sel{border-color:var(--gold);background:var(--paper-2)}
.sec-choice h4{font-family:'Fraunces',serif;font-size:17px;margin-bottom:3px}
.sec-choice .c{font-size:13px;color:var(--ink-soft)}
.sec-choice .acc{font-size:12px;margin-top:7px;font-weight:600}

.timer{font-family:'Spline Sans Mono',monospace;font-weight:500;font-size:15px;padding:5px 13px;border-radius:9px;background:var(--navy);color:#fff}
.timer.warn{background:var(--red)}
.exam-nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin:16px 0}
.qdot{aspect-ratio:1;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:all .12s}
.qdot.answered{background:var(--navy);color:#fff;border-color:var(--navy)}
.qdot.flagged{border-color:var(--gold);background:var(--gold-soft);color:#1a1206}
.qdot.current{outline:3px solid var(--gold);outline-offset:1px}

.result-ring{width:170px;height:170px;margin:0 auto 10px;position:relative}
.result-ring svg{transform:rotate(-90deg)}
.result-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result-ring .pct .n{font-family:'Fraunces',serif;font-weight:800;font-size:42px;line-height:1}
.result-ring .pct .l{font-size:12px;color:var(--ink-soft);letter-spacing:1px}

.verdict{text-align:center;font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:8px 0}
.verdict.pass{color:var(--green)}.verdict.fail{color:var(--red)}

.breakdown{margin:18px 0}
.bd-row{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:14px}
.bd-row .nm{width:110px;font-weight:500;text-transform:capitalize}
.bd-row .track{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bd-row .fill{height:100%;border-radius:99px}
.bd-row .sc{width:54px;text-align:right;font-family:'Spline Sans Mono',monospace;font-size:13px}

.hidden{display:none!important}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .fc-inner{transition:none!important}
  html{scroll-behavior:auto}
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0}
.table-scroll table{margin:0}

.scrim{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:45;display:none}
.scrim.show{display:block}

@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .topbar{display:flex}
  .content{padding:26px 20px 80px}
  h1.page{font-size:32px}
  .lede{font-size:16px}
}
</style>
</head>

<script>
// PRINCE2 Foundation — 100-question bank
// section: principles | practices | processes | products | roles | tailoring
let QUESTIONS = [
// ---------- PRINCIPLES (1-15) ----------
{s:"principles",q:"Which principle requires the project to stop if it is no longer justified?",o:["Manage by stages","Continued business justification","Learn from experience","Tailor to suit the project"],a:1,e:"Continued business justification: a project must remain justified throughout, and stops if justification collapses."},
{s:"principles",q:"How many principles does PRINCE2 define?",o:["5","6","7","8"],a:2,e:"PRINCE2 defines exactly 7 principles."},
{s:"principles",q:"Which principle requires that lessons are sought, recorded, and acted upon?",o:["Learn from experience","Continued business justification","Focus on products","Manage by exception"],a:0,e:"Learn from experience covers seeking, recording and acting on lessons throughout."},
{s:"principles",q:"Which principle requires the project to have at least two management stages?",o:["Focus on products","Manage by stages","Defined roles and responsibilities","Tailor to suit the project"],a:1,e:"Manage by stages requires a minimum of two: initiation plus at least one delivery stage."},
{s:"principles",q:"Which of the following is NOT a PRINCE2 principle?",o:["Manage by exception","Focus on products","Deliver on time and to budget","Tailor to suit the project"],a:2,e:"'Deliver on time and to budget' is not a principle — a distractor."},
{s:"principles",q:"The principle 'defined roles, responsibilities and relationships' requires which three stakeholder interests are engaged?",o:["Business, project, supplier","Customer, programme, project","Business, user, supplier","Executive, manager, team"],a:2,e:"The three interests are business, user, supplier."},
{s:"principles",q:"Which principle establishes limits of delegated authority?",o:["Continued business justification","Manage by stages","Manage by exception","Focus on products"],a:2,e:"Manage by exception sets tolerances that define delegated authority limits."},
{s:"principles",q:"Tailoring a PRINCE2 project is:",o:["Optional, depending on the project","Mandatory","Only for large projects","Only for small projects"],a:1,e:"Tailoring is mandatory for all PRINCE2 projects."},
{s:"principles",q:"Which principle states that PRINCE2 is product-based, not activity-based?",o:["Focus on products","Manage by stages","Continued business justification","Learn from experience"],a:0,e:"Focus on products: plan by deliverables and their quality, then derive activities."},
{s:"principles",q:"At which point is continued business justification reviewed?",o:["Only at project start","Only at project close","At every stage boundary","Never explicitly"],a:2,e:"Reviewed at every stage boundary (and during exception handling)."},
{s:"principles",q:"Which principle CANNOT be tailored away?",o:["Continued business justification","Manage by stages","All seven principles","Focus on products"],a:2,e:"No principle can be tailored away — all seven always apply."},
{s:"principles",q:"The principle 'manage by exception' relates to:",o:["Issues that escalate to corporate","Tolerances and escalation paths","Risk assessment only","Quality criteria"],a:1,e:"It concerns tolerances and the escalation path when they are forecast to be exceeded."},
{s:"principles",q:"Which principle drives the use of Product Descriptions?",o:["Continued business justification","Focus on products","Manage by stages","Defined roles and responsibilities"],a:1,e:"Focus on products drives product-based planning and Product Descriptions."},
{s:"principles",q:"Lessons are passed forward at:",o:["The start of the project only","The end of the project only","Throughout the project, with formal handover at project close","Only when problems occur"],a:2,e:"Captured throughout, formally handed forward at close via the Lessons Report."},
{s:"principles",q:"The 'continued' in 'continued business justification' means:",o:["Justification at every stage boundary and on demand","Continuous work without interruption","Continuing past project closure","Justification at corporate level only"],a:0,e:"Justification is re-confirmed at every stage boundary and whenever needed."},
// ---------- PRACTICES (16-35) ----------
{s:"practices",q:"Which document captures the customer's quality expectations?",o:["Quality Register","Project Product Description","Quality Management Approach","Acceptance Criteria"],a:1,e:"Customer's quality expectations are captured in the Project Product Description (origin: Project Brief)."},
{s:"practices",q:"Who owns the Business Case?",o:["Project Manager","Senior User","Executive","Project Board collectively"],a:2,e:"The Executive owns the Business Case throughout."},
{s:"practices",q:"Which is NOT a response to a threat?",o:["Avoid","Reduce","Exploit","Transfer"],a:2,e:"Exploit is an OPPORTUNITY response, not a threat response."},
{s:"practices",q:"Which is a response to an opportunity?",o:["Reduce","Avoid","Enhance","Transfer"],a:2,e:"Enhance is an opportunity response."},
{s:"practices",q:"The 'outline' Business Case is produced in which process?",o:["Initiating a Project","Starting up a Project","Controlling a Stage","Closing a Project"],a:1,e:"Outline Business Case is produced in Starting up a Project (SU)."},
{s:"practices",q:"The 'detailed' Business Case is produced in which process?",o:["Initiating a Project","Starting up a Project","Directing a Project","Managing a Stage Boundary"],a:0,e:"Detailed Business Case is produced in Initiating a Project (IP)."},
{s:"practices",q:"How many levels of plan does PRINCE2 define?",o:["2","3","4","5"],a:1,e:"Three: Project Plan, Stage Plan, Team Plan (Exception Plan replaces Stage/Project Plan)."},
{s:"practices",q:"An Exception Plan replaces:",o:["Any plan in the hierarchy","A Stage Plan or Project Plan (not Team Plan)","Only a Stage Plan","Only the Project Plan"],a:1,e:"It replaces a Stage Plan or Project Plan — never a Team Plan."},
{s:"practices",q:"Which is NOT a tolerance area in PRINCE2?",o:["Cost","Time","Reputation","Risk"],a:2,e:"The six are time, cost, scope, quality, benefits, risk. Reputation is not one."},

{deck:"Principles",front:"Continued business justification — one line + who owns it?",back:"A project must stay justified throughout; stops if justification collapses. Owned by the Executive via the Business Case, reviewed at every stage boundary."},

{deck:"Principles",front:"Manage by stages — minimum stages?",back:"Minimum two management stages: the initiation stage + at least one delivery stage. (Closure and SU are NOT stages.)"},
{deck:"Principles",front:"Manage by exception — the 6 tolerances?",back:"Time, Cost, Scope, Quality, Benefits, Risk. Stay within tolerance = no escalation; forecast breach = raise an Exception to the level above."},
{deck:"Principles",front:"Focus on products — central artefact?",back:"Product-based planning. The Product Description defines quality; the Product Breakdown Structure decomposes deliverables. Activities are derived from products, not the reverse."},

{deck:"Practices",front:"Business Case — output-outcome-benefit chain + negative term?",back:"Outputs (what's produced) → outcomes (resulting change) → benefits (measurable improvement). Negative outcome = dis-benefit. Executive owns it."},

{deck:"Practices",front:"Risk — threat responses (5+1) and opportunity responses (4)?",back:"Threats: avoid, reduce, transfer, share, accept (+ prepare contingent plans). Opportunities: exploit, enhance, share, accept (reject also possible)."},

<script>
/* ============ PRINCE2 Foundation app ============ */
const LS = 'p2f_state_v1';
const STATE_VERSION = 2;
let state = load();
function defaults(){
  return { version:STATE_VERSION, read:{}, cards:{}, examBest:null, examHistory:[],
           drillStats:{}, checklist:{}, recentSeen:[], lastView:'dashboard' };
}
function migrate(raw){
  if(!raw || typeof raw!=='object') return defaults();
  // v1 (no version, or older card shape) → v2
  if(!raw.version || raw.version<2){
    // old flashcard shape was {due,grade,ts}; reset to SM-2 baseline so intervals recompute cleanly
    if(raw.cards){
      Object.keys(raw.cards).forEach(k=>{
        const m=raw.cards[k];
        if(m && m.ease===undefined){
          raw.cards[k]={ease:2.5, interval:1, reps:1, lapses:0, due:m.due||Date.now(), last:m.ts||Date.now()};
        }
      });
    }
    raw.recentSeen = raw.recentSeen||[];
    raw.version = 2;
  }
  return raw;
}
function load(){
  let parsed;
  try{ parsed = JSON.parse(localStorage.getItem(LS)||'{}'); }
  catch(e){ return defaults(); }
  const merged = Object.assign(defaults(), migrate(parsed));
  // guard: ensure nested containers exist even if stored state was partial
  ['read','cards','drillStats','checklist'].forEach(k=>{ if(!merged[k]||typeof merged[k]!=='object')merged[k]={}; });
  if(!Array.isArray(merged.examHistory))merged.examHistory=[];
  if(!Array.isArray(merged.recentSeen))merged.recentSeen=[];
  return merged;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }

/* ---------- Navigation ---------- */
const VIEWS = [
  {id:'dashboard', label:'Dashboard', ico:'◆', group:'main'},
  {id:'principles', label:'The 7 Principles', ico:'①', group:'main'},
  {id:'practices', label:'The 7 Practices', ico:'②', group:'main'},
  {id:'processes', label:'The 7 Processes', ico:'③', group:'main'},
  {id:'products', label:'Management Products', ico:'④', group:'main'},
  {id:'roles', label:'Roles', ico:'⑤', group:'main'},
  {id:'tailoring', label:'Tailoring', ico:'⑥', group:'main'},
  {id:'practitioner', label:'Practitioner Intro', ico:'✦', group:'main'},
  {id:'schedule', label:'3-Week Schedule', ico:'▦', group:'main'},
  {id:'flashcards', label:'Flashcards', ico:'⊞', group:'practice'},
  {id:'drill', label:'Drill by Topic', ico:'✎', group:'practice'},
  {id:'exam', label:'Mock Exam', ico:'⏱', group:'practice'},
  {id:'checklist', label:'Pre-Exam Checklist', ico:'✓', group:'practice'},
];
function buildNav(){
  const m=document.getElementById('navMain'), p=document.getElementById('navPractice');
  m.innerHTML=''; p.innerHTML='';
  VIEWS.forEach(v=>{
    const li=document.createElement('li');
    li.innerHTML=`<button data-v="${v.id}" onclick="go('${v.id}')"><span class="ico">${v.ico}</span>${v.label}</button>`;
    (v.group==='main'?m:p).appendChild(li);
  });
}
function go(id){
  state.lastView=id; save();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.v===id));
  const c=document.getElementById('content');
  c.innerHTML=''; c.scrollTop=0; window.scrollTo(0,0);
  try{
    (RENDER[id]||RENDER.dashboard)(c);
  }catch(e){
    c.innerHTML=`<div class="card" style="text-align:center;padding:40px">
      <div class="serif" style="font-size:22px;font-weight:600;margin-bottom:6px">Something went wrong</div>
      <p style="color:var(--ink-soft)">That view hit an error. Your saved progress is safe.</p>
      <button class="btn btn-primary" onclick="go('dashboard')">Back to dashboard</button></div>`;
    if(window.console)console.error('render error:',id,e);
  }
  c.classList.remove('fade'); void c.offsetWidth; c.classList.add('fade');
  // make any tables horizontally scrollable on small screens
  if(c.querySelectorAll){
    c.querySelectorAll('table').forEach(t=>{
      if(t.parentElement && t.parentElement.classList && t.parentElement.classList.contains('table-scroll'))return;
      const wrap=document.createElement('div'); wrap.className='table-scroll';
      t.parentNode.insertBefore(wrap,t); wrap.appendChild(t);
    });
  }
  if(c.focus)try{c.focus();}catch(e){}
  closeNav();
}
function openNav(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show');}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}

/* ---------- helpers ---------- */
function markRead(topic){ if(!state.read[topic]){state.read[topic]=true;save();} }
const SECTIONS=['principles','practices','processes','products','roles','tailoring'];
const SEC_LABEL={principles:'Principles',practices:'Practices',processes:'Processes',products:'Products',roles:'Roles',tailoring:'Tailoring & General'};
const LETTERS=['A','B','C','D'];

/* ============================================================
   RENDERERS
============================================================ */
const RENDER = {};

/* ---------------- DASHBOARD ---------------- */
RENDER.dashboard = (c)=>{
  const readN = SECTIONS.concat(['practitioner','schedule']).filter(t=>state.read[t]).length;
  const readTotal = 8;
  const cardsSeen = Object.keys(state.cards).length;
  const best = state.examBest;
  const checkN = Object.values(state.checklist).filter(Boolean).length;
  c.innerHTML = `
    <div class="eyebrow">Projects in Controlled Environments</div>
    <h1 class="page">PRINCE2 Foundation<span class="small">Interactive self-study · 7th edition</span></h1>
    <p class="lede">Everything in one place: the full framework, spaced-repetition flashcards, topic drills, and a timed 60-question mock exam. Your progress saves automatically in this browser.</p>

    <div class="dash-grid">
      <div class="stat"><div class="n">${readN}<span class="u">/${readTotal}</span></div><div class="l">Sections read</div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${readN/readTotal*100}%"></div></div></div>
      <div class="stat"><div class="n">${cardsSeen}<span class="u">/${CARDS.length}</span></div><div class="l">Flashcards reviewed</div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${cardsSeen/CARDS.length*100}%"></div></div></div>
      <div class="stat"><div class="n">${best!==null?best:'—'}<span class="u">${best!==null?'%':''}</span></div><div class="l">Best mock exam${best!==null?(best>=85?' · exam-ready ✓':best>=70?' · nearly there':' · keep drilling'):''}</div></div>
      <div class="stat"><div class="n">${checkN}<span class="u">/13</span></div><div class="l">Checklist items done</div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${checkN/13*100}%"></div></div></div>
    </div>

    <div class="callout key"><div class="tag">How to use this</div>
      Read the six framework sections in order first. Then live in <strong>Flashcards</strong> and <strong>Drill by Topic</strong> daily. In week three, take <strong>Mock Exams</strong> until you clear 85% comfortably. Pass mark on the real exam is 55% (33/60) — aim well above it.</div>

    <h2 class="sec">Jump back in</h2>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="go('${state.read.principles?'flashcards':'principles'}')">${state.read.principles?'Review flashcards':'Start: The 7 Principles'} →</button>
      <button class="btn btn-gold" onclick="go('exam')">Take a mock exam</button>
      <button class="btn btn-ghost" onclick="go('drill')">Drill a topic</button>
    </div>

    <h2 class="sec">The framework at a glance</h2>
    <p>PRINCE2 is a <strong>closed framework</strong>: exactly 7 principles, 7 practices, 7 processes, a fixed set of management products, and a defined role structure. The exam tests the framework <em>as written</em> — answer with the textbook answer, not your professional instinct. The mental model is a four-layer cake:</p>
    <div class="lifecycle"><b>PRINCIPLES</b>  (why)        →  the guiding rules, all 7 always apply
<b>PRACTICES</b>   (what)       →  aspects addressed continuously
<b>PROCESSES</b>   (when)       →  what you do, in what order
<b>PRODUCTS</b>    (artefacts)  →  the documents produced
        ROLES cut across all four layers</div>

    ${best!==null && state.examHistory.length?`<h2 class="sec">Mock exam history</h2>
    <table><tr><th>Attempt</th><th>Score</th><th>Result</th><th>Date</th></tr>
    ${state.examHistory.slice(-6).reverse().map((h,i)=>`<tr><td>#${state.examHistory.length-i}</td><td>${h.pct}% (${h.correct}/60)</td><td>${h.pct>=55?'<span class="pill ok">Pass</span>':'<span class="pill">Below pass</span>'}</td><td>${h.date}</td></tr>`).join('')}
    </table>`:''}
  `;
};

/* ---------------- COURSE CONTENT ---------------- */
function courseShell(c, topic, eyebrow, title, lede, bodyHTML, recallHTML){
  markRead(topic);
  c.innerHTML = `
    <div class="eyebrow">${eyebrow}</div>
    <h1 class="page">${title}</h1>
    <p class="lede">${lede}</p>
    ${bodyHTML}
    ${recallHTML||''}
    <div style="margin-top:34px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="go('drill')">Drill this topic →</button>
      <button class="btn btn-ghost" onclick="go('flashcards')">Flashcards</button>
    </div>`;
}
function pblock(n,name,stmt,hook){
  return `<div class="pblock"><div class="pnum">${n}</div><div class="pbody">
    <h4>${name}</h4><div class="stmt">${stmt}</div><div class="hook">Exam hook: ${hook}</div></div></div>`;

RENDER.principles = (c)=>courseShell(c,'principles','Part 1','The 7 Principles',

    ${pblock(2,'Learn from experience','Lessons are sought, recorded and acted upon. Review prior lessons at start, capture new ones during, pass them forward at close.','Lessons Log, Lessons Report, lesson-gathering in <b>SU</b>.')}
    ${pblock(3,'Defined roles, responsibilities & relationships','An organisation structure engaging three interests — business, user, supplier — on the Project Board.','who does what; who approves what; the <b>three interests</b>.')}
    ${pblock(4,'Manage by stages','Planned, monitored and controlled stage-by-stage. Minimum two: the initiation stage + at least one delivery stage.','"minimum of two stages"; Stage Plan approval; Board at stage ends.')}
    ${pblock(5,'Manage by exception','Defined tolerances for each objective set limits of delegated authority. Stay within tolerance, don\'t escalate; forecast a breach, raise an Exception.','the <b>six tolerances</b>; who sets them for whom; what triggers an Exception Report.')}
    ${pblock(6,'Focus on products','Product-based, not activity-based: define products and their quality first, then derive the activities.','Product-based planning; Product Descriptions; Product Breakdown Structure.')}
    ${pblock(7,'Tailor to suit the project','Adapt to environment, size, complexity, importance, capability and risk. Mandatory — but principles cannot be tailored away, and tailoring is documented in the PID.','"tailoring is mandatory"; "principles cannot be tailored"; "recorded in the PID".')}
  </div>
  <div class="callout"><div class="tag">The six tolerances</div><strong>Time · Cost · Scope · Quality · Benefits · Risk.</strong> Memorise these six — they recur across "manage by exception" and the Progress practice. "Reputation" and "resource" are common distractors.</div>
  <div class="callout trap"><div class="tag">Classic trap</div>The minimum is <strong>two management stages</strong>, not three. Closure ("Closing a Project") and start-up ("Starting up a Project") are <em>processes</em>, not stages. Only <strong>initiation + delivery</strong> count as stages.</div>`,

RENDER.practices = (c)=>courseShell(c,'practices','Part 2','The 7 Practices',

  `<div class="card">
    ${pblock(1,'Business Case','Judges whether the project is desirable, viable and achievable. Outline in SU → detailed in IP → reviewed at every stage boundary. <b>Executive owns it.</b> Chain: outputs → outcomes → benefits; a negative outcome is a <b>dis-benefit</b>.','outline vs detailed timing; dis-benefits; benefits measured <em>after</em> close.')}
    ${pblock(2,'Organising','Four levels: corporate/programme/customer · directing (Board) · managing (PM) · delivering (Team Managers). Three Board interests: business, user, supplier.','the four levels; Project Assurance = oversight; Project Support = admin; combination rules.')}
    ${pblock(3,'Plans','Three levels: Project Plan, Stage Plan, Team Plan. An Exception Plan replaces a Stage or Project Plan — never a Team Plan. Product-based planning.','three levels; what an Exception Plan replaces; who approves what.')}
    ${pblock(4,'Quality','Quality planning (define fit-for-purpose) → quality control (check products) → quality assurance (external, corporate governance). Acceptance criteria = whole product (Senior User owns the Project Product Description); quality criteria = per product.','acceptance vs quality criteria; QA is <em>external</em>; Senior User owns the PPD.')}
    ${pblock(5,'Risk','Uncertain event(s) — threat or opportunity. Threat responses: avoid, reduce, transfer, share, accept (+ contingent plans). Opportunity: exploit, enhance, share, accept. Owner is accountable; actionee acts.','threat vs opportunity responses; owner vs actionee; Risk Budget (Board approves).')}
    ${pblock(6,'Issues','Things that have happened (vs risks, which might). Three types: request for change, off-specification, problem/concern. Daily Log (informal) vs Issue Register (formal).','the three issue types — especially off-specification; Daily Log vs Issue Register.')}
    ${pblock(7,'Progress','Monitor actual vs planned; forecast viability; control deviations. Six tolerances cascade down the levels. Reports: Highlight (PM→Board), Checkpoint (TM→PM), End Stage, End Project, Exception.','six tolerances; who reports to whom; time-driven vs event-driven controls.')}
  </div>
  <div class="callout key"><div class="tag">Two "assurance" words — don't confuse them</div><strong>Quality assurance</strong> sits <em>outside</em> the project (corporate/programme governance). <strong>Project Assurance</strong> sits <em>inside</em>, on behalf of the Project Board, and must be independent of the Project Manager.</div>
  <div class="callout trap"><div class="tag">Classic trap</div><strong>Off-specification</strong> = something that should be delivered (to standard) but won't be. It is <em>not</em> "a poorly written spec". A <strong>request for change</strong> is a proposed alteration to an approved baseline.</div>`,

/* ============ PRACTICE ENGINES ============ */

/* ---------------- FLASHCARDS (SM-2 spaced repetition) ---------------- */
/* Card memory shape: {ease, interval(days), reps, lapses, due(ts), last(ts)} */
let fcQueue=[], fcIdx=0, fcAgainPool=[];
const DAY=86400000;
function startOfTomorrow(days){
  // due at start of the day `days` out, not an exact-millisecond offset
  const d=new Date(); d.setHours(0,0,0,0); return d.getTime()+Math.max(0,Math.round(days))*DAY;
}
function fcSortKey(key){
  const m=state.cards[key];
  if(!m) return 0;              // unseen → highest priority
  return m.due||0;
}
function buildFcQueue(deck){
  let pool=CARDS.map((c,i)=>({c,key:'c'+i})).filter(x=>deck==='all'||x.c.deck===deck);
  pool.sort((a,b)=>fcSortKey(a.key)-fcSortKey(b.key));
  const now=Date.now();
  const due=pool.filter(x=>{const m=state.cards[x.key];return !m||(m.due||0)<=now;});
  return due.length?due:pool;   // if nothing due, allow a free review round
}
function isLeech(key){const m=state.cards[key];return m&&(m.lapses||0)>=4;}
RENDER.flashcards=(c)=>{
  const decks=['all',...[...new Set(CARDS.map(x=>x.deck))]];
  const seen=Object.keys(state.cards).length;
  const now=Date.now();
  const dueNow=CARDS.filter((_,i)=>{const m=state.cards['c'+i];return m&&(m.due||0)<=now;}).length;
  const fresh=CARDS.filter((_,i)=>!state.cards['c'+i]).length;
  const leeches=CARDS.filter((_,i)=>isLeech('c'+i)).length;
  c.innerHTML=`
    <div class="eyebrow">Practice</div>
    <h1 class="page">Flashcards</h1>
    <p class="lede">Real spaced repetition (SM-2). Rate honestly — intervals grow as you recall well and reset when you lapse. <strong>Again</strong> cards reappear before the round ends.</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px">
      <span class="pill">${seen}/${CARDS.length} started</span>
      <span class="pill ${dueNow?'':''}">${dueNow} due now</span>
      <span class="pill">${fresh} new</span>
      ${leeches?`<span class="pill" style="background:var(--red-soft);color:var(--red)">${leeches} struggling</span>`:''}
    </div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px" id="fcDecks">
      ${decks.map(d=>`<button class="btn btn-ghost" style="padding:8px 16px" onclick="App.startFc('${d}')">${d==='all'?'All decks':d}</button>`).join('')}
    </div>
    <div id="fcArea"></div>`;
};
function startFc(deck){
  fcQueue=buildFcQueue(deck); fcIdx=0; fcAgainPool=[];
  renderFc();
}
function renderFc(){
  const area=document.getElementById('fcArea');
  // pull in any "Again" cards once the main queue is exhausted
  if(fcIdx>=fcQueue.length && fcAgainPool.length){
    fcQueue=fcQueue.concat(fcAgainPool); fcAgainPool=[];
  }
  if(fcIdx>=fcQueue.length){
    area.innerHTML=`<div class="card" style="text-align:center;padding:40px">
      <div class="serif" style="font-size:24px;font-weight:600;margin-bottom:8px">Round complete ✓</div>
      <p style="color:var(--ink-soft)">Reviewed ${fcQueue.length} card${fcQueue.length!==1?'s':''}. Intervals updated and saved.</p>
      <button class="btn btn-primary" onclick="go('flashcards')">Back to decks</button>
      <button class="btn btn-gold" onclick="go('drill')">Drill questions →</button></div>`;
    return;
  }
  const {c:card,key}=fcQueue[fcIdx];
  const leech=isLeech(key);
  area.innerHTML=`
    <div style="text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:6px">Card ${fcIdx+1} of ${fcQueue.length}${fcAgainPool.length?` · ${fcAgainPool.length} to redo`:''}</div>
    <div class="fc-stage">
      <div class="flashcard" id="flash" role="button" tabindex="0" aria-label="Flashcard. Activate to reveal the answer."
           onclick="App.flipFc()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.flipFc()}">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-deck">${card.deck}${leech?' · ⚠ struggling':''}</div>
            <div class="fc-text">${card.front}</div><div class="fc-hint">tap or press Enter to reveal</div></div>
          <div class="fc-face fc-back">
            <div class="fc-deck">${card.deck} · answer</div>
            <div class="fc-text">${card.back}</div><div class="fc-hint">how well did you recall it?</div></div>
        </div>
      </div>
      <div class="fc-rate hidden" id="fcRate">
        <button class="btn btn-ghost" onclick="App.rateFc(0)">Again</button>
        <button class="btn btn-ghost" onclick="App.rateFc(1)">Hard</button>
        <button class="btn btn-primary" onclick="App.rateFc(2)">Good</button>
        <button class="btn btn-gold" onclick="App.rateFc(3)">Easy</button>
      </div>
    </div>`;
}
function flipFc(){
  const el=document.getElementById('flash');
  if(!el||el.classList.contains('flipped'))return;
  el.classList.add('flipped');
  document.getElementById('fcRate').classList.remove('hidden');
}
function rateFc(grade){            // 0 Again, 1 Hard, 2 Good, 3 Easy
  const {key}=fcQueue[fcIdx];
  const prev=state.cards[key]||{ease:2.5,interval:0,reps:0,lapses:0};
  let {ease,interval,reps,lapses}=prev;
  if(grade===0){                   // lapse
    reps=0; lapses=(lapses||0)+1; interval=1; ease=Math.max(1.3,ease-0.2);
    fcAgainPool.push(fcQueue[fcIdx]);          // show again this session
  }else{
    reps=(reps||0)+1;
    if(grade===1){ ease=Math.max(1.3,ease-0.15); interval = reps===1?1:Math.max(1,Math.round(interval*1.2)); }
    else if(grade===2){ interval = reps===1?1:reps===2?3:Math.round(interval*ease); }
    else { ease=ease+0.15; interval = reps===1?2:reps===2?4:Math.round(interval*ease*1.3); }
  }
  state.cards[key]={ease:+ease.toFixed(2),interval,reps,lapses,due:startOfTomorrow(interval),last:Date.now()};
  save();
  fcIdx++; renderFc();
}

/* ---------------- DRILL BY TOPIC ---------------- */
let drill={pool:[],idx:0,correct:0,answered:false};
RENDER.drill=(c)=>{
  c.innerHTML=`
    <div class="eyebrow">Practice</div>
    <h1 class="page">Drill by Topic</h1>
    <p class="lede">Untimed practice with instant explanations. Pick a topic — or drill the whole bank. Questions shuffle each round.</p>
    <div class="quiz-setup" id="drillSetup">
      ${SECTIONS.map(s=>{
        const st=state.drillStats[s]||{seen:0,right:0};
        const acc=st.seen?Math.round(st.right/st.seen*100):null;
        const n=QUESTIONS.filter(q=>q.s===s).length;
        return `<button class="sec-choice" onclick="startDrill('${s}')">
          <h4>${SEC_LABEL[s]}</h4><div class="c">${n} questions</div>
          <div class="acc" style="color:${acc===null?'var(--ink-soft)':acc>=80?'var(--green)':acc>=60?'var(--gold)':'var(--red)'}">${acc===null?'not yet drilled':acc+'% accuracy'}</div></button>`;
      }).join('')}
      <button class="sec-choice sel" onclick="startDrill('all')" style="border-color:var(--navy)">
        <h4>Full bank</h4><div class="c">all 100 questions</div><div class="acc" style="color:var(--navy)">mixed practice</div></button>
    </div>
    <div id="drillArea"></div>`;
};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startDrill(sec){
  let pool=QUESTIONS.map((q,i)=>({q,gi:i})).filter(x=>sec==='all'||x.q.s===sec);
  drill={pool:shuffle(pool),idx:0,correct:0,answered:false,sec};
  document.getElementById('drillSetup').classList.add('hidden');
  renderDrill();
}
function renderDrill(){
  const area=document.getElementById('drillArea');
  if(drill.idx>=drill.pool.length){
    const pct=Math.round(drill.correct/drill.pool.length*100);
    area.innerHTML=`<div class="card" style="text-align:center;padding:36px">
      <div class="verdict ${pct>=80?'pass':''}" >${drill.correct} / ${drill.pool.length} correct · ${pct}%</div>
      <p style="color:var(--ink-soft)">${pct>=85?'Strong. This topic is close to exam-ready.':pct>=60?'Decent — re-read the weak spots and drill again.':'Re-read the section, then come back.'}</p>
      <button class="btn btn-primary" onclick="startDrill('${drill.sec}')">Drill again</button>
      <button class="btn btn-ghost" onclick="go('drill')">Pick another topic</button></div>`;
    return;
  }
  const {q,gi}=drill.pool[drill.idx];
  drill.answered=false;
  area.innerHTML=`
    <div class="q-card">
      <div class="q-meta"><span class="q-sec-tag">${SEC_LABEL[q.s]}</span><span>${drill.idx+1} / ${drill.pool.length} · score ${drill.correct}</span></div>
      <div class="q-text">${q.q}</div>
      <div id="drillOpts">${q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i},${gi})"><span class="ltr">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="explain" id="drillExp"></div>
      <div class="exam-nav hidden" id="drillNext"><span></span><button class="btn btn-primary" onclick="drill.idx++;renderDrill();">${drill.idx+1>=drill.pool.length?'See results':'Next'} →</button></div>
    </div>`;
}
function answerDrill(choice,gi){
  if(drill.answered) return;
  drill.answered=true;
  const q=QUESTIONS[gi];
  const right=q.a;
  const opts=document.querySelectorAll('#drillOpts .opt');
  opts.forEach((b,i)=>{b.disabled=true;if(i===right)b.classList.add('correct');if(i===choice&&choice!==right)b.classList.add('wrong');});
  const ok=choice===right;
  if(ok)drill.correct++;
  // stats
  const s=q.s; const st=state.drillStats[s]||{seen:0,right:0}; st.seen++; if(ok)st.right++; state.drillStats[s]=st; save();
  const exp=document.getElementById('drillExp');
  exp.className='explain show '+(ok?'right':'wrong');
  exp.innerHTML=`<span class="v">${ok?'Correct':'Not quite — answer: '+LETTERS[right]}</span>${q.e}`;
  document.getElementById('drillNext').classList.remove('hidden');
}

/* ---------------- MOCK EXAM (60Q / 60min) ---------------- */
let exam=null, examTimer=null;
RENDER.exam=(c)=>{
  if(exam&&exam.active){renderExamQ(c);return;}
  const best=state.examBest;
  c.innerHTML=`
    <div class="eyebrow">Practice</div>
    <h1 class="page">Mock Exam</h1>
    <p class="lede">60 questions, 60 minutes, closed-book — the real Foundation format. Pass mark 55% (33/60). Questions are drawn across all sections in exam proportions. Flag questions to revisit; submit when ready or when time runs out.</p>
    ${best!==null?`<div class="callout ${best>=85?'key':''}"><div class="tag">Your best</div>${best}% ${best>=85?'— exam-ready. Take another to confirm consistency.':best>=55?'— passing, but aim for 85%+ before booking.':'— below pass. Keep drilling weak topics.'}</div>`:''}
    <div class="card" style="text-align:center;padding:34px">
      <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:6px">Ready to begin?</div>
      <p style="color:var(--ink-soft);max-width:46ch;margin:0 auto 18px">The timer starts immediately. Find 60 uninterrupted minutes.</p>
      <button class="btn btn-gold" style="font-size:16px;padding:13px 30px" onclick="startExam()">Start 60-minute exam</button>
    </div>`;
};
function startExam(){
  // 60 questions in section proportions
  const want={principles:9,practices:12,processes:12,products:12,roles:9,tailoring:6};
  const recent=new Set(state.recentSeen||[]);   // global indices shown in the last exam
  let q=[], usedGi=[];
  SECTIONS.forEach(s=>{
    let pool=QUESTIONS.map((qq,i)=>({qq,gi:i})).filter(x=>x.qq.s===s);
    // prefer questions NOT recently seen; fall back to recent ones only if needed
    let fresh=shuffle(pool.filter(x=>!recent.has(x.gi)));
    let stale=shuffle(pool.filter(x=>recent.has(x.gi)));
    const picked=fresh.concat(stale).slice(0,want[s]);
    q=q.concat(picked); usedGi=usedGi.concat(picked.map(x=>x.gi));
  });
  q=shuffle(q);
  state.recentSeen=usedGi;   // remember this set so the next exam avoids it
  exam={active:true,q,idx:0,answers:new Array(q.length).fill(null),flags:new Array(q.length).fill(false),
    start:Date.now(),end:Date.now()+60*60000};
  save();
  startExamTimer();
  go('exam');
}
function startExamTimer(){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    const el=document.getElementById('examTimer'); if(!el){return;}
    const left=Math.max(0,exam.end-Date.now());
    const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
    el.textContent=`${m}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('warn',left<5*60000);
    if(left<=0){clearInterval(examTimer);submitExam();}
  },500);
}
function renderExamQ(c){
  const i=exam.idx, item=exam.q[i], q=item.qq;
  const answered=exam.answers.filter(a=>a!==null).length;
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div><div class="eyebrow" style="margin-bottom:2px">Mock Exam</div><div style="font-size:13px;color:var(--ink-soft)">${answered}/60 answered</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="timer" id="examTimer">60:00</span>
        <button class="btn btn-ghost" style="padding:8px 14px" onclick="confirmSubmit()">Submit</button></div>
    </div>
    <div class="q-card">
      <div class="q-meta"><span class="q-sec-tag">Q${i+1}</span>
        <button class="btn btn-ghost" style="padding:5px 13px;font-size:13px;${exam.flags[i]?'background:var(--gold-soft);border-color:var(--gold)':''}" onclick="toggleFlag()">${exam.flags[i]?'★ Flagged':'☆ Flag'}</button></div>
      <div class="q-text">${q.q}</div>
      <div>${q.o.map((o,j)=>`<button class="opt ${exam.answers[i]===j?'':''}" style="${exam.answers[i]===j?'border-color:var(--navy);background:var(--card)':''}" onclick="pickExam(${j})"><span class="ltr" style="${exam.answers[i]===j?'background:var(--navy);border-color:var(--navy);color:#fff':''}">${LETTERS[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="exam-nav">
        <button class="btn btn-ghost" onclick="examGo(${i-1})" ${i===0?'disabled':''}>← Prev</button>
        <button class="btn btn-primary" onclick="examGo(${i+1})" ${i===exam.q.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px">Question map</div>
      <div class="qgrid">${exam.q.map((_,j)=>`<button class="qdot ${exam.answers[j]!==null?'answered':''} ${exam.flags[j]?'flagged':''} ${j===i?'current':''}" onclick="examGo(${j})">${j+1}</button>`).join('')}</div>
    </div>`;
  startExamTimer();
}
function pickExam(j){exam.answers[exam.idx]=j;save();renderExamQ(document.getElementById('content'));}
function toggleFlag(){exam.flags[exam.idx]=!exam.flags[exam.idx];renderExamQ(document.getElementById('content'));}
function examGo(j){if(j<0||j>=exam.q.length)return;exam.idx=j;renderExamQ(document.getElementById('content'));}
function confirmSubmit(){
  const un=exam.answers.filter(a=>a===null).length;
  if(un>0){if(!confirm(`${un} question${un!==1?'s':''} still unanswered. Submit anyway?`))return;}
  submitExam();
}
function submitExam(){
  clearInterval(examTimer);
  let correct=0; const bySec={};
  SECTIONS.forEach(s=>bySec[s]={right:0,total:0});
  const detail=exam.q.map((item,i)=>{
    const q=item.qq; bySec[q.s].total++;
    const chosen=exam.answers[i];
    const ok=chosen===q.a;
    if(ok){correct++;bySec[q.s].right++;}
    return {q, chosen, ok, flagged:exam.flags[i]};
  });
  const pct=Math.round(correct/exam.q.length*100);
  const flaggedTotal=exam.flags.filter(Boolean).length;
  const flaggedRight=detail.filter(d=>d.flagged&&d.ok).length;
  const rec={pct,correct,date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
  state.examHistory.push(rec);
  if(state.examBest===null||pct>state.examBest)state.examBest=pct;
  exam.active=false;
  exam.result={pct,correct,bySec,detail,flaggedTotal,flaggedRight};
  save();
  renderExamResult(document.getElementById('content'));
}
function renderExamResult(c){
  const {pct,correct,bySec}=exam.result;
  const pass=pct>=55, ready=pct>=85;
  const circ=2*Math.PI*72;
  const off=circ*(1-pct/100);
  const col=ready?'var(--green)':pass?'var(--gold)':'var(--red)';
  c.innerHTML=`
    <div class="eyebrow">Mock Exam · Result</div>
    <h1 class="page">${ready?'Exam-ready':pass?'Passing':'Below pass'}</h1>
    <div class="result-ring">
      <svg width="170" height="170"><circle cx="85" cy="85" r="72" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle cx="85" cy="85" r="72" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
      <div class="pct"><div class="n" style="color:${col}">${pct}%</div><div class="l">${correct}/60</div></div>
    </div>
    <div class="verdict ${pass?'pass':'fail'}">${ready?'85%+ — book the official exam with confidence':pass?'Above the 55% pass mark — push toward 85% before booking':'Below 55% — another week of study'}</div>
    <h2 class="sec">By section</h2>
    <div class="breakdown">
      ${SECTIONS.map(s=>{const b=bySec[s];const p=b.total?Math.round(b.right/b.total*100):0;
        const col=p>=80?'var(--green)':p>=60?'var(--gold)':'var(--red)';
        return `<div class="bd-row"><span class="nm">${SEC_LABEL[s]}</span>
          <span class="track"><span class="fill" style="width:${p}%;background:${col}"></span></span>
          <span class="sc">${b.right}/${b.total}</span></div>`;}).join('')}
    </div>
    <div class="callout"><div class="tag">Next step</div>${ready?'You are consistently clearing the bar. Take one PeopleCert official sample paper as a final calibration, then book.':'Your weakest sections above are where to spend next. Re-read them, drill them untimed, then re-sit a full mock.'}</div>
    ${exam.result.flaggedTotal?`<div class="callout key"><div class="tag">Flagged questions</div>You flagged ${exam.result.flaggedTotal} question${exam.result.flaggedTotal!==1?'s':''} — ${exam.result.flaggedRight} correct, ${exam.result.flaggedTotal-exam.result.flaggedRight} wrong. Worth a second look in the review below.</div>`:''}
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
      <button class="btn btn-primary" onclick="App.reviewExam()">Review answers →</button>
      <button class="btn btn-gold" onclick="App.startExam()">Take another mock</button>
      <button class="btn btn-ghost" onclick="go('drill')">Drill weak topics</button>
      <button class="btn btn-ghost" onclick="go('dashboard')">Dashboard</button>
    </div>`;
}
let reviewFilter='wrong';
function reviewExam(){ reviewFilter='wrong'; renderReview(); }
function setReviewFilter(f){ reviewFilter=f; renderReview(); }
function renderReview(){
  const c=document.getElementById('content');
  if(!exam||!exam.result||!exam.result.detail){go('exam');return;}
  const d=exam.result.detail;
  const wrong=d.filter(x=>!x.ok).length, flagged=d.filter(x=>x.flagged).length;
  let list=d.map((x,i)=>({...x,n:i+1}));
  if(reviewFilter==='wrong')list=list.filter(x=>!x.ok);
  else if(reviewFilter==='flagged')list=list.filter(x=>x.flagged);
  const fbtn=(f,label)=>`<button class="btn ${reviewFilter===f?'btn-primary':'btn-ghost'}" style="padding:8px 16px" onclick="App.setReviewFilter('${f}')">${label}</button>`;
  c.innerHTML=`
    <div class="eyebrow">Mock Exam · Review</div>
    <h1 class="page">Answer Review</h1>
    <p class="lede">${exam.result.correct}/60 correct. Go through what you missed — the explanation tells you why the right answer is right.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px">
      ${fbtn('wrong',`Wrong (${wrong})`)}
      ${fbtn('flagged',`Flagged (${flagged})`)}
      ${fbtn('all','All 60')}
    </div>
    ${list.length?list.map(x=>{
      const chosenTxt = x.chosen===null?'<em>no answer</em>':`${LETTERS[x.chosen]}. ${x.q.o[x.chosen]}`;
      return `<div class="q-card" style="padding:20px 22px;margin-bottom:14px">
        <div class="q-meta"><span class="q-sec-tag">Q${x.n} · ${SEC_LABEL[x.q.s]}</span>
          <span>${x.flagged?'<span class="pill" style="background:var(--gold-soft);color:#1a1206">★ flagged</span> ':''}${x.ok?'<span class="pill ok">correct</span>':'<span class="pill" style="background:var(--red-soft);color:var(--red)">wrong</span>'}</span></div>
        <div class="q-text" style="font-size:18px">${x.q.q}</div>
        <div style="display:flex;flex-direction:column;gap:7px;margin:6px 0 12px">
          ${x.ok?'':`<div class="opt wrong" style="cursor:default"><span class="ltr">${x.chosen===null?'–':LETTERS[x.chosen]}</span><span>Your answer: ${chosenTxt}</span></div>`}
          <div class="opt correct" style="cursor:default"><span class="ltr">${LETTERS[x.q.a]}</span><span>Correct: ${x.q.o[x.q.a]}</span></div>
        </div>
        <div class="explain show right" style="margin-top:0"><span class="v">Why</span>${x.q.e}</div>
      </div>`;}).join('')
      :`<div class="card" style="text-align:center;padding:34px"><div class="serif" style="font-size:20px;font-weight:600">Nothing here ✓</div><p style="color:var(--ink-soft);margin:0">No ${reviewFilter==='wrong'?'wrong answers':'flagged questions'} this time.</p></div>`}
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-gold" onclick="App.startExam()">Take another mock</button>
      <button class="btn btn-ghost" onclick="App.renderExamResult(document.getElementById('content'))">← Back to result</button>
    </div>`;
  window.scrollTo(0,0);
}

function toggleCheck(i){state.checklist[i]=!state.checklist[i];save();RENDER.checklist(document.getElementById('content'));}
function resetProgress(){

    state=defaults();save();go('dashboard');
  }
}

/* ---------- expose handlers (namespace + globals so all onclick styles resolve) ---------- */
const App = { go, openNav, closeNav, startFc, flipFc, rateFc, startDrill, answerDrill,
  startExam, pickExam, toggleFlag, examGo, confirmSubmit, submitExam,
  renderExamResult, reviewExam, setReviewFilter, toggleCheck, resetProgress };
if(typeof window!=='undefined'){ Object.assign(window, App); window.App=App; }

/* ---------- keyboard: Escape closes mobile nav ---------- */
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeNav(); });
}

/* ---------- merge the expansion question bank if present ---------- */
if(typeof QUESTIONS_EXT!=='undefined' && Array.isArray(QUESTIONS_EXT)){
  QUESTIONS.push(...QUESTIONS_EXT);
}

buildNav();
go(state.lastView||'dashboard');
