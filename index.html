    qa:[
      ["What is the purpose of the issues practice?", "To collect and assess issues and to control changes to the project baseline. In PRINCE2 7, change control sits inside the issues practice."],
      ["What is an issue, and how does it differ from a risk?", "An issue is an event relevant to the project that requires project management consideration. A risk is uncertain and might happen; when a risk occurs, it becomes an issue."],

      ["What is an off-specification?", "Something that should be provided by the project but is not, or will not be, provided. Example: a product that will not meet its quality specification."],

      ["Who decides on changes, and how are they funded?", "The project board, or a change authority it delegates to. A change budget is money set aside to pay for approved changes."],
      ["What are the steps of the issue management technique?", "Capture, assess, recommend, decide, implement. Older material says examine and propose: in PRINCE2 7 the steps are assess and recommend."],
      ["What are the three issue products?", "The issue management approach (in the PID), the issue register (in the project log), and the issue report, which describes a single issue, its impact and the recommendation."],

  {
    n:'3e', id:'yD_oLvdjUDg', title:"The Progress Practice",
    blurb:"Tolerances, the reporting cascade, controls, escalation and exception management.",
    qa:[
      ["What is the purpose of the progress practice?", "To establish mechanisms to monitor and compare actual against planned achievement, to provide a forecast for the objectives and continued viability, and to control unacceptable deviations."],
      ["What is an exception?", "A situation where it can be forecast that there will be a deviation beyond agreed tolerance. It is triggered by the forecast, not by an actual breach."],
      ["What are the seven tolerance types?", "Time, cost, scope, quality, benefits, risk and sustainability. Sustainability is new in PRINCE2 7: six tolerances is the 6th-edition answer."],
      ["How are tolerances delegated?", "The business layer sets project tolerances for the project board (project plan). The board sets stage tolerances for the project manager (stage plan). The project manager sets work package tolerances for the team manager (work package description)."],
      ["Who sends checkpoint and highlight reports?", "Checkpoint report: team manager to project manager. Highlight report: project manager to project board. Do not swap them."],
      ["Event-driven vs time-driven controls?", "Event-driven controls are decisions triggered by an event, such as a stage end or an exception. Time-driven controls are monitoring and reporting at set intervals, such as highlight reports."],
      ["Does PRINCE2 7 define the format of reports?", "No. It does not define their composition, format or presentation. The frequency of reporting should reflect the level of control needed."],
      ["How are exceptions escalated?", "Work package level: the team manager raises an issue to the project manager. Stage level: the project manager produces an issue report and an exception report for the board. Project level: the board refers it to the business layer."],
      ["How does an exception move through the processes?", "Issue raised in managing product delivery; exception report in controlling a stage; the board asks for an exception plan in directing a project; the plan is produced in managing a stage boundary; once approved, it becomes the new stage plan."],
      ["What five questions capture a lesson?", "What did we expect? What actually happened? What worked well and why? What did not work well and why? What should be done differently or repeated?"],

      ["What are the four steps of the business case management technique?", "Develop, check, maintain, confirm. Develop turns the mandate into the outline business case, then the full one; check tests progress, risks and issues against it; maintain is the end-of-stage update; confirm happens in benefits reviews after the project."],

  {
    n:'4', id:'X5euoFr_L5g', title:'The Seven PRINCE2 Processes',
    blurb:'Purpose, objectives, activities and outputs of all seven processes, with the v7 activity names.',
    qa:[
      ["How are the processes tested?", "Nine questions, testing each process's purpose, objectives and context: where it sits and what triggers it."],
      ["What is the purpose of starting up a project?", "To make sure only viable projects are initiated, doing the minimum needed to decide whether initiation is worthwhile. Triggered by the project mandate."],
      ["What are the starting up activities?", "Appoint the executive and the project manager; assess previous lessons; appoint the project management team; prepare the outline business case; select the project approach; assemble the project brief; plan the initiation stage."],
      ["What does starting up produce?", "The project brief and the initiation stage plan. Not the PID: starting up produces the brief, initiating produces the PID."],
      ["What is the purpose of directing a project?", "To let the board be accountable for success by making key decisions and exercising overall control, while delegating day-to-day management to the project manager."],
      ["What are the five directing a project activities?", "Authorize initiation; authorize the project; authorize a stage or exception plan; give ongoing direction (formal direction and informal advice); authorize project closure."],
      ["Does the board need regular progress meetings?", "No. It manages by exception: it monitors through reports and controls through a small number of decision points."],
      ["What is the purpose of initiating a project?", "To establish solid foundations, so the business understands the work before committing significant spend. Output: the PID."],
      ["What are the initiating activities?", "Agree tailoring requirements; agree the management approaches; establish project controls; prepare the project plan; prepare the full business case; assemble the PID."],
      ["What is the purpose of controlling a stage?", "To assign and monitor work, handle issues, report progress to the board and take corrective action so the stage stays within tolerance."],
      ["What are the three groups of controlling a stage activities?", "Managing work packages (authorize, evaluate status, receive completed); monitoring and reporting (evaluate stage status, report highlights); managing issues and risks (capture and assess, escalate, take corrective action)."],
      ["Corrective action or exception report?", "Within tolerance, the project manager takes corrective action. If the stage is forecast to go beyond tolerance, the project manager escalates with an exception report to the board."],
      ["What are the managing product delivery activities?", "Accept a work package (agree it, create a team plan); execute it (produce products, quality checks, approval); evaluate it (review progress, send checkpoint reports); notify work package completion."],
      ["What is the purpose of managing a stage boundary?", "To give the board enough information to review the stage, approve the next stage plan, review the updated project plan and confirm continued business justification and acceptable risk."],
      ["When is managing a stage boundary used?", "From initiating a project (to plan the first delivery stage) and from controlling a stage (near a stage end or when an exception plan is needed). Never after the final stage."],
      ["Is a board decision to stop at a stage boundary a failure?", "No. Giving the board too little information to decide would be."],
      ["What is the purpose of closing a project?", "A fixed point where acceptance of the project product is confirmed and the objectives are recognized as achieved, or the project has nothing more to contribute."],
      ["What does closing a project produce, and is it used for early closure?", "The end project report (performance against the PID used to authorize the project) and the lessons report. Yes: it is also used for premature closure, so the project closes in an orderly way."]

  {
    n:'5', id:'UNV_U-6_6OA', title:'Tailoring PRINCE2 to Your Environment',
    blurb:'Why every project is tailored, what you can and cannot change, and how PRINCE2 works with agile.',
    qa:[
      ['Is tailoring optional in PRINCE2?','No — every PRINCE2 project must be tailored. Using PRINCE2 rigidly "out of the box", identically on every project, is itself doing PRINCE2 incorrectly.'],
      ['What is the purpose of tailoring?','To make PRINCE2 fit the project\u2019s context — scale, complexity, importance, team capability, risk, delivery method — while keeping it recognisably PRINCE2.'],
      ['What can be tailored?','Management products (combine, split, reduce formality), roles (combine or rename, keeping responsibilities clear), processes (combine activities, add detail), and terminology (map to your organisation\u2019s language). Tailoring reduces formality and volume.'],
      ['What can NEVER be tailored away?','The seven principles — so the project always keeps a business justification, defined roles, management stages (at least initiation plus one more), tolerances and a focus on products with quality specifications.'],
      ['Where are tailoring decisions recorded?','In the PID (Project Initiation Documentation).'],
      ['Can PRINCE2 be used with agile?','Yes. They operate at different layers: PRINCE2 governs WHAT decisions are made, WHO makes them, and WHEN (governance); the delivery method — waterfall, agile, hybrid — is HOW the team produces the products, which is a tailoring choice.'],
      ['How do PRINCE2 and agile reinforce each other?','Product-based planning maps onto backlogs/user stories; "manage by stages" aligns with release or sprint boundaries; "focus on products" mirrors agile\u2019s working deliverables.'],
      ['Classic tailoring trap: "small urgent projects can skip the business case / merge Executive and PM / drop stage boundaries" — right or wrong?','Always wrong. Those remove principles or required role separations, which tailoring never does. A three-person sub-project may combine roles (PM also doing Team Manager and Project Support) — but it still needs a business case, Board direction, and stage boundaries.'],
      ['How does tailoring differ for a high-risk vs a small low-risk project?','High-risk, high-importance projects dial formality and control UP; small, low-risk projects dial them DOWN. Same method, different weight of documentation and governance.']
    ]
  }

/* lightbox, with previous/next navigation (buttons, arrow keys, swipe, horizontal scroll) */
let bpIdx=0, bpWheelAt=0;
function bpBox(){
  let box=document.getElementById('bpLightbox');
  if(box) return box;
  box=document.createElement('div');
  box.id='bpLightbox'; box.className='bp-lightbox';
  box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','Blueprint image viewer');
  box.addEventListener('click',e=>{ if(e.target===box || e.target.closest('.bp-lb-close')) bpClose(); });
  let x0=null, y0=null;
  box.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  box.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.3) bpStep(dx<0?1:-1);
  },{passive:true});
  box.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY) || Math.abs(e.deltaX)<25) return;
    e.preventDefault();
    const now=Date.now(); if(now-bpWheelAt<450) return; bpWheelAt=now;
    bpStep(e.deltaX>0?1:-1);
  },{passive:false});
  document.addEventListener('keydown',e=>{
    if(!box.classList.contains('show')) return;
    if(e.key==='ArrowRight'){ e.preventDefault(); bpStep(1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); bpStep(-1); }
    else if(e.key==='Escape'){ bpClose(); }
  });
  document.body.appendChild(box);
  return box;
}

function bpZoom(slug){

function bpqHTML(f, dark){

function bpqTrack(gi,ok){
  if(!state.missQ) state.missQ={};
  const key='q'+gi, DAY=86400000, LADDER=[1,3,8,20,50];
  const startDay=(d)=>{const t=new Date();t.setHours(0,0,0,0);return t.getTime()+Math.max(0,Math.round(d))*DAY;};
  if(!ok){ state.missQ[key]={step:0, due:startDay(LADDER[0]), last:Date.now()}; }
  else if(state.missQ[key]){ const step=(state.missQ[key].step||0)+1;
    if(step>=LADDER.length) delete state.missQ[key]; else state.missQ[key]={step, due:startDay(LADDER[step]), last:Date.now()}; }
  save();
}
function bpqAnswer(btn,gi,k){
  const item=btn.closest('.bpq-item'); if(!item||item.dataset.done) return;
  item.dataset.done='1';
  const q=QUESTIONS[gi], ok=k===q.a;
  item.querySelectorAll('.bpq-opt').forEach((b,j)=>{ b.disabled=true; if(j===q.a) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); });
  const ex=item.querySelector('.bpq-exp'); ex.hidden=false;
  ex.innerHTML=`<b>${ok?'Correct.':'Not quite.'}</b> ${q.e}${ok?'':' <span class="bpq-note">Added to “My mistakes” for review.</span>'}`;
  ex.classList.toggle('ok',ok);
  bpqTrack(gi,ok);
  const body=item.closest('.bpq-body'), all=body.querySelectorAll('.bpq-item'), done=body.querySelectorAll('.bpq-item[data-done]');
  const sc=body.querySelector('.bpq-score');
  const nRight=[...done].filter(it=>!it.querySelector('.bpq-opt.wrong')).length;

}

  },{passive:true});
  document.addEventListener('click',e=>{ if(Date.now()-vvSwiped<400 && e.target.closest&&e.target.closest('.vv-stage')){ e.stopPropagation(); e.preventDefault(); } },true);

    <p>The whole point of the People element — delivering the product is <em>not</em> the same as the organisation adopting it.</p>
    ${diagChangeTransition()}

    <h3 class="sub">The three people-focused activities</h3>
    <p>Everything in the people element hangs off three activities. They are <em>not</em> standalone — they run through all of project management:</p>
    <div class="card">
      <p style="margin-bottom:8px"><strong>1. Leading successful change.</strong> Projects deliver change, which disrupts people's business-as-usual (BAU) routines and responsibilities. Leading change means understanding that impact — and when people block a change, looking at <em>how the system is affecting them</em> rather than blaming them.</p>
      <p style="margin-bottom:8px"><strong>2. Leading and managing successful teams.</strong> The courseware distinguishes <em>leadership</em> (influencing and motivating people) from <em>management</em> (organising and controlling). A temporary project leader often cannot rely on established authority, so the style must adapt. Build capability, diversity, team cohesion and collaboration across the project ecosystem.</p>
      <p style="margin-bottom:0"><strong>3. Communication.</strong> The communication management approach defines the means and frequency of communication, and critically includes <em>receiving feedback</em> — a controlled, <strong>bidirectional</strong> flow across the project ecosystem, supporting alignment. How teams communicate also depends on whether they are co-located, remote or hybrid.</p>
    </div>

    <h3 class="sub">Core people concepts — know these definitions cold</h3>
    <table><tr><th>Term</th><th>What it means</th></tr>
      <tr><td><strong>Stakeholder</strong></td><td>Anyone who <em>affects, or is affected by,</em> the project. (Classic definition question.)</td></tr>
      <tr><td><strong>People within vs affected by</strong></td><td>"People" covers both those <em>working on</em> the project and those <em>impacted by</em> it.</td></tr>
      <tr><td><strong>Organizational ecosystem</strong></td><td>The wider organisation and environment the project sits inside — structures, culture, politics the project must work within.</td></tr>
      <tr><td><strong>Project ecosystem</strong></td><td>The people delivering the project and the relationships between them (the narrower, internal view).</td></tr>
      <tr><td><strong>Culture</strong></td><td>The shared values, norms and behaviours of the organisation and team; PRINCE2 7 says project culture should align with the wider organisation.</td></tr>
      <tr><td><strong>Leadership vs management</strong></td><td>Management = plan, delegate, monitor, control (the mechanics). Leadership = influencing and motivating people through change. PRINCE2 7 wants both.</td></tr>
      <tr><td><strong>Collaboration vs co-creation</strong></td><td>Collaboration = people working together toward the goal. Co-creation = users/stakeholders <em>actively helping design</em> the products, not just consulted. Co-creation is the deeper involvement.</td></tr>
      <tr><td><strong>Effective teams</strong></td><td>Built on <em>diversity, capability and competence</em> — the right mix of skills and perspectives, developed over the project.</td></tr>
      <tr><td><strong>Stakeholder engagement</strong></td><td>Planned, <em>two-way</em> communication to understand and involve stakeholders — not one-way broadcasting.</td></tr>
    </table>
    <div class="callout"><div class="tag">Distinctions the exam probes here</div><strong>Collaboration vs co-creation</strong> (working together vs users designing with you) · <strong>organizational vs project ecosystem</strong> (the wider environment vs the delivery team) · <strong>leadership vs management</strong> (influence vs control). Questions often give a scenario and ask which concept it illustrates — know both sides of each pair.</div>

    <div class="callout trap"><div class="tag">The trap that likely cost you marks</div><strong>Change management ≠ change control.</strong><br>
      <strong>Change management</strong> (people element) = helping people <em>adopt</em> the project's outputs — moving them from the current state to the target state. Its product is the <strong>Change Management Approach</strong>.<br>
      <strong>Change control</strong> (Issues practice) = handling issues and requests for change to <em>baselines</em> after something has happened. Its product is the <strong>Issue Management Approach</strong> (change control is the concept within it).<br>
      Same word "change", two completely different things. Exam questions deliberately blur them.</div>

    <h3 class="sub">People management products</h3>
    <p>Two approaches sit in the PID and belong to the people element:</p>
    <table><tr><th>Product</th><th>Defines</th></tr>
      <tr><td><strong>Change Management Approach</strong></td><td>How people will be prepared, supported and helped to <em>adopt</em> the outputs (transition current → future state). Includes stakeholder engagement strategy.</td></tr>
      <tr><td><strong>Communication Management Approach</strong></td><td>The means, content and <em>frequency</em> of communication with stakeholders — two-way.</td></tr>
    </table>
    <div class="callout key"><div class="tag">People threads through everything</div>People isn't a silo. It connects to <strong>principles</strong> (defined roles & responsibilities, learn from experience), to the <strong>Organization practice</strong> (forming the team with business/user/supplier representation), and to every process. If a question asks "how does people relate to X", the answer is usually "it's integrated throughout", not "it's separate".</div>

    <h2 class="sec">② Processes — the memorisation gap</h2>
    <p>Only 7 processes, and you scored 44% — this is recall, not understanding. The fix is drilling the fixed facts until they're automatic: each process's <strong>trigger</strong>, <strong>main output</strong>, and <strong>who owns it</strong>. Re-draw the lifecycle from memory daily until it's effortless.</p>

    <div class="card">
      <h3 class="sub" style="margin-top:0">The 7 processes — the one-line recall table</h3>
      <table><tr><th>Process</th><th>Trigger</th><th>Main output</th></tr>
        <tr><td><strong>SU</strong> Starting up a Project</td><td>Project mandate</td><td>Project Brief (+ Initiation Stage Plan)</td></tr>
        <tr><td><strong>DP</strong> Directing a Project</td><td>End of SU → end of CP</td><td>Board authorisations (5 decision points)</td></tr>
        <tr><td><strong>IP</strong> Initiating a Project</td><td>Board authorises initiation</td><td>PID</td></tr>
        <tr><td><strong>CS</strong> Controlling a Stage</td><td>Each delivery stage</td><td>Highlight Reports, Work Package authorisation</td></tr>
        <tr><td><strong>MP</strong> Managing Product Delivery</td><td>Work Package authorised</td><td>Checkpoint Reports, completed products</td></tr>
        <tr><td><strong>SB</strong> Managing a Stage Boundary</td><td>Near stage end, or an exception</td><td>Next Stage Plan (or Exception Plan), End Stage Report</td></tr>
        <tr><td><strong>CP</strong> Closing a Project</td><td>Near end of final stage (or premature)</td><td>End Project Report, Lessons Report</td></tr>
      </table>
    </div>

    <h3 class="sub">The three process facts most often tested</h3>
    <div class="card">
      <p style="margin-bottom:8px"><strong>SU produces the Brief; IP produces the PID.</strong> Never swap them. The Brief is the rough cut for the Board to decide "initiate?"; the PID is the full baseline built during initiation.</p>
      <p style="margin-bottom:8px"><strong>DP's five activities:</strong> authorise initiation · authorise the project · authorise a Stage/Exception Plan · give ongoing direction · authorise closure. The Board directs; it does not do the work.</p>
      <p style="margin-bottom:0"><strong>Reports by process:</strong> Highlight = CS (PM→Board). Checkpoint = MP (Team Manager→PM). End Stage = SB. End Project + Lessons = CP. Exception = CS (event-driven).</p>
    </div>
    <div class="callout trap"><div class="tag">Process traps</div><strong>SB has two triggers</strong> — normal stage end OR an exception (not just stage end). <strong>CP handles premature closure</strong> too, not only planned. <strong>IP runs once</strong> (initiation stage only); CS, MP, SB repeat per delivery stage. <strong>Closure and start-up are processes, not stages</strong> — minimum stages is still two (initiation + at least one delivery).</div>

    <h2 class="sec">③ Key concepts & ④ Principles — quick top-ups</h2>
    <p>Small point loss here; a short refresh closes it.</p>
    <div class="card">
      <p style="margin-bottom:8px"><strong>What a project is (v7):</strong> a temporary organisation created to deliver one or more products according to an agreed Business Case. Projects introduce <em>change</em>, are <em>temporary</em>, <em>cross-functional</em>, carry <em>uncertainty</em>, and are <em>unique</em>.</p>
      <p style="margin-bottom:8px"><strong>Five integrated elements:</strong> principles, people, practices, processes, project context. (Repeated from People above because it sits in "key concepts" too.)</p>
      <p style="margin-bottom:0"><strong>The 7 principles — recite in order:</strong> continued business justification · learn from experience · defined roles, responsibilities & relationships · manage by stages · manage by exception · focus on products · tailor to suit the project. All seven always apply; none can be tailored away. A project applying six of seven is <em>not</em> a PRINCE2 project.</p>
    </div>

{s:"people",q:"Users and key influencers help design a new process so that it will be adopted. This is an example of:",o:["Change control", "Quality assurance", "Project assurance", "Co-creation"],a:3,e:"Co-creation is a specific form of collaboration involving users and key influencers in designing products and ways of working, so they are adopted."},
{s:"people",q:"Which is a challenge of leading project teams named in PRINCE2 7?",o:["Formal authority versus influence", "A fixed and unchanging team structure", "Team members who report only to the PM", "A lack of any competing priorities"],a:0,e:"The courseware names formal authority versus influence, competing priorities, multiple reporting lines and hierarchical tension. Project managers often lead people who do not report to them."},
{s:"people",q:"Culture in PRINCE2 7 is described as:",o:["The rules set out in the PID", "The tools and channels the team uses to collaborate", "Shared attitudes, values, goals and ways of working", "The reporting lines on the project board"],a:2,e:"Culture is the set of shared attitudes, values, goals and ways of working of a group. A project can have its own culture, aligned with the wider ecosystem."},
{s:"people",q:"When building an effective team, roles and responsibilities should reflect the individual’s:",o:["Seniority, tenure and job title", "Capability, authority and availability", "Personal preferences for the type of work", "Line manager’s recommendations"],a:1,e:"Roles and responsibilities should reflect the capability, authority and availability of the person doing the work, viewed through their key relationships."},
{s:"people",type:"List",q:"Which TWO describe the communication management approach?\n1. It defines the means and frequency of communication\n2. It is only used at project closure\n3. It includes receiving feedback from stakeholders\n4. It is written by the executive",o:["1 and 2", "1 and 3", "2 and 4", "3 and 4"],a:1,e:"It defines the means and frequency of communication with, and feedback from, the project ecosystem. The project manager documents it in initiating a project."},
{s:"people",q:"Who documents the communication management approach, and in which process?",o:["The executive, in directing a project", "The senior user, during starting up a project", "The project manager, in initiating a project", "Project support, in controlling a stage"],a:2,e:"The project manager documents the communication management approach during initiating a project. It can be a section of the PID or a stand-alone product."},
{s:"people",q:"A distributed team sets regular co-location days and away days. What is this an example of?",o:["Tailoring the project controls", "Managing a stage boundary", "Raising an exception report", "Bringing the team together"],a:3,e:"For teams that are not in one place, the courseware suggests co-location days, regular purposeful meetings, away days and virtual collaboration to bring the team together."},
{s:"people",q:"Psychological safety is part of which aspect of building an effective team?",o:["The project’s culture", "The team’s reporting lines", "The stage tolerances", "The work breakdown"],a:0,e:"Building the team includes a culture of acceptance, respect and psychological safety, alongside capability, diverse perspectives and roles that fit."},
{s:"people",q:"Which statement about the people element is CORRECT?",o:["It is a separate stage that runs before initiation starts", "It is optional on small projects", "It covers people working on and affected by the project", "It applies only to the project board"],a:2,e:"People covers those working on the project and those affected by it, and it runs through the principles, practices and processes."}

{s:"tailoring",type:"Negative",q:"Which is NOT one of the seven aspects of project performance?",o:["Benefits", "Sustainability", "Reputation", "Scope"],a:2,e:"The seven aspects are time, cost, scope, quality, benefits, risk and sustainability. Reputation is not one of them."},
{s:"tailoring",q:"Which integrated element describes the environment in which PRINCE2 is applied and tailored?",o:["Principles", "Project context", "Practices", "Processes"],a:1,e:"The project context is the fifth integrated element: it influences how the principles, practices and processes are applied by the people involved."},
{s:"tailoring",type:"List",q:"Which TWO are integrated elements of PRINCE2 7?\n1. People\n2. Themes\n3. Project context\n4. Techniques",o:["1 and 2", "2 and 4", "1 and 3", "3 and 4"],a:2,e:"The five integrated elements are principles, people, practices, processes and project context. “Themes” is the 6th-edition name for the practices."},
{s:"tailoring",q:"Why are projects described as riskier than business as usual?",o:["They involve more people", "They are unique and uncertain", "They are funded separately", "They report to the business layer"],a:1,e:"Projects introduce change and are unique, which brings threats and opportunities beyond those normally met in business as usual."},
{s:"tailoring",q:"Which is a characteristic of a project rather than business as usual?",o:["It continues indefinitely", "It repeats the same work", "It maintains stability", "It is temporary"],a:3,e:"Projects are temporary: when the change is in place, business as usual resumes in its new form and the project is no longer needed."}

/* resit drill: People + Processes, People weighted first */
(function(){
  if(typeof startDrill!=='function') return;
  const origStart = startDrill;
  window.startDrill = function(sec){
    if(sec==='resit'){
      let people = QUESTIONS.map((q,i)=>({q,gi:i})).filter(x=>x.q.s==='people'&&!x.q.retired);
      let proc   = QUESTIONS.map((q,i)=>({q,gi:i})).filter(x=>x.q.s==='processes'&&!x.q.retired);
      // shuffle each, weight People heavier by putting it first and taking more of it
      people = (typeof shuffle==='function'?shuffle(people):people);
      proc   = (typeof shuffle==='function'?shuffle(proc):proc);
      // People first (your weakest topic), then Processes — each internally shuffled
      const pool = people.concat(proc);
      drill = {pool, idx:0, correct:0, answered:false, sec:'resit'};
      const setup = document.getElementById('drillSetup');
      if(setup) setup.classList.add('hidden');
      // if invoked from resit page, make sure drill area exists by routing through the drill view
      if(!document.getElementById('drillArea')){ go('drill'); setTimeout(()=>window.startDrill('resit'), 0); return; }
      if(typeof renderDrill==='function') renderDrill();
      return;
    }
    return origStart(sec);
  };
  if(typeof App!=='undefined'){ App.startDrill = window.startDrill; }
})();


/* Exam-style set (Nov 2026): scenario stems and full-length options in the PeopleCert format,
   written from the Learner Workbook v7.2, not copied from any sample paper. of:1 marks them;
   mock exams draw from this set first. Appended last so saved progress indices stay valid. */
const QUESTIONS_OFFICIAL = [
{s:"tailoring",q:"A bank runs its monthly payroll in the same way every month. It also sets up a team from HR, finance and IT to replace the payroll system by next March, after which the team will disband. Which characteristic distinguishes the replacement work from business as usual?",o:["It is funded from the operational budget and managed by line management", "It avoids uncertainty because the same activities have been done before", "It is temporary, with a defined start and end, and it introduces change", "It is repeated regularly by a permanent team following an agreed procedure"],a:2,e:"Projects introduce change and are temporary, with a defined start and end, regardless of duration. They are also cross-functional, unique and uncertain. Repeated routine work under line management, funded operationally, is business as usual, and projects bring more uncertainty than routine work, not less.",ref:"Projects and project management",of:1},
{s:"tailoring",type:"Missing word",q:"Identify the missing word in the following sentence.\n\nProject management is the planning, delegating, monitoring and control of all aspects of the project, and the [?] of those involved, to achieve the project objectives within the expected performance targets.",o:["assurance", "appraisal", "motivation", "supervision"],a:2,e:"PRINCE2 defines project management as the planning, delegating, monitoring and control of all aspects of the project, and the motivation of those involved. Assurance, supervision and appraisal are not part of the definition.",ref:"Projects and project management",of:1},
{s:"tailoring",q:"A city council's project board asks that carbon emissions from building a new library stay within an agreed limit. Which aspect of project performance is the board setting a target for?",o:["Scope", "Sustainability", "Quality", "Risk"],a:1,e:"Sustainability is one of the seven aspects of project performance (time, cost, quality, scope, benefits, risk, sustainability). Environmental targets such as emissions limits are sustainability performance targets, not quality, scope or risk.",ref:"Projects and project management",of:1},
{s:"tailoring",q:"An insurer's claims app will be released in a series of short cycles, each adding features that users can try and give feedback on before the next cycle starts. Which delivery approach is being used?",o:["Iterative-incremental, where steps repeat throughout the project", "Product-based planning, where products are defined before activities", "Hybrid, where elements of the project use different approaches", "Linear-sequential, where each step completes before the next begins"],a:0,e:"In an iterative-incremental approach, steps occur iteratively throughout the project; it is also referred to as the agile approach. Linear-sequential runs steps in sequence, and hybrid mixes the two across different elements. Product-based planning is a planning technique, not a delivery approach.",ref:"Delivery approaches",of:1},
{s:"tailoring",q:"A hospital extension is designed, built and fitted out in sequence, while its patient booking software is developed in short iterations that are released as they are ready. Which delivery approach describes this project?",o:["Iterative-incremental", "Hybrid", "Linear-sequential", "Event-driven"],a:1,e:"In a hybrid approach, different elements of the project use either the linear-sequential or the iterative-incremental approach. Here the building work is sequential and the software is iterative. Event-driven describes a type of progress control, not a delivery approach.",ref:"Delivery approaches",of:1},
{s:"tailoring",q:"An organization wants staff to move between projects easily and wants handovers between project managers to cause less disruption. Which feature of PRINCE2 most directly supports this?",o:["Its common language and concepts, giving everyone a shared vocabulary", "Its outcome focus, which keeps attention on the viability of the business case", "Its contribution to organizational maturity through continual improvement", "Its proven basis, which draws on established practice and governance"],a:0,e:"The common language and concepts feature gives all participants a shared vocabulary, which encourages consistency, reuse of project assets, staff mobility and less impact from personnel changes or handovers. The other features are real but address different needs.",ref:"Features and benefits",of:1},
{s:"tailoring",q:"A sponsor warns that teams often treat finishing the project as the goal in itself. Which feature of PRINCE2 addresses this concern?",o:["It is outcome-focused, keeping attention on viability against the business case", "It is flexible, so the method can be tailored to the needs of the organization", "It is part of an integrated suite of methods covering programmes and risk", "It is universal, so it can be applied to any project alongside specialist models"],a:0,e:"Being outcome-focused means participants focus on the viability of the project in relation to its business case objectives, rather than seeing completion as an end in itself. Universal, flexible and integrated describe other features.",ref:"Features and benefits",of:1},
{s:"tailoring",q:"A project is part of a programme and must follow the programme's governance structure and reporting requirements. Which integrated element of PRINCE2 covers this influence on how the method is applied?",o:["Principles", "Processes", "Project context", "People"],a:2,e:"The project context is the integrated element covering the setting the method is applied in: organizational and commercial context, delivery method, sustainability and scale. Being part of a programme is part of the organizational context. Principles, people and processes are the other integrated elements (with practices).",ref:"The five integrated elements",of:1},
{s:"tailoring",q:"Why is project management used to address the common challenges of projects, such as ambiguity and keeping stakeholders informed?",o:["It specifies the industry techniques each team must use to remove uncertainty", "It replaces business-as-usual management for the duration of the project", "It unites the parties and clarifies objectives and working practices", "It guarantees that resources are available before any work is authorized"],a:2,e:"The purpose of project management is to address common challenges by reducing and managing ambiguity: uniting the parties involved and clarifying objectives and working practices so objectives are achieved within performance targets. PRINCE2 does not prescribe specialist techniques, replace business as usual or guarantee resources.",ref:"Projects and project management",of:1},
{s:"tailoring",q:"A project manager looks in PRINCE2 for guidance on calculating the critical path and earned value for a stage plan. What should the project manager expect to find?",o:["The progress practice requires earned value analysis for every highlight report", "PRINCE2 excludes detailed techniques like these, as they are documented elsewhere", "The planning technique replaces critical path analysis with product flow diagrams", "The plans practice sets out a step-by-step critical path and earned value method"],a:1,e:"Detailed techniques such as critical path analysis, estimating, risk identification and earned value analysis are outside PRINCE2's scope because they are well documented elsewhere. PRINCE2 is generic and also excludes specialist, industry-specific activity.",ref:"Features and benefits",of:1},
{s:"tailoring",q:"A government department appoints an external supplier, after a formal tender, to deliver part of a project. Which statement reflects how PRINCE2 views this situation?",o:["The supplier must set up a separate project board that reports to the department's board", "PRINCE2 works whether users and suppliers are in one organization or several", "The department must hand day-to-day management of the project to the supplier's manager", "PRINCE2 can only be used when the users and suppliers belong to the same organization"],a:1,e:"PRINCE2 does not assume any specific organizational context or require specific relationships between users, suppliers and business decision-makers. They may be in one organization or in separate organizations with commercial agreements. This is part of the commercial context.",ref:"The project context",of:1},
{s:"tailoring",type:"List",q:"Which TWO are among the seven aspects of project performance that PRINCE2 manages?\n1. Benefits\n2. Reputation\n3. Staff morale\n4. Sustainability",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:3,e:"The seven aspects of performance are time, cost, quality, scope, benefits, risk and sustainability. Reputation and staff morale matter to an organization but are not among PRINCE2's performance targets.",ref:"Projects and project management",of:1},
{s:"principles",q:"Midway through a project to launch a new savings product, a competitor releases a similar product and the forecast benefits fall so far that the project is no longer worth the investment. Which principle requires the project board to consider closing the project?",o:["Manage by exception", "Learn from experience", "Ensure continued business justification", "Define roles, responsibilities and relationships"],a:2,e:"Under ensure continued business justification, there must be a justifiable reason to start the project and it must remain valid throughout; if it no longer is, the project should be stopped. Manage by exception and manage by stages provide the controls through which this is noticed, but the requirement itself comes from continued business justification.",ref:"Continued business justification",of:1},
{s:"principles",q:"Before drafting the project brief, a project manager reviews the lessons reports of two similar projects and talks to their project managers about what went wrong. Which principle is being applied?",o:["Define roles, responsibilities and relationships", "Tailor to suit the project", "Learn from experience", "Focus on products"],a:2,e:"Learn from experience requires lessons to be sought, recorded and acted upon throughout the project, including at the start. Everyone should seek lessons rather than wait to be given them.",ref:"Learn from experience",of:1},
{s:"principles",q:"A designer on a project is unsure whether she can approve a change to a product's design herself or must refer it to someone else. Which principle has not been applied effectively?",o:["Manage by exception", "Ensure continued business justification", "Define roles, responsibilities and relationships", "Focus on products"],a:2,e:"Define roles, responsibilities and relationships requires everyone to have agreed roles and responsibilities, to know what they should do and what to expect from others. Uncertainty about who approves a change shows this has not been done.",ref:"Defined roles, responsibilities",of:1},
{s:"principles",q:"A project board will only commit funds for one part of the project at a time, and reviews whether the project is still viable before approving the next part. Which principle does this apply?",o:["Manage by stages", "Focus on products", "Learn from experience", "Manage by exception"],a:0,e:"Under manage by stages, a project is planned, monitored and controlled stage by stage, with stages separated by project board decision points. This lets the board commit resources one stage at a time and review viability at each boundary.",ref:"Manage by stages",of:1},
{s:"principles",q:"An executive tells the project manager that the board does not want weekly progress meetings and only wants to be involved if a stage is forecast to exceed its agreed limits for time or cost. Which principle is being applied?",o:["Ensure continued business justification", "Manage by exception", "Tailor to suit the project", "Manage by stages"],a:1,e:"Manage by exception defines tolerances for each objective, setting the limits of delegated authority. The board is only involved when a deviation beyond tolerance is forecast, which makes efficient use of senior management time.",ref:"Manage by exception",of:1},
{s:"principles",q:"Before any estimates are made, a project manager insists that the purpose, composition and quality specifications of each major deliverable are agreed and written down. Which principle is being applied?",o:["Focus on products", "Learn from experience", "Define roles, responsibilities and relationships", "Manage by stages"],a:0,e:"Focus on products concentrates on the definition and delivery of products, in particular their quality requirements. Product descriptions then provide the basis for estimating effort and resources, dependencies and schedules.",ref:"Focus on products",of:1},
{s:"principles",q:"On a three-month project with a small team, the board agrees to hold risks, issues and lessons in a single daily log and to accept verbal checkpoints from the team. Which principle is being applied?",o:["Tailor to suit the project", "Focus on products", "Learn from experience", "Manage by exception"],a:0,e:"Tailor to suit the project means adapting the method to the project's size, environment, complexity, importance, capability and risk. Combining logs and using verbal reporting on a small project are tailoring decisions, recorded in the PID.",ref:"Tailor to suit the project",of:1},
{s:"principles",type:"List",q:"Which TWO statements about the PRINCE2 principles are CORRECT?\n1. All seven must be applied for a project to be a PRINCE2 project.\n2. They can be omitted when a project is small and simple.\n3. They prescribe the exact management products each project uses.\n4. They guide how the method is tailored to the project's context.",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:3,e:"All seven principles must be applied, and they guide how the integrated elements are applied and tailored to fit the project. A principle cannot be omitted, however small the project, and principles give guidance rather than prescribing exact products.",ref:"Tailor to suit the project",of:1},
{s:"principles",q:"How are decisions about tailoring PRINCE2 for a project made?",o:["The business layer sets the tailoring in the mandate and the board applies it", "The executive decides the tailoring alone when the project mandate is received", "The project manager recommends the tailoring and the project board approves it", "Project assurance recommends the tailoring and the project manager approves it"],a:2,e:"The project manager is responsible for tailoring and makes recommendations after consulting lessons and standards. The project board is accountable and approves them at the end of initiation and whenever a change to the approach is proposed. Tailoring is recorded in the PID.",ref:"Tailoring: the rules",of:1},
{s:"principles",q:"The board agrees that the project will use the organization's own term 'gate review' in place of 'end stage assessment'. Where should this decision be recorded?",o:["In the lessons report, so that future projects can reuse the term", "In the project mandate, which the business layer issues to the board", "In the PID, as part of how PRINCE2 is tailored for the project", "In the daily log, as an informal decision by the project manager"],a:2,e:"How PRINCE2 is applied and tailored, including changes in terminology, is captured in the project initiation documentation. The daily log is for informal observations, the lessons report passes on lessons, and the mandate is the trigger produced before the project starts.",ref:"Tailoring: the rules",of:1},
{s:"principles",q:"A sponsor proposes dropping the business case for a project that is required by a new regulation, arguing that the project must happen anyway. How should the project manager respond?",o:["Agree, provided the decision is recorded in the PID as a tailoring decision", "Agree, because projects driven by regulation are exempt from business justification", "Ask the business layer to authorize a waiver of the principle for this project", "Explain that a justification is still needed and that tailoring cannot remove a principle"],a:3,e:"All seven principles must be applied; tailoring can change how much detail the business case holds, but not remove continued business justification. Even a compulsory project needs a justification, for example the best-value option for compliance. No one can waive a principle.",ref:"Continued business justification",of:1},
{s:"principles",q:"A project manager forecasts that the current stage will finish three days late. The stage time tolerance agreed with the board is five days. What should the project manager do?",o:["Ask the team manager to produce an exception plan for the remaining work", "Continue managing the stage and report the position in the next highlight report", "Raise an exception report so that the board can decide on corrective action", "Refer the forecast to the business layer because a target date will be missed"],a:1,e:"Under manage by exception, a deviation within tolerance does not need escalating: the project manager keeps managing and reports status through regular reporting. An exception report is only needed when a deviation beyond tolerance is forecast.",ref:"Manage by exception",of:1},
{s:"principles",q:"How does the focus on products principle help a project manager prepare plans?",o:["Lessons from earlier projects are the basis for writing each new product description", "Activity lists are the basis for identifying the products the project must deliver", "Stage tolerances are the basis for deciding which products should be described first", "Product descriptions are the basis for estimates, resources, dependencies and schedules"],a:3,e:"Focus on products means defining products and their quality requirements first. Product descriptions then provide the means to determine effort, estimates, resource requirements, dependencies and activity schedules. Planning from activities first is the opposite of product focus.",ref:"Focus on products",of:1},
{s:"principles",q:"When does the learn from experience principle expect lessons to be sought?",o:["Throughout the project, by everyone, without waiting to be given them", "At closure only, when the lessons report is passed on to the business layer", "When an exception occurs, so that the exception plan can reflect what went wrong", "At the end of each stage, when the project manager compiles the end stage report"],a:0,e:"Lessons must be sought, recorded and acted upon throughout the project, and everyone involved should seek them rather than wait for someone else. They are reported at stage ends and closure, but these are not the only times.",ref:"Learn from experience",of:1},
{s:"principles",q:"Which statement describes the define roles, responsibilities and relationships principle?",o:["Each role is held by one named person and can never be shared with another role", "Everyone has agreed roles and responsibilities, and relationships are built", "The project board defines every task that team members carry out each week", "Responsibilities are agreed with the business layer before the executive is appointed"],a:1,e:"The principle requires agreed roles and responsibilities so people know what to do and what to expect from others, and the team initiates and builds relationships with and between internal and external stakeholders. PRINCE2 lets roles be shared or combined and does not allocate tasks one to one.",ref:"Defined roles, responsibilities",of:1},
{s:"principles",type:"List",q:"Which TWO factors should influence how PRINCE2 is tailored for a project?\n1. The size and complexity of the project\n2. The risk and importance of the project\n3. The project manager's preferred document templates\n4. The number of principles the board wants to apply",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:0,e:"A PRINCE2 project is tailored to suit its size, environment, complexity, importance, capability and risk. Personal template preferences are not a tailoring factor, and the number of principles is fixed at seven.",ref:"Tailoring: the rules",of:1},
{s:"people",q:"A project manager brings the team together to agree ways of working, asks regularly for feedback, and persuades a reluctant department to take part. Which aspect of the people element is she demonstrating?",o:["Change control", "Leadership", "Culture", "Management"],a:1,e:"Leading and motivating people is best done through collaboration across the project ecosystem: persuading, influencing and co-creating, managing key relationships and seeking regular feedback. Management is instructing the execution of tasks in line with agreed ways of working.",ref:"Core people concepts",of:1},
{s:"people",q:"A team manager shows a new team member exactly how to record test results, following the procedure the team agreed at the start of the work package. Which aspect of the people element does this describe?",o:["Leadership", "Management", "Stakeholder engagement", "Co-creation"],a:1,e:"Management is instructing the execution of tasks in line with agreed ways of working. Leadership motivates and influences; co-creation is jointly shaping solutions and ways of working with others.",ref:"Core people concepts",of:1},
{s:"people",q:"A project manager invites representatives of the departments that will use a new system to help design how the new processes will work, so the changes are adopted once delivered. What is the project manager doing?",o:["Transferring the risk of poor adoption to the departments that will use the system", "Delegating authority for changes to a change authority within agreed limits", "Co-creating ways of working with stakeholders across the project ecosystem", "Applying management by instructing teams to follow the agreed ways of working"],a:2,e:"Co-creation involves stakeholders in jointly shaping solutions and ways of working, which improves their willingness to adopt them. Delegating change authority is part of the issues practice, management is instructing tasks, and risk transfer passes part of a risk to a third party.",ref:"Core people concepts",of:1},
{s:"people",q:"Before designing the project team, a project manager maps the departments, suppliers, regulators and unions the project will interact with or affect, and the relationships between them. What is she analysing?",o:["The organizational ecosystem", "The project management team structure", "The work breakdown structure", "The project ecosystem"],a:0,e:"The organizational ecosystem is the wider network of organizations, groups and relationships the project operates within. The project ecosystem is the project's own people, structure and relationships, designed as a distinct entity within it. The WBS and team structure are products of the organizing practice.",ref:"The ecosystem map",of:1},
{s:"people",q:"Which management product describes the current, interim and target organizational states, and how the business will move from one to the next?",o:["Communication management approach", "Project plan", "Benefits management approach", "Change management approach"],a:3,e:"The change management approach establishes the target organizational state needed to meet the project's objectives, and the means by which the business shifts from the current state through any interim states, with enabling activities, resources and responsibilities.",ref:"People management products",of:1},
{s:"people",q:"A project will move 300 claims handlers to a new system. The project manager plans training, revised routines and support until the staff have adopted the new ways of working. Which concept does this describe?",o:["Change management, moving people from the current to the target state", "Change control, assessing and approving changes to the project's baseline", "Configuration of the project ecosystem at the end of the initiation stage", "Quality control, checking that the system meets its quality specifications"],a:0,e:"Change management (part of the people element) is about transitioning the organization and its people from the current state to the target state. Change control belongs to the issues practice and deals with changes to baselined products.",ref:"Change: current state",of:1},
{s:"people",q:"Which statement best describes a stakeholder?",o:["Any person who works in the project management team during delivery", "Any organization that has signed a commercial agreement with the project", "Anyone who can affect, or be affected by, the project", "Any member of the project board, representing the business, user or supplier"],a:2,e:"A stakeholder is any individual, group or organization that can affect, be affected by, or perceive itself to be affected by the project. Board members, team members and suppliers can be stakeholders, but the term is much wider and includes regulators, unions and the public.",ref:"The ecosystem map",of:1},
{s:"people",q:"Why does PRINCE2 treat stakeholder engagement as crucial to a project's success?",o:["Stakeholders replace project assurance when the board has delegated its duties", "Stakeholders set the project tolerances that the project board must work within", "Stakeholders who feel threatened by the project may oppose or block it", "Stakeholders approve each stage plan before the project board can authorize it"],a:2,e:"Each stakeholder stands to gain or lose from the project. With buy-in they may support it; without it they may oppose and even block its progress. Stage plans are authorized by the board, and project tolerances are set by the business layer.",ref:"The ecosystem map",of:1},
{s:"people",q:"A project team drawn from three organizations starts out working in the style of the lead organization. After some months it develops its own shared attitudes and ways of working. What does this illustrate?",o:["Project culture is fixed by the project board in the communication approach", "Project culture must match the lead organization's culture for the whole project", "Project culture is only formed once the team reaches the final delivery stage", "Project culture can start by reflecting the organization's culture and then evolve"],a:3,e:"At the start, project culture tends to reflect the organization's culture, but a distinct project culture may emerge. The ways of working should stay aligned with how people actually work, with the desired culture and with the wider ecosystem.",ref:"Core people concepts",of:1},
{s:"people",q:"Branch staff will use a new system but are not part of the project team. The project needs them to change their routines when the system goes live. What does PRINCE2 say about leading these people?",o:["They should be given work packages so that their progress can be reported in checkpoints", "They should be added to the project team so the PM has formal authority over them", "They are outside the project, so they are managed only by business-as-usual managers", "Leading people beyond the project's direct authority needs influence and cultural intelligence"],a:3,e:"People affected by the project who are not in the project team may contribute directly or indirectly, for example by integrating new products into their area. Leading people beyond direct authority, often across organizational boundaries, requires influence and cultural intelligence.",ref:"Core people concepts",of:1},
{s:"people",q:"Why do project managers often rely on their ability to influence and motivate people rather than on formal authority?",o:["In temporary teams, actual power may not match formal authority", "Formal authority belongs to team managers, who set work package tolerances", "The project board removes the project manager's authority once the PID is approved", "PRINCE2 does not give the project manager any authority within stage tolerances"],a:0,e:"A project manager has formal authority within the tolerances set by the board, but because projects are temporary and people have multiple reporting lines and competing priorities, the actual power structure may differ. Team members may even be more senior than the project manager.",ref:"Core people concepts",of:1},
{s:"people",q:"What should the communication management approach focus on, according to PRINCE2?",o:["Listening to perceptions and concerns as much as broadcasting messages", "Replacing face-to-face contact with written reports to keep a full audit trail", "Restricting information to the project board until each stage has been approved", "Sending the same formal report to every stakeholder at fixed weekly intervals"],a:0,e:"The communication management approach should focus on listening and understanding perceptions and concerns as much as broadcasting, involve key influencers, provide information in multiple formats for sharing and feedback, and be adapted for co-located, remote and hybrid teams.",ref:"People management products",of:1},
{s:"people",q:"A project team is spread across three countries and works almost entirely online. What does PRINCE2 suggest the project manager should consider?",o:["Reduce reporting to end stage reports, as time zones make meetings difficult", "Plan extra activities to build social cohesion and adapt communication", "Move all team members to one location before the first delivery stage", "Appoint a team manager in each country so no cross-country contact is needed"],a:1,e:"Whether teams are virtual, in person or hybrid, how people work together needs careful thought. When teams are virtual or hybrid, building social cohesion may need additional activities, and communication should be adapted for remote and hybrid teams.",ref:"People management products",of:1},
{s:"people",q:"Employees affected by a reorganization trust their union representatives more than official announcements. How should the communication management approach respond?",o:["Involve key influencers, such as union representatives, to shape messaging", "Increase the number of official announcements until employees accept the changes", "Raise an issue so the project board can decide whether to communicate at all", "Exclude union representatives so that only approved messages are distributed"],a:0,e:"PRINCE2's guidance is that the communication management approach should involve key influencers to shape messaging and support communications, and should focus on listening as well as broadcasting.",ref:"People management products",of:1},
{s:"people",q:"Which PRINCE2 principle ensures that people factors are continually addressed throughout the project's lifecycle?",o:["Ensure continued business justification", "Learn from experience", "Focus on products", "Define roles, responsibilities and relationships"],a:3,e:"One of the seven principles is that every PRINCE2 project must define roles, responsibilities and relationships, which ensures people factors are addressed throughout the lifecycle.",ref:"Defined roles, responsibilities",of:1},
{s:"people",q:"How are people aspects integrated into the PRINCE2 processes?",o:["They assign each person a fixed set of tasks for every activity in the project lifecycle", "They leave people aspects to the people element, which runs separately from them", "They cover people only in starting up a project, when the project team is appointed", "They show how people interface between the four layers, from commissioning to delivering"],a:3,e:"The processes are organized into four layers (commissioning, directing, managing and delivering), and people factors such as behaviours, culture and relationships are included in them, explaining how people interface between the layers.",ref:"Core people concepts",of:1},
{s:"people",type:"Missing word",q:"Identify the missing word in the following sentence.\n\nThe three people-focused activities in PRINCE2 are leading successful change, leading successful teams, and [?].",o:["delegation", "assurance", "communication", "procurement"],a:2,e:"The three people-focused activities are leading successful change, leading successful teams, and communication. They are not stand-alone activities: they influence all aspects of project management.",ref:"The three people-focused activities",of:1},
{s:"people",type:"List",q:"Which TWO management products does PRINCE2 identify as supporting the building of effective teams?\n1. Project plan\n2. Project management team structure and role descriptions\n3. Risk register\n4. Issue report",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:0,e:"PRINCE2 supports building effective teams through the project plan, the project management team structure and role descriptions, the communication management approach, the PID and product-based planning. The risk register and issue report support the risk and issues practices.",ref:"People management products",of:1},
{s:"people",q:"Which statement about capability and competence in a project team is CORRECT?",o:["Performance depends on how people work together, not only on individual competence", "Diversity in a team should be minimized to make collaboration easier", "Capability is fixed when the project starts and cannot be developed later", "A competent individual will perform the same way whichever team they join"],a:0,e:"An effective team needs a diverse set of capabilities, competencies and perspectives matching the project's needs. The same person may perform differently depending on who they are working with, and capability can be developed as the project progresses.",ref:"Core people concepts",of:1},
{s:"people",q:"Why is managing people in line with agreed ways of working more effective when those ways of working were co-created with the team?",o:["Co-creation replaces the communication management approach for the project", "Co-created ways of working are approved by the business layer and cannot change", "People are more willing to be managed in line with ways of working they helped to create", "Co-created ways of working remove the need for the project manager to lead the team"],a:2,e:"PRINCE2 notes that managing people in line with ways of working is far more effective when they were co-created with team members and stakeholders, because this improves their willingness to be managed in line with them.",ref:"Core people concepts",of:1},
{s:"processes",q:"A department head emails an outline idea for a new customer portal to the director. What should happen before any detailed planning of the project takes place?",o:["Directing a project should authorize the project and set the stage tolerances", "Initiating a project should prepare the full business case and the project plan", "Controlling a stage should authorize work packages for the design of the portal", "Starting up a project should do the minimum to decide if initiation is worthwhile"],a:3,e:"The purpose of starting up a project is to ensure only viable projects are initiated, doing the minimum necessary to decide whether it is worthwhile to initiate. The detailed planning of initiation comes only after the board authorizes it.",ref:"Purpose and objectives",of:1},
{s:"processes",type:"List",q:"Which TWO are objectives of the starting up a project process?\n1. To plan the work required for the initiation stage\n2. To prepare the full business case for approval\n3. To agree the tailoring requirements for the project\n4. To evaluate delivery methods and select a project approach",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:3,e:"Starting up a project ensures, among other things, that delivery methods are evaluated and an approach selected, and that the work for the initiation stage is planned in a stage plan. Preparing the full business case and agreeing tailoring requirements are activities of initiating a project.",ref:"Purpose and objectives",of:1},
{s:"processes",q:"A project is part of a programme. How might this affect starting up a project?",o:["The programme manager becomes the executive and also acts as project manager", "The programme replaces starting up a project, so the project begins with initiation", "The programme may provide the project brief and appoint some of the project board", "The project brief is replaced by the programme's own business case"],a:2,e:"If the project is part of a programme, the programme should provide the project brief and appoint some board members. The process is still used, and the executive and project manager roles still cannot be combined.",ref:"Starting up a Project",of:1},
{s:"processes",q:"The project board receives a request from the project manager, following starting up a project, to begin the initiation stage. Which activity is the board carrying out when it decides?",o:["Give ongoing direction", "Authorize a stage or exception plan", "Authorize the project", "Authorize initiation"],a:3,e:"Authorize initiation is triggered by the request to initiate a project that follows starting up a project. The board decides whether the investment in initiation is worthwhile. Authorize the project comes after initiation, when the PID is presented.",ref:"Directing a Project",of:1},
{s:"processes",q:"The executive asks the project manager to attend a weekly progress meeting with the whole board. How does the directing a project process view this?",o:["It is required: the board manages the stage day to day on behalf of the business layer", "It is not needed: the board monitors by reports and controls at decision points", "It is required: the board must review every work package before it is authorized", "It is not needed: the board has no further role once it has authorized the project"],a:1,e:"In directing a project, the board manages by exception: it monitors through reports and controls through a small number of decision points, so other progress meetings should not be needed. It still gives ongoing direction, including informal advice, throughout the project.",ref:"Directing a Project",of:1},
{s:"processes",q:"What is the last activity that the project board carries out before it disbands?",o:["Confirm benefits, which reviews whether the expected benefits were realized", "Give ongoing direction, which responds to any exceptions raised at closure", "Authorize the project, which commits resources to the remaining stages", "Authorize project closure, which may need endorsement from the business"],a:3,e:"Authorizing project closure is the board's last activity before its own disbandment, and it may require endorsement from the business. Most benefits are confirmed after closure, in benefit reviews planned in the benefits management approach.",ref:"Directing a Project",of:1},
{s:"processes",q:"Before committing significant funds, a board wants a shared understanding of how progress will be monitored, how quality will be achieved and who needs what information. Which process provides this?",o:["Initiating a project", "Directing a project", "Starting up a project", "Managing a stage boundary"],a:0,e:"The objectives of initiating a project are to ensure a common understanding of the reasons, scope, delivery, decisions, quality, baselines, risks, progress, information needs and how business policies apply, before significant expenditure.",ref:"Purpose and objectives",of:1},
{s:"processes",q:"When agreeing the management approaches during initiating a project, what should they be derived from?",o:["The project mandate alone, because the board has not yet approved the project brief", "The highlight reports from the initiation stage and the project board's feedback on them", "The team plans that each team manager has prepared for the first delivery stage", "Business strategies and standards, and the users' quality and sustainability expectations"],a:3,e:"The management approaches are derived from business strategies, standards or practices the project must comply with, and from the users' quality and sustainability expectations captured in the project product description.",ref:"Initiating a Project",of:1},
{s:"processes",q:"Why is the version of the PID used to authorize the project kept after the project starts?",o:["It replaces the stage plans so that only one plan is maintained during delivery", "It is used as the lessons report so lessons can be passed to other projects", "It is a baseline for comparing actual performance with the original forecasts", "It is sent to the business layer to request authorization of each later stage"],a:2,e:"The PID assembled in initiation is used later to compare actual performance with the forecasts that formed the basis of approval; the end project report reviews performance against the version of the PID used to authorize the project.",ref:"Initiating a Project",of:1},
{s:"processes",q:"What is the purpose of the controlling a stage process?",o:["To assign and monitor work, handle issues, report progress and take corrective action", "To establish solid foundations for the project before significant expenditure", "To agree the requirements for accepting, executing and delivering a work package", "To provide the board with information to approve the next stage plan and review justification"],a:0,e:"Controlling a stage assigns work, monitors it, handles issues, reports progress to the board and takes corrective action so the stage stays within the tolerances set by the board. The other options describe managing a stage boundary, managing product delivery and initiating a project.",ref:"Purpose and objectives",of:1},
{s:"processes",type:"List",q:"Which TWO are objectives of the controlling a stage process?\n1. To prepare the stage plan for the next stage\n2. To keep risks and issues under control\n3. To ensure the stage's products meet the agreed quality expectations\n4. To obtain authorization to deliver the project",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:1,e:"Controlling a stage aims to keep attention on the stage's products, avoid uncontrolled change, stay within tolerance, keep risks and issues under control, keep the business case under review and ensure the products meet agreed quality expectations and are accepted. Preparing the next stage plan happens in managing a stage boundary, and authorization to deliver the project is given in directing a project.",ref:"Purpose and objectives",of:1},
{s:"processes",q:"A team manager tells the project manager that a work package is finished and its products have been handed over. In which group of controlling a stage activities does the project manager record this?",o:["Monitoring and reporting, by evaluating the management stage status", "Managing work packages, by receiving completed work packages", "Managing issues and risks, by taking corrective action within tolerance", "Managing issues and risks, by capturing and assessing issues and risks"],a:1,e:"Controlling a stage groups its activities into managing work packages (authorize, evaluate status, receive completed work packages), monitoring and reporting (evaluate stage status, report highlights) and managing issues and risks (capture and assess, escalate, take corrective action).",ref:"Controlling a Stage",of:1},
{s:"processes",q:"While controlling a stage, the project manager assesses an issue and forecasts that it will take the stage beyond its cost tolerance. What should the project manager do next?",o:["Escalate it by raising an exception report to the project board", "Refer the issue directly to the business layer for a decision", "Take corrective action, because the project manager owns the stage budget", "Ask the team manager to absorb the cost within the work package tolerance"],a:0,e:"Issues and risks that cannot be resolved within the tolerances set by the board are escalated: the project manager raises an exception report to the board. Corrective action is only for deviations that can be handled within tolerance. The board, not the PM, refers project-level exceptions to the business layer.",ref:"Controlling a Stage",of:1},
{s:"processes",q:"In managing product delivery, what does a team manager do when accepting a work package?",o:["Delivers the completed products in line with the procedure in the work package", "Agrees with the project manager what is to be delivered and creates a team plan", "Authorizes the team members to start work on the products in the stage plan", "Reports progress to the project manager at the frequency set in the work package"],a:1,e:"Accepting a work package is an agreement between the project manager and team manager on what is to be delivered; the team manager creates a team plan for developing the products. Reporting progress is part of executing and evaluating, and delivery happens when notifying completion.",ref:"Managing Product Delivery",of:1},
{s:"processes",q:"A team manager reviews the team's progress and sends a checkpoint report to the project manager, at the interval set in the work package description. Which managing product delivery activity is this?",o:["Evaluate a work package", "Authorize a work package", "Notify work package completion", "Accept a work package"],a:0,e:"In evaluate a work package, the team manager reviews progress of the team's work and reports to the project manager for each period defined in the work package description. Authorize a work package is a project manager activity in controlling a stage.",ref:"Managing Product Delivery",of:1},
{s:"processes",q:"What is the purpose of the managing product delivery process?",o:["To confirm acceptance of the project product and hand it over to the business layer", "To allow the project board to authorize work packages and set their tolerances", "To control the link between the PM and team managers by agreeing work requirements", "To enable the project manager to plan the next stage and update the business case"],a:2,e:"Managing product delivery controls the link between the project manager and the team managers, agreeing requirements for acceptance, execution and delivery. Team managers coordinate an area of work that delivers one or more products. Work packages are authorized by the project manager, not the board.",ref:"Managing Product Delivery",of:1},
{s:"processes",q:"Near the end of a stage, the project manager prepares the next stage plan, updates the business case and produces an end stage report. What is the purpose of the process being used?",o:["To confirm acceptance of the stage's products and transfer them to the business layer", "To agree requirements for accepting, executing and delivering the products of the stage", "To give the board the information to review the stage and approve the next stage plan", "To monitor work, handle issues and take corrective action to keep the stage within tolerance"],a:2,e:"Managing a stage boundary enables the board to review the success of the current stage, approve the next stage plan, review the updated project plan, and confirm continued business justification and the acceptability of the risks.",ref:"Purpose and objectives",of:1},
{s:"processes",q:"Which processes can lead into managing a stage boundary?",o:["Directing a project and managing product delivery", "Starting up a project and closing a project", "Closing a project and controlling a stage", "Initiating a project and controlling a stage"],a:3,e:"Managing a stage boundary has two entry points: initiating a project (to plan the first delivery stage) and controlling a stage (near the end of a stage or when an exception plan is needed). It is not used after the final stage, which leads into closing a project.",ref:"Managing a Stage Boundary",of:1},
{s:"processes",q:"After an exception report, the board asks the project manager for a plan to recover the current stage. Which process produces this plan, and what happens if the board approves it?",o:["Controlling a stage; the exception plan is added to the current stage plan", "Managing a stage boundary; the exception plan replaces the stage plan in exception", "Managing product delivery; the team manager replaces the team plan in exception", "Directing a project; the board writes the exception plan and sets new tolerances"],a:1,e:"Exception plans are prepared in managing a stage boundary, to the same level of detail as the plan they replace. If approved, the exception plan replaces the plan in exception and becomes the new baselined plan.",ref:"Managing a Stage Boundary",of:1},
{s:"processes",q:"At a stage boundary the board decides not to continue, because the updated business case no longer justifies the project. How does PRINCE2 view this decision?",o:["It is a failure of tailoring, because the stages were too long to detect the problem", "It is a failure of the project manager, who should have raised an exception earlier", "It is not allowed, because only the business layer can decide to stop a project", "It is not a failure; failing to give the board enough information to decide would be"],a:3,e:"A positive decision not to proceed is not a failure. Providing insufficient information, so the board cannot make an informed decision, is a failure because it may lead to a wrong or delayed decision.",ref:"Managing a Stage Boundary",of:1},
