<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRINCE2 Foundation — Interactive Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1f24; --ink-soft:#454d56; --paper:#f4f1ea; --paper-2:#ece7dc;
  --card:#fffdf8; --line:#d9d2c4; --line-soft:#e6e0d3;
  --navy:#1c3b5a; --navy-2:#244c73; --gold:#b07c2b; --gold-soft:#d9a94f;
  --green:#2f6b4f; --red:#a93b2e; --red-soft:#f3e3df; --green-soft:#e0ede6;
  --shadow:0 1px 2px rgba(26,31,36,.04),0 8px 24px rgba(26,31,36,.06);
  --shadow-lg:0 4px 12px rgba(26,31,36,.08),0 24px 48px rgba(26,31,36,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Spline Sans',sans-serif; background:var(--paper); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 20% 0%,rgba(28,59,90,.03),transparent 40%),radial-gradient(circle at 90% 100%,rgba(176,124,43,.04),transparent 45%);
  background-attachment:fixed;
}
.serif{font-family:'Fraunces',serif}
.mono{font-family:'Spline Sans Mono',monospace}

/* ---------- Layout shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:260px;flex-shrink:0;background:var(--navy);color:#e8eef3;
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 0;
  border-right:1px solid rgba(0,0,0,.2);
}
.brand{position:relative;padding:0 26px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.brand .crest{font-family:'Fraunces',serif;font-weight:800;font-size:25px;letter-spacing:-.5px;line-height:1.05}
.brand .crest em{color:var(--gold-soft);font-style:normal}
.brand .sub{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#9bb0c4;margin-top:6px}
.nav{list-style:none;padding:0 14px}
.nav li{margin:1px 0}
.nav button{
  width:100%;text-align:left;background:none;border:none;color:#c3d2e0;
  font-family:'Spline Sans',sans-serif;font-size:14.5px;font-weight:500;
  padding:10px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:11px;
  transition:all .15s;
}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--gold);color:#1a1206;font-weight:600}
.nav .ico{font-size:16px;width:20px;text-align:center;opacity:.9}
.nav-sec{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#7c93a8;padding:18px 18px 7px}
.sb-foot{padding:18px 26px 0;font-size:11.5px;color:#8ba0b4;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-hide{position:absolute;top:-6px;right:12px;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#e8eef3;font-size:19px;line-height:1;cursor:pointer}
.sb-hide:hover{background:rgba(255,255,255,.14);color:#fff}
.sb-show{display:none;position:fixed;top:14px;left:14px;z-index:45;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-family:'Spline Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.sb-show:hover{background:var(--navy-2)}
.sb-hide:focus-visible,.sb-show:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
@media(min-width:881px){
  body.nav-collapsed .sidebar{display:none}
  body.nav-collapsed .sb-show{display:flex}
  body.nav-collapsed .content{padding-top:76px}
}
@media(max-width:880px){.sb-hide,.sb-show{display:none!important}}
.topbar{
  display:none;background:var(--navy);color:#fff;padding:14px 18px;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;
}
.topbar .crest{font-family:'Fraunces',serif;font-weight:800;font-size:19px}
.topbar .crest em{color:var(--gold-soft);font-style:normal}
.burger{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 11px;font-size:18px;cursor:pointer}
.content{flex:1;padding:46px 52px 90px;max-width:920px;width:100%;margin:0 auto}

/* ---------- Typography ---------- */
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
h1.page{font-family:'Fraunces',serif;font-weight:800;font-size:42px;line-height:1.05;letter-spacing:-1px;margin-bottom:14px}
h1.page .small{font-size:.5em;color:var(--gold);font-weight:600;display:block;letter-spacing:0}
.lede{font-size:18px;color:var(--ink-soft);max-width:64ch;margin-bottom:34px}
h2.sec{font-family:'Fraunces',serif;font-weight:800;font-size:27px;margin:40px 0 14px;letter-spacing:-.5px;padding-bottom:8px;border-bottom:2px solid var(--line)}
h3.sub{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:26px 0 8px;color:var(--navy)}
p{margin-bottom:14px}
.content a{color:var(--navy-2);text-decoration:underline;text-decoration-color:var(--gold-soft);text-underline-offset:2px}
strong{font-weight:600;color:var(--ink)}

/* ---------- Cards & callouts ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.callout{border-left:4px solid var(--gold);background:var(--paper-2);border-radius:0 12px 12px 0;padding:16px 20px;margin:18px 0}
.callout.trap{border-color:var(--red);background:var(--red-soft)}
.callout.key{border-color:var(--green);background:var(--green-soft)}
.callout .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:5px;color:var(--gold)}
.callout.trap .tag{color:var(--red)}
.callout.key .tag{color:var(--green)}

/* principle/practice/process numbered blocks */
.pblock{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.pblock:last-child{border-bottom:none}
.pnum{flex-shrink:0;width:42px;height:42px;border-radius:12px;background:var(--navy);color:var(--gold-soft);
  font-family:'Fraunces',serif;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.pbody h4{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:4px}
.pbody .stmt{font-size:14.5px;color:var(--ink-soft)}
.pbody .hook{font-size:13px;margin-top:6px;color:var(--gold);font-weight:500}
.pbody .hook b{color:var(--navy)}

table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:13px}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:rgba(0,0,0,.015)}

.lifecycle{background:var(--navy);color:#dce6ef;border-radius:14px;padding:22px;font-family:'Spline Sans Mono',monospace;
  font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre;margin:18px 0}
.lifecycle b{color:var(--gold-soft)}

.recall{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#eef3f8;border-radius:14px;padding:22px 24px;margin:22px 0}
.recall .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:8px}
.recall ol{margin-left:18px;font-size:14.5px}
.recall li{margin:5px 0}

/* ---------- Progress bits ---------- */
.prog-wrap{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:99px;transition:width .5s}
.btn{font-family:'Spline Sans',sans-serif;font-weight:600;font-size:14.5px;border:none;border-radius:11px;padding:11px 22px;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-gold{background:var(--gold);color:#1a1206}
.btn-gold:hover{background:var(--gold-soft);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--navy);background:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--paper-2);color:var(--ink-soft)}
.pill.ok{background:var(--green-soft);color:var(--green)}

/* ---------- Dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.stat .n{font-family:'Fraunces',serif;font-weight:800;font-size:38px;line-height:1;color:var(--navy)}
.stat .n .u{font-size:18px;color:var(--ink-soft)}
.stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px}
.checklist{list-style:none}
.checklist li{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.checklist .box{flex-shrink:0;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .15s}
.checklist .box.done{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Flashcards ---------- */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:10px}
.flashcard{width:100%;max-width:560px;height:min(320px,58vh);perspective:1600px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;padding:34px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow-lg)}
.fc-front{background:var(--card);border:1px solid var(--line)}
.fc-back{background:var(--navy);color:#eef3f8;transform:rotateY(180deg)}
.fc-deck{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px}
.fc-back .fc-deck{color:var(--gold-soft)}
.fc-text{font-family:'Fraunces',serif;font-size:21px;line-height:1.35;white-space:pre-line}
.fc-back .fc-text{font-size:16px;font-family:'Spline Sans',sans-serif;line-height:1.55}
.fc-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-soft);opacity:.7}
.fc-back .fc-hint{color:#9bb0c4}
.fc-rate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- Quiz / drill ---------- */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 30px;box-shadow:var(--shadow-lg);margin-bottom:18px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;color:var(--ink-soft)}
.q-sec-tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.q-text{font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.4;margin-bottom:22px;white-space:pre-line}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
  border-radius:13px;padding:15px 17px;margin-bottom:11px;cursor:pointer;font-size:15px;transition:all .14s;font-family:'Spline Sans',sans-serif;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy-2);background:var(--card)}
.opt .ltr{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all .14s}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .ltr{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .ltr{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.explain{border-radius:12px;padding:15px 18px;margin-top:6px;font-size:14.5px;line-height:1.5;display:none}
.explain.show{display:block}
.explain.right{background:var(--green-soft);border-left:4px solid var(--green)}
.ref-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.ref-lbl{font-size:13px;font-weight:600;color:var(--ink-soft);margin-right:2px}
.ref-link{font:inherit;font-size:13.5px;font-weight:600;color:var(--navy);background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;text-align:left}
.ref-link:hover{border-color:var(--navy);background:var(--card)}
.ref-link:focus-visible,.ref-back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ref-link.ref-vid{color:var(--ink-soft)}
.ref-back{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--navy);border:0;border-radius:99px;padding:12px 18px;box-shadow:var(--shadow-lg);cursor:pointer}
.ref-hit{outline:3px solid var(--gold-soft);outline-offset:4px;border-radius:10px;transition:outline-color 2s ease}
@media (prefers-reduced-motion: reduce){.ref-hit{transition:none}}
.explain.wrong{background:var(--red-soft);border-left:4px solid var(--red)}
.explain .v{font-weight:700;display:block;margin-bottom:3px}
.explain.right .v{color:var(--green)}
.explain.wrong .v{color:var(--red)}

.quiz-setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin:20px 0}
.sec-choice{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:all .15s;text-align:left}
.sec-choice:hover{border-color:var(--navy)}
.sec-choice.sel{border-color:var(--gold);background:var(--paper-2)}
.sec-choice h4{font-family:'Fraunces',serif;font-size:17px;margin-bottom:3px}
.sec-choice .c{font-size:13px;color:var(--ink-soft)}
.sec-choice .acc{font-size:12px;margin-top:7px;font-weight:600}

.timer{font-family:'Spline Sans Mono',monospace;font-weight:500;font-size:15px;padding:5px 13px;border-radius:9px;background:var(--navy);color:#fff}
.timer.warn{background:var(--red)}
.exam-nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin:16px 0}
.qdot{aspect-ratio:1;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:all .12s}
.qdot.answered{background:var(--navy);color:#fff;border-color:var(--navy)}
.qdot.flagged{border-color:var(--gold);background:var(--gold-soft);color:#1a1206}
.qdot.current{outline:3px solid var(--gold);outline-offset:1px}

.result-ring{width:170px;height:170px;margin:0 auto 10px;position:relative}
.result-ring svg{transform:rotate(-90deg)}
.result-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result-ring .pct .n{font-family:'Fraunces',serif;font-weight:800;font-size:42px;line-height:1}
.result-ring .pct .l{font-size:12px;color:var(--ink-soft);letter-spacing:1px}

.verdict{text-align:center;font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:8px 0}
.verdict.pass{color:var(--green)}.verdict.fail{color:var(--red)}

.breakdown{margin:18px 0}
.bd-row{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:14px}
.bd-row .nm{width:110px;font-weight:500;text-transform:capitalize}
.bd-row .track{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bd-row .fill{height:100%;border-radius:99px}
.bd-row .sc{width:54px;text-align:right;font-family:'Spline Sans Mono',monospace;font-size:13px}

.hidden{display:none!important}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .fc-inner{transition:none!important}
  html{scroll-behavior:auto}
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0}
.table-scroll table{margin:0}

/* ---- diagrams hub (rich cards) ---- */
.dh-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:0 0 20px;box-shadow:var(--shadow)}
.dh-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dh-card .diagram{margin-top:4px;margin-bottom:4px}
.dh-tag{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#1a1206;background:var(--gold);padding:3px 10px;border-radius:99px;vertical-align:middle;white-space:nowrap}
.dh-tag.dh-static{background:var(--paper-2);color:var(--ink-soft)}
.dh-expl{font-size:14.5px;line-height:1.6;color:var(--ink);margin:14px 0 12px}
.dh-qa{margin-top:4px}

/* ---- question format badge ---- */
.q-fmt{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--navy);color:#fff;padding:2px 8px;border-radius:99px;margin-left:4px}

/* ---- people ecosystem map ---- */
.pe-diagram svg{min-width:600px}
.pe-org{fill:rgba(36,76,115,.06);stroke:var(--navy-2);stroke-width:1.5;stroke-dasharray:7 5}
.pe-proj{fill:rgba(176,124,43,.07);stroke:var(--gold);stroke-width:1.5}
.pe-outer-lbl{font-size:12px;font-weight:700;fill:var(--navy-2);letter-spacing:.5px}
.pe-outer-sub{font-size:10px;fill:var(--ink-soft)}
.pe-inner-lbl{font-size:11px;font-weight:700;fill:var(--gold);text-anchor:middle;letter-spacing:.5px}
.pe-circle{opacity:.82;cursor:pointer;transition:all .15s;mix-blend-mode:multiply}
.pe-circle:hover{opacity:.95}
.pe-circle.pe-sel{stroke:var(--navy);stroke-width:3.5}
.pe-business{fill:#5b8bb8}.pe-user{fill:#6aa98a}.pe-supplier{fill:#c9a24a}
.pe-cl{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}
.pe-cl-sm{font-size:10px;fill:#fff;text-anchor:middle;pointer-events:none;opacity:.9}
.pe-dot{fill:var(--navy-2);cursor:pointer;transition:all .15s}
.pe-dot:hover{fill:var(--gold)}.pe-dot.pe-sel{fill:var(--gold);stroke:var(--navy);stroke-width:2}
.pe-rel{stroke:var(--navy-2);stroke-width:1;opacity:.4}
.pe-legend{font-size:11px;fill:var(--ink-soft)}

/* ---- role relationship map ---- */
.rm-diagram svg{min-width:600px}
.rm-lane{font-size:11px;font-weight:700;fill:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.rm-board-label{font-size:10.5px;font-weight:700;fill:var(--gold);text-anchor:middle;letter-spacing:1px}
.rm-box{fill:var(--paper-2);stroke:var(--line);stroke-width:1.5;cursor:pointer;transition:all .15s}
.rm-box:hover{stroke:var(--navy-2);stroke-width:2.4}
.rm-box.rm-sel{stroke:var(--gold);stroke-width:3.4;filter:drop-shadow(0 2px 6px rgba(176,124,43,.35))}
.rm-box.corp{fill:#e9e3f0}.rm-box.exec{fill:#e7eef5}.rm-box.su{fill:#e3ecdf}.rm-box.ss{fill:#dfe8ee}
.rm-box.pm{fill:#f0e7d4}.rm-box.tm{fill:#e3ecdf}.rm-box.assure{fill:#f3e9d6;stroke:var(--gold)}
.rm-box.support{fill:#ededed}.rm-box.ca{fill:#f3e9d6;stroke:var(--gold)}
.rm-lbl{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.rm-lbl-sm{font-size:11.5px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.rm-legend{font-size:10.5px;fill:var(--ink-soft)}

<script>
// PRINCE2 Foundation — 100-question bank
// section: principles | practices | processes | products | roles | tailoring
let QUESTIONS = [
// ---------- PRINCIPLES (1-15) ----------
{s:"principles",q:"Which principle requires the project to stop if it is no longer justified?",o:["Manage by stages", "Learn from experience", "Continued business justification", "Tailor to suit the project"],a:2,e:"Continued business justification: a project must remain justified throughout, and stops if justification collapses."},
{s:"principles",q:"How many principles does PRINCE2 define?",o:["5","6","7","8"],a:2,e:"PRINCE2 defines exactly 7 principles."},
{s:"principles",q:"Which principle requires that lessons are sought, recorded, and acted upon?",o:["Continued business justification", "Focus on products", "Manage by exception", "Learn from experience"],a:3,e:"Learn from experience covers seeking, recording and acting on lessons throughout."},
{s:"principles",q:"Which principle requires the project to have at least two management stages?",o:["Manage by stages", "Focus on products", "Defined roles and responsibilities", "Tailor to suit the project"],a:0,e:"Manage by stages requires a minimum of two: initiation plus at least one delivery stage."},
{s:"principles",type:"Negative",q:"Which of the following is NOT a PRINCE2 principle?",o:["Deliver on time and to budget", "Manage by exception", "Focus on products", "Tailor to suit the project"],a:0,e:"'Deliver on time and to budget' is not a principle — a distractor."},
{s:"principles",q:"The principle 'defined roles, responsibilities and relationships' requires which three stakeholder interests are engaged?",o:["Business, project, supplier", "Customer, programme, project", "Executive, manager, team", "Business, user, supplier"],a:3,e:"The three interests are business, user, supplier."},
{s:"principles",q:"Which principle establishes limits of delegated authority?",o:["Continued business justification", "Manage by stages", "Focus on products", "Manage by exception"],a:3,e:"Manage by exception sets tolerances that define delegated authority limits."},
{s:"principles",q:"How does tailoring apply to a PRINCE2 project?",o:["It is optional and depends on the project manager’s preference", "It applies only to large or complex projects with many teams", "Every PRINCE2 project must be tailored to suit its context", "It applies only to small projects that need fewer products"],a:2,e:"Every PRINCE2 project must be tailored to its size, environment, complexity, importance, capability and risk. The project manager recommends the tailoring, the project board approves it, and it is recorded in the PID."},
{s:"principles",q:"Which principle states that PRINCE2 is product-based, not activity-based?",o:["Manage by stages", "Continued business justification", "Focus on products", "Learn from experience"],a:2,e:"Focus on products: plan by deliverables and their quality, then derive activities."},
{s:"principles",q:"At which point is continued business justification reviewed?",o:["Only at project start","Only at project close","At every stage boundary","Never explicitly"],a:2,e:"Reviewed at every stage boundary (and during exception handling)."},
{s:"principles",q:"Which principle CANNOT be tailored away?",o:["Continued business justification","Manage by stages","All seven principles","Focus on products"],a:2,e:"No principle can be tailored away — all seven always apply."},
{s:"principles",q:"The principle 'manage by exception' relates to:",o:["Tolerances and escalation paths", "Issues that escalate to the business layer", "Risk assessment only", "Quality specifications"],a:0,e:"It concerns tolerances and the escalation path when they are forecast to be exceeded."},
{s:"principles",q:"Which principle drives the use of Product Descriptions?",o:["Continued business justification", "Manage by stages", "Defined roles and responsibilities", "Focus on products"],a:3,e:"Focus on products drives product-based planning and Product Descriptions."},
{s:"principles",q:"Lessons are passed forward at:",o:["Throughout the project, and at project closure", "At project start only, when lessons are sought", "At project closure only, in the lessons report", "Only when problems occur and must be logged"],a:0,e:"Captured throughout, formally handed forward at close via the Lessons Report."},
{s:"principles",q:"The 'continued' in 'continued business justification' means:",o:["Work continues on the project without any interruption", "Justification is re-checked throughout the project", "Justification continues after project closure", "Justification is checked once, at initiation"],a:1,e:"Justification is re-confirmed at every stage boundary and whenever needed."},
// ---------- PRACTICES (16-35) ----------
{s:"practices",q:"Which document captures the user’s quality expectations?",o:["Quality Register", "Quality Management Approach", "Acceptance Criteria", "Project Product Description"],a:3,e:"The user’s quality expectations, with the acceptance criteria, are captured in the project product description during starting up a project."},
{s:"practices",q:"Who owns the Business Case?",o:["Project Manager", "Senior User", "Executive", "Project Board collectively"],a:2,e:"The Executive is responsible for the business case throughout. Why not the others: the PM maintains most management products but is not responsible for the business case. The Board is collectively accountable for the project, but the business case sits with the Executive. The Senior User specifies user needs, quality expectations and acceptance criteria."},
{s:"practices",type:"Negative",q:"Which is NOT a response to a threat?",o:["Avoid", "Reduce", "Transfer", "Exploit"],a:3,e:"Exploit is an OPPORTUNITY response, not a threat response."},
{s:"practices",q:"Which is a response to an opportunity?",o:["Reduce", "Avoid", "Fallback", "Enhance"],a:3,e:"Enhance is an opportunity response. Reduce and avoid are threat-only, and fallback is not a PRINCE2 7 response."},
{s:"practices",q:"The 'outline' Business Case is produced in which process?",o:["Starting up a Project", "Initiating a Project", "Controlling a Stage", "Closing a Project"],a:0,e:"Outline Business Case is produced in Starting up a Project (SU)."},
{s:"practices",q:"The full business case is prepared in which process?",o:["Initiating a Project", "Starting up a Project", "Directing a Project", "Managing a Stage Boundary"],a:0,e:"The outline business case is developed in starting up a project and becomes the full business case in initiating a project (“prepare the full business case”). Why not the others: starting up a project produces only the outline; directing a project approves it; managing a stage boundary updates it."},
{s:"practices",q:"How many levels of plan does PRINCE2 define?",o:["2","3","4","5"],a:1,e:"Three: Project Plan, Stage Plan, Team Plan (Exception Plan replaces Stage/Project Plan)."},
{s:"practices",q:"An Exception Plan replaces:",o:["Any plan, including a team plan", "A stage plan only, never a project plan", "A stage plan or a project plan", "A project plan only, never a stage plan"],a:2,e:"It replaces a Stage Plan or Project Plan — never a Team Plan."},
{s:"practices",type:"Negative",q:"Which is NOT a tolerance area in PRINCE2 7?",o:["Reputation", "Cost", "Time", "Sustainability"],a:0,e:"The seven aspects are time, cost, scope, quality, benefits, risk and sustainability. Reputation is not one."},
{s:"practices",q:"How many tolerance areas (performance aspects) does PRINCE2 7 define?",o:["4","5","6","7"],a:3,e:"Seven in PRINCE2 7: time, cost, scope, quality, benefits, risk and sustainability (sustainability was added in the 7th edition). Why not the others: 6 is the old 6th-edition count, the classic trap. 4 and 5 match no edition."},
{s:"practices",q:"Quality assurance in PRINCE2 is:",o:["Carried out by the project manager for the board", "Carried out by project assurance roles on the board’s behalf", "Independent of the project team, typically by the business", "Carried out by the project board at each stage end"],a:2,e:"Quality assurance is independent of the project management team and is typically performed by a function from the business. Project assurance, by contrast, is independent of the project manager but not of the project."},
{s:"practices",q:"Which document defines how risks will be identified, assessed and controlled?",o:["Risk register", "Risk management approach", "Issue management approach", "Quality management approach"],a:1,e:"The Risk Management Approach. The Register logs the risks themselves."},
{s:"practices",q:"A 'dis-benefit' is:",o:["A benefit that failed to materialise", "A risk that has actually occurred", "A benefit that was poorly defined", "An outcome seen as negative"],a:3,e:"A dis-benefit is a measurable negative outcome of the project."},
{s:"practices",type:"Negative",q:"Which is NOT a type of issue in PRINCE2 7?",o:["Risk", "Problem", "Business opportunity", "Request for change"],a:0,e:"A risk is uncertain and may never happen; an issue is an event that has occurred and needs project management consideration. Problem, business opportunity and request for change are all types of issue, as are concern, event external to the project and off-specification."},
{s:"practices",q:"An 'off-specification' issue is:",o:["Something that should be provided but won’t be", "A proposal to change something in the baseline", "A product description that is poorly specified", "An event outside the project that affects it"],a:0,e:"Off-specification: a product that should be delivered (to standard) but won't be / hasn't been."},
{s:"practices",q:"Who can decide on changes within delegated limits?",o:["Project Manager only", "Project Support", "Senior User", "Change Authority"],a:3,e:"The Change Authority decides on changes within limits delegated by the Project Board. Why not the others: The Board may delegate change decisions to the PM, to a separate person, or keep them itself, so 'PM only' is wrong. Project Support is administrative."},
{s:"practices",q:"The Project Product Description is owned by:",o:["Senior User", "Project Manager", "Executive", "Senior Supplier"],a:0,e:"Owned by the Senior User (represents the user/acceptance interest). Why not the others: The Executive owns the Business Case, not the Project Product Description, a frequent swap. The PM maintains documents but does not own this one.",retired:1},
{s:"practices",q:"Acceptance criteria are:",o:["Quality specifications for each individual product", "A prioritised list of what the user will accept", "The project board’s checklist for each stage", "The measures used to report project success"],a:1,e:"Acceptance criteria are a prioritised list of measurable criteria the project product must meet before the user accepts it. Quality specifications apply to individual products."},
{s:"practices",q:"The Risk Budget is approved by:",o:["Project Manager","Executive","Project Board","Senior Supplier"],a:2,e:"The Project Board approves the Risk Budget. Why not the others: The Executive owns the Business Case, but the Risk Budget is approved by the Project Board as a whole. The PM manages it but does not approve it."},
{s:"practices",q:"A risk 'owner' is:",o:["The person carrying out specific risk actions","The person accountable for the management of a risk","The Project Manager always","The risk's originator"],a:1,e:"The owner is accountable for managing the risk; the risk action owner carries out response actions."},
// ---------- PROCESSES (36-55) ----------
{s:"processes",q:"The PRINCE2 process that runs from end of SU to end of CP is:",o:["Directing a Project", "Controlling a Stage", "Managing Product Delivery", "Initiating a Project"],a:0,e:"Directing a Project (DP) spans the whole project for the Project Board."},
{s:"processes",q:"The trigger for 'Starting up a Project' is:",o:["A request from the Senior User", "The PID", "A project mandate", "An approved Business Case"],a:2,e:"Receipt of the project mandate triggers SU."},
{s:"processes",q:"The main output of 'Starting up a Project' is:",o:["The Project Plan", "The Project Brief", "The PID", "The End Stage Report"],a:1,e:"SU produces the Project Brief (the PID comes later, in IP). Why not the others: The PID is the classic swap: it comes from Initiating a Project, as does the Project Plan. The End Stage Report comes from Managing a Stage Boundary."},
{s:"processes",q:"The main output of 'Initiating a Project' is:",o:["The Project Brief", "The End Stage Report", "The PID", "The Project Mandate"],a:2,e:"IP produces the PID — the master baseline. Why not the others: The Project Brief is the output of Starting up a Project. The mandate is an external input that triggers SU, not an output."},
{s:"processes",q:"'Managing a Stage Boundary' is triggered by:",o:["Only the planned end of a stage", "Only an exception plan request", "A stage end or an exception plan request", "The approaching end of the whole project"],a:2,e:"Two triggers: approaching the end of a stage, or an exception requiring an Exception Plan."},
{s:"processes",q:"Highlight Reports are produced in which process?",o:["Managing Product Delivery", "Controlling a Stage", "Managing a Stage Boundary", "Directing a Project"],a:1,e:"Highlight Reports are produced in Controlling a Stage (PM to Board). Why not the others: Managing Product Delivery produces Checkpoint Reports (Team Manager to PM), not Highlights. Managing a Stage Boundary produces the End Stage Report."},
{s:"processes",q:"Checkpoint Reports are produced in which process?",o:["Managing Product Delivery", "Controlling a Stage", "Managing a Stage Boundary", "Closing a Project"],a:0,e:"Checkpoint Reports are produced in Managing Product Delivery (Team Manager to PM). Why not the others: Controlling a Stage is where the PM produces Highlight Reports for the Board, the most common swap with Checkpoint."},
{s:"processes",type:"Negative",q:"The five 'Directing a Project' decision points include all EXCEPT:",o:["Authorise initiation", "Approve Work Packages", "Authorise the project", "Authorise project closure"],a:1,e:"Work Packages are authorised in Controlling a Stage, not by the Board."},
{s:"processes",q:"Which process focuses on the PM–Team Manager interface?",o:["Controlling a Stage","Managing Product Delivery","Managing a Stage Boundary","Initiating a Project"],a:1,e:"Managing Product Delivery formalises the PM–Team Manager link."},
{s:"processes",q:"The Lessons Report is produced in:",o:["Starting up a Project", "Closing a Project", "Initiating a Project", "Managing a Stage Boundary"],a:1,e:"The Lessons Report is produced in Closing a Project — but note that lessons are sought, recorded, applied and shared THROUGHOUT the project (learn from experience), not only at closure. Closing a Project (handed forward)."},
{s:"processes",q:"The minimum number of management stages in a PRINCE2 project is:",o:["1","2","3","4"],a:1,e:"Minimum two: initiation stage + at least one delivery stage. Why not the others: 3 is the trap: Starting up and Closing a Project are processes, not stages. The minimum is the initiation stage plus one delivery stage."},
{s:"processes",q:"The initiation stage is always a:",o:["Delivery stage","Management stage","Pre-project activity","Both delivery and management stage"],a:1,e:"The initiation stage is a management stage."},
{s:"processes",q:"Premature closure is handled in:",o:["Starting up a Project", "Initiating a Project", "Closing a Project", "Managing a Stage Boundary"],a:2,e:"Premature (early) closure is handled within Closing a Project."},
{s:"processes",q:"Which process authorises a Work Package?",o:["Controlling a Stage", "Initiating a Project", "Managing Product Delivery", "Directing a Project"],a:0,e:"The PM authorises Work Packages in Controlling a Stage."},
{s:"processes",q:"The End Stage Report is produced in:",o:["Controlling a Stage", "Managing Product Delivery", "Managing a Stage Boundary", "Directing a Project"],a:2,e:"Produced in Managing a Stage Boundary."},
{s:"processes",q:"The Benefits Management Approach is refined in:",o:["Starting up a Project","Initiating a Project","Closing a Project","Both b and c"],a:3,e:"Created/refined in IP and again updated in CP for post-project measurement."},
{s:"processes",q:"Which process includes the project board giving ongoing direction to the project manager?",o:["Directing a Project", "Controlling a Stage", "Managing a Stage Boundary", "Initiating a Project"],a:0,e:"Give ongoing direction is one of the five directing a project activities: the board gives informal advice and guidance as well as formal direction throughout the project."},
{s:"processes",q:"Which process never runs during a delivery stage?",o:["Initiating a Project", "Controlling a Stage", "Managing Product Delivery", "Managing a Stage Boundary"],a:0,e:"Initiating a Project happens in the initiation stage only, before delivery."},
{s:"processes",q:"The Communication Management Approach is produced in:",o:["Starting up a Project", "Managing a Stage Boundary", "Controlling a Stage", "Initiating a Project"],a:3,e:"Produced in Initiating a Project, part of the PID."},
{s:"processes",q:"Issues are escalated in:",o:["Managing Product Delivery","Controlling a Stage","Managing a Stage Boundary","Directing a Project"],a:1,e:"Escalation happens in Controlling a Stage (when tolerance is forecast to be exceeded)."},
// ---------- PRODUCTS (56-75) ----------
{s:"products",q:"Which of the following is a baseline?",o:["PID", "Highlight Report", "Risk Register", "Daily Log"],a:0,e:"The PID is a baseline. Registers/logs are records; Reports are reports. Why not the others: The Daily Log is a record despite its name, the Risk Register is a record, and the Highlight Report is a report.",retired:1},
{s:"products",q:"Which of the following is a record?",o:["Project Plan", "End Stage Report", "Business Case", "Quality Register"],a:3,e:"The Quality Register is a record (a working log).",retired:1},
{s:"products",q:"Which of the following is a report?",o:["Project Brief", "Communication Management Approach", "Quality Register", "Checkpoint Report"],a:3,e:"The Checkpoint Report is a report (point-in-time).",retired:1},
{s:"products",q:"The Daily Log is owned by:",o:["Executive","Project Manager","Team Manager","Project Support"],a:1,e:"The Project Manager owns the Daily Log."},
{s:"products",q:"Which document contains the project management team structure?",o:["Project Brief","PID","Both","Neither"],a:2,e:"Both the Project Brief and PID contain the team structure (Brief first, PID refined)."},
{s:"products",q:"The Risk Register is started in:",o:["Initiating a Project", "Starting up a Project", "Controlling a Stage", "Directing a Project"],a:0,e:"Started in Initiating a Project."},
{s:"products",q:"The Issue Register is started in:",o:["Starting up a Project", "Controlling a Stage", "Initiating a Project", "Managing a Stage Boundary"],a:2,e:"Started in Initiating a Project."},
{s:"products",q:"The Lessons Log is started in:",o:["Initiating a Project", "Starting up a Project", "Controlling a Stage", "Closing a Project"],a:1,e:"Started in Starting up a Project (along with the Daily Log)."},
{s:"products",q:"The Exception Report is produced by:",o:["Project Manager", "Project Board", "Team Manager", "Executive"],a:0,e:"Produced by the Project Manager (to the Board) in Controlling a Stage."},
{s:"products",q:"Which document defines acceptance criteria?",o:["Project Brief", "Quality Register", "Project Product Description", "Quality Management Approach"],a:2,e:"Acceptance criteria live in the Project Product Description."},
{s:"products",q:"The Product Status Account is produced by:",o:["Project Manager", "Team Manager", "Project Board", "Project Support"],a:3,e:"Produced by Project Support (to the PM).",retired:1},
{s:"products",q:"A Work Package contains:",o:["Authorization, instructions, constraints, reporting", "Only the product descriptions for the work", "Only the quality specifications for the work", "The full stage plan for the current management stage"],a:0,e:"It bundles authorisation, instructions, constraints and reporting requirements."},
{s:"products",q:"Which register lists the products required by a plan and their status?",o:["Issue register", "Quality register", "Product register", "Risk register"],a:2,e:"The product register lists all products required by a plan and their status. The quality register records quality activities and results."},
{s:"products",q:"The Benefits Management Approach is owned by:",o:["Executive", "Project Manager", "Senior User", "Project Board"],a:0,e:"Owned by the Executive."},
{s:"products",q:"The Project Product Description is created in:",o:["Initiating a Project", "Managing a Stage Boundary", "Starting up a Project", "Closing a Project"],a:2,e:"Created in Starting up a Project (part of the Project Brief)."},
{s:"products",q:"Which document is updated at every stage boundary?",o:["Project Brief", "Project Mandate", "Project Plan", "Stage Plan only"],a:2,e:"The Project Plan is updated at each stage boundary (in SB)."},
{s:"products",q:"Highlight Reports go from:",o:["Team Manager to Project Manager", "Project Board to business layer", "Project Manager to Project Board", "Project Manager to Senior User"],a:2,e:"PM to Project Board."},
{s:"products",q:"Checkpoint Reports go from:",o:["Project Manager to Project Board", "Project Board to business layer", "Senior User to Project Manager", "Team Manager to Project Manager"],a:3,e:"Team Manager to Project Manager."},
{s:"products",q:"End Stage Reports cover:",o:["Only the current stage", "The whole project to date", "Only outstanding risks", "Only completed Work Packages"],a:0,e:"They report on the stage just completed."},
{s:"products",q:"The Project Mandate is:",o:["A management product created in initiation", "A product created in starting up a project", "An input from the business layer", "Another name for the project brief"],a:2,e:"The project mandate is the trigger for the project, provided by the business layer (the commissioning authority). It is an input, not a product the project creates."},
// ---------- ROLES (76-90) ----------
{s:"roles",q:"Which role is ultimately accountable for the project's success?",o:["Executive", "Project Manager", "Senior User", "Team Manager"],a:0,e:"The Executive is ultimately accountable (the Board is collectively responsible). Why not the others: The Board is collectively responsible, but only the Executive is ultimately accountable. The PM manages day-to-day; the Team Manager delivers."},
{s:"roles",q:"Which role CANNOT be combined with Project Manager?",o:["Team Manager", "Project Assurance", "Project Support", "Change Authority"],a:1,e:"Project Assurance must stay independent of management — cannot be the PM. Why not the others: Project Support can be combined with the PM on small projects, the PM can double as Team Manager, and the Change Authority can be the PM."},
{s:"roles",q:"Which role represents users of the project's products?",o:["Executive", "Senior Supplier", "Senior User", "Team Manager"],a:2,e:"The Senior User represents the user interest."},
{s:"roles",q:"Which role represents those who design and deliver the project's products?",o:["Executive", "Senior User", "Project Manager", "Senior Supplier"],a:3,e:"The Senior Supplier represents the supplier interest."},
{s:"roles",q:"Project Assurance is independent of:",o:["The Senior User", "The Project Manager", "The Project Board", "The Senior Supplier"],a:1,e:"Independent of the Project Manager (it assures on the Board's behalf)."},
{s:"roles",q:"Which role chairs the Project Board?",o:["Executive", "Senior User", "Senior Supplier", "Project Manager"],a:0,e:"The Executive chairs the Board."},
{s:"roles",q:"Realising benefits after project closure is the responsibility of:",o:["Project Manager", "Executive", "Senior Supplier", "Senior User"],a:3,e:"The Senior User is accountable for realising benefits post-project. Why not the others: The Executive owns the Business Case and the Benefits Management Approach, but realising benefits after closure is the Senior User's accountability."},
{s:"roles",q:"The Change Authority is appointed by:",o:["Project Manager", "Project Board", "Senior User", "The business layer"],a:1,e:"The Project Board appoints the Change Authority and delegates limits to it."},
{s:"roles",q:"The Project Manager reports to:",o:["The business layer directly", "The Senior User", "The Project Board", "The Team Manager"],a:2,e:"The PM reports to the Project Board."},
{s:"roles",q:"The Project Support role:",o:["Performs project assurance for the board", "Acts as the project manager’s formal deputy", "Reports to the senior user on user needs", "Provides administrative and planning support"],a:3,e:"Project support provides services such as administrative support, advice and guidance on project tools, planning support, risk management and change management. It never performs assurance."},
{s:"roles",q:"Team Managers report to:",o:["The Project Board", "Project Assurance", "Project Support", "The Project Manager"],a:3,e:"Team Managers report to the Project Manager."},
{s:"roles",q:"The three Project Board roles represent:",o:["Business, user, supplier","Strategy, operations, delivery","Customer, vendor, partner","Past, present, future"],a:0,e:"Business (Executive), user (Senior User), supplier (Senior Supplier)."},
{s:"roles",q:"The Executive can be combined with:",o:["The project manager, on small projects", "Any role, if the board agrees", "The senior user, but not the PM", "No other role on the project"],a:2,e:"Never the PM. Some Board dual-roles possible in very small projects."},
{s:"roles",q:"In a small project with no Team Manager:",o:["Team members report directly to the Project Manager", "The project cannot proceed", "The Senior User acts as Team Manager", "Project Support takes the Team Manager role"],a:0,e:"Team Manager is optional; members can report directly to the PM."},
{s:"roles",q:"Project Assurance roles typically mirror:",o:["The project manager’s own responsibilities", "The structure of the delivery teams", "The three board interests", "The business layer’s governance roles"],a:2,e:"Three assurance roles mirror business/user/supplier interests."},
// ---------- TAILORING & GENERAL (91-100) ----------
{s:"tailoring",q:"Tailoring decisions are recorded in:",o:["The Project Mandate", "The Project Brief only", "The Daily Log", "The PID"],a:3,e:"Recorded in the PID (project approach / management approaches)."},
{s:"tailoring",q:"Which of the following CANNOT be tailored?",o:["Processes", "Management products", "Roles", "Principles"],a:3,e:"Principles cannot be tailored away."},
{s:"tailoring",q:"'Embedding' PRINCE2 refers to:",o:["An organization adopting PRINCE2 as standard", "Applying PRINCE2 to one specific project only", "Recording PRINCE2 decisions in the PID", "Documenting each tailoring decision made"],a:0,e:"Embedding = organisation-wide adoption. Tailoring = adapting to one project. Why not the others: Applying PRINCE2 to a specific project and documenting tailoring decisions both describe tailoring, which adapts PRINCE2 to one project and is recorded in the PID. Embedding is organisation-wide.",retired:1},
{s:"tailoring",q:"PRINCE2 stands for:",o:["Project Initiation, Networking, Control and Execution", "Projects IN Controlled Environments", "Programme Resource and Investment Controlled Environments", "Practical Initiative for Networked Controlled Environments"],a:1,e:"PRojects IN Controlled Environments."},
{s:"tailoring",q:"Which is true of a PRINCE2 project?",o:["Stages are optional on small, simple projects", "Initiation is not a management stage", "It has an initiation and a delivery stage", "Closure is not a separate process"],a:2,e:"Minimum: one initiation stage + at least one delivery stage."},
{s:"tailoring",q:"The number of processes in PRINCE2 is:",o:["5","6","7","8"],a:2,e:"Seven processes."},
{s:"tailoring",q:"The number of practices (themes) in PRINCE2 is:",o:["5","6","7","8"],a:2,e:"Seven practices."},
{s:"tailoring",q:"The number of stakeholder interests on the Project Board is:",o:["2","3","4","5"],a:1,e:"Three: business, user, supplier."},
{s:"tailoring",q:"Which type of control is a Highlight Report?",o:["Event-driven only","Time-driven","Exception-driven","Neither time- nor event-driven"],a:1,e:"Highlight Reports are time-driven (periodic)."},
{s:"tailoring",q:"Which type of control is an Exception Report?",o:["Time-driven", "Cyclical", "Event-driven", "Mandatory"],a:2,e:"Exception Reports are event-driven (triggered by forecast breach of tolerance)."}
];

// PRINCE2 Foundation — expansion bank (questions 101-200)
const QUESTIONS_EXT = [
// ---------- PRINCIPLES (15) ----------
{s:"principles",q:"How many principles, practices and processes does PRINCE2 7 have, respectively?",o:["5, 7, 7","7, 7, 7","7, 9, 7","3, 3, 3"],a:1,e:"Seven of each: 7 principles, 7 practices, 7 processes. (Note: the five INTEGRATED ELEMENTS are different — principles, people, practices, processes, project context.)"},
{s:"principles",q:"A project that cannot demonstrate continued justification should:",o:["Continue to the next stage boundary", "Reduce its scope automatically", "Be stopped", "Escalate to the business layer for funding"],a:2,e:"Loss of justification is grounds to stop the project."},
{s:"principles",q:"The principle 'learn from experience' begins:",o:["At project start, with prior lessons", "At the first stage boundary review", "When the first problem occurs", "Only at project closure, in a report"],a:0,e:"Lessons from previous projects are reviewed at the very start (in SU)."},
{s:"principles",q:"Which statement about PRINCE2 principles is TRUE?",o:["They are optional guidance for projects", "They can be applied selectively", "They apply only to large or complex projects", "They apply to every PRINCE2 project"],a:3,e:"All seven principles must be applied to every PRINCE2 project; if one is missing, it is not a PRINCE2 project."},
{s:"principles",q:"'Manage by stages' supports which other principle most directly?",o:["Define roles, responsibilities and relationships", "Learn from experience", "Continued business justification", "Tailor to suit the project"],a:2,e:"Stage boundaries are the natural review points for re-confirming justification."},
{s:"principles",q:"Delegated authority in PRINCE2 is expressed through:",o:["Job titles", "The Business Case", "Stage Plans", "Tolerances"],a:3,e:"Tolerances define the limits of delegated authority (manage by exception)."},
{s:"principles",q:"Which principle would be violated if a team planned purely around tasks with no defined deliverables?",o:["Manage by stages","Focus on products","Learn from experience","Manage by exception"],a:1,e:"Focus on products requires planning around products, not activities."},
{s:"principles",q:"The seven principles are best described as:",o:["Obligations applied throughout", "A checklist completed once at the start", "Documents stored within the PID", "Roles represented on the project board"],a:0,e:"They are guiding obligations applied continuously, not a one-off checklist."},
{s:"principles",q:"If a project applies all processes but ignores one principle, it is:",o:["Not a PRINCE2 project", "Still a PRINCE2 project", "A tailored PRINCE2 project", "A PRINCE2 Agile project"],a:0,e:"Omitting any principle means it is not PRINCE2."},
{s:"principles",q:"Tailoring primarily seeks to avoid:",o:["Using documentation of any kind", "Mechanistic use of the method", "Holding any stage boundaries", "Involving the project board at all"],a:1,e:"Tailoring avoids blind, mechanistic application; it fits the method to the project."},
{s:"principles",q:"Which principle ensures the right people are involved in decisions?",o:["Focus on products", "Manage by stages", "Define roles, responsibilities and relationships", "Learn from experience and lessons logs"],a:2,e:"Defined roles, responsibilities and relationships ensures the right people decide."},
{s:"principles",q:"Reviewing the Business Case throughout the project is an expression of:",o:["Continued business justification", "Manage by exception", "Focus on products", "Tailor to suit the project"],a:0,e:"Ongoing Business Case review is continued business justification in action."},
{s:"principles",type:"Negative",q:"Which is NOT a factor PRINCE2 7 is tailored to suit?",o:["Environment", "Delivery method", "Team capability", "The project manager’s seniority"],a:3,e:"PRINCE2 is tailored to suit the project environment, size, complexity, importance, delivery method, team capability and level of risk. The project manager’s seniority is not one of them."},
{s:"principles",q:"The principle requiring a minimum of two management stages exists to ensure:",o:["More documentation for the business layer", "Faster delivery of the project products", "Fewer project board meetings overall", "Decision points to review viability"],a:3,e:"Stages create defined control points for Board review."},
{s:"principles",q:"Capturing a lesson during a stage and applying it in the next stage demonstrates:",o:["Focus on products", "Manage by exception", "Learn from experience", "Defined roles"],a:2,e:"Acting on captured lessons within the project is learn from experience."},
// ---------- PRACTICES (20) ----------
{s:"practices",q:"The three executive-level questions the Business Case answers are whether the project is:",o:["Affordable, fast, low-risk", "Desirable, viable, achievable", "Approved, funded, staffed", "Started, controlled, closed"],a:1,e:"Desirable, viable and achievable."},
{s:"practices",q:"An 'output' in the benefits chain is:",o:["A specialist product the project delivers", "A measurable improvement", "A change resulting from using a deliverable", "A negative consequence"],a:0,e:"Output = what the project delivers; outcome = the change; benefit = the measurable improvement. Why not the others: A measurable improvement is a benefit, a change from using a deliverable is an outcome, and a negative consequence is a dis-benefit."},
{s:"practices",q:"A 'benefit' in PRINCE2 is:",o:["A measurable improvement seen as an advantage", "Any deliverable handed over by the project", "An approved change to the project baseline", "A completed work package accepted by the PM"],a:0,e:"A measurable improvement from an outcome, seen as an advantage by stakeholders."},
{s:"practices",q:"Which document records how and when benefits will be measured?",o:["Business Case", "Benefits Management Approach", "Quality Management Approach", "Sustainability Management Approach"],a:1,e:"The Benefits Management Approach defines benefit measurement, including post-project."},
{s:"practices",q:"The four organisational levels in order (highest to lowest) are:",o:["Business layer, directing, managing, delivering", "Directing, managing, delivering, business layer", "Managing, directing, delivering, business layer", "Business layer, delivering, managing, directing"],a:0,e:"Business layer → directing → managing → delivering. The business layer commissions the project and sits outside the project team."},
{s:"practices",q:"Project Support is best described as:",o:["Independent oversight on behalf of the board", "A decision-making role on the project board", "The team manager’s deputy for daily work", "Administrative and planning support for the PM"],a:3,e:"Project support provides administrative, planning, tools, risk and change management support to the project manager. Independent oversight is project assurance."},
{s:"practices",q:"A Team Plan is:",o:["Mandatory for every project and stage", "Optional, produced by a team manager", "Approved by the business layer", "Always included in the PID"],a:1,e:"Team Plans are optional and produced by Team Managers."},
{s:"practices",q:"The first step of product-based planning is to:",o:["Write the project product description", "Identify the activities needed", "Estimate the costs of each product", "Build the schedule for the stage"],a:0,e:"Designing the plan and defining products comes before identifying activities."},
{s:"practices",q:"Quality control is concerned with:",o:["Defining what fit for purpose means", "Checking products against specifications", "Independent checks by the business", "Approving the business case each stage"],a:1,e:"Quality control checks products against their quality specifications and records the results in the quality register."},
{s:"practices",q:"The user’s quality expectations are first captured in the:",o:["Project product description", "Quality register", "Quality management approach", "End stage report"],a:0,e:"The user’s quality expectations and acceptance criteria are captured in the project product description, during starting up a project."},
{s:"practices",q:"The Quality Register records:",o:["All planned and completed quality activities", "Risks and issues raised during the stage", "The business case and its updates", "Stakeholder contacts and their interests"],a:0,e:"It logs quality activities (reviews, tests) and their outcomes."},
{s:"practices",q:"A 'risk action owner' is the person who:",o:["Is accountable for managing the risk", "Owns the Risk Budget", "Chairs the Board", "Carries out an assigned risk response action"],a:3,e:"The risk action owner carries out specific response actions; the risk owner is accountable for the risk. The official manual notes the risk action owner is also known as the risk actionee."},
{s:"practices",q:"'Transfer' as a risk response is used for:",o:["Passing part of the risk to a third party", "Opportunities only, never threats", "Removing a threat by changing the plan", "Taking the chance that the risk occurs"],a:0,e:"Transfer passes part of the risk to a third party. In the courseware it applies to both threats and opportunities, so 'opportunities only' is wrong."},
{s:"practices",q:"'Exploit' as a risk response means:",o:["Reducing the probability of a threat", "Making an opportunity certain to happen", "Sharing the pain and gain with a supplier", "Ignoring the risk until it happens"],a:1,e:"Exploit ensures an opportunity is realised."},
{s:"practices",q:"'Share' as a risk response applies to:",o:["Threats only, never opportunities", "Opportunities only, never threats", "Threats and opportunities", "Neither: share is not a response"],a:2,e:"Share (pain/gain via agreed split) applies to both threats and opportunities."},
{s:"practices",q:"A request for change is best handled through:",o:["The daily log, handled informally", "Immediate implementation by the PM", "The end project report at closure", "Issue and change control"],a:3,e:"Requests for change follow the change control procedure."},
{s:"practices",q:"Where are minor issues handled informally?",o:["Issue Register", "Risk Register", "Daily Log", "Quality Register"],a:2,e:"Informally-managed issues are recorded in the Daily Log."},
{s:"practices",q:"The Progress practice provides forecasts of:",o:["The team’s morale and engagement", "The reach of marketing campaigns", "The supplier’s expected profit", "Objectives and continued viability"],a:3,e:"Progress forecasts viability and whether objectives will be met."},
{s:"practices",q:"A 'time-driven' control is:",o:["Done at set intervals, e.g. highlights", "Triggered by an event such as an exception", "Used only when an exception occurs", "An optional control for small projects"],a:0,e:"Time-driven controls occur on a regular cadence."},
{s:"practices",q:"Tolerances are set for the Project Manager by:",o:["The Team Manager", "The business layer directly", "Project Support", "The Project Board"],a:3,e:"The Board sets stage tolerances for the PM; the PM sets WP tolerances for Team Managers."},
// ---------- PROCESSES (20) ----------
{s:"processes",q:"Which two roles are appointed during Starting up a Project?",o:["Senior User and Senior Supplier", "Team Manager and Project Support", "Executive and Project Manager", "Change Authority and Executive"],a:2,e:"SU appoints the Executive and the Project Manager."},
{s:"processes",type:"Negative",q:"Which document is NOT produced in Starting up a Project?",o:["Project Brief","Initiation Stage Plan","PID","Daily Log"],a:2,e:"The PID is produced in Initiating a Project, not SU."},
{s:"processes",q:"The purpose of Initiating a Project is to:",o:["Establish solid foundations before spending", "Decide whether there is a viable project", "Deliver the specialist products of a stage", "Close the project in an orderly way"],a:0,e:"IP establishes solid foundations before committing major spend."},
{s:"processes",q:"What is the correct PRINCE2 7 sequence of Managing Product Delivery activities?",o:["Accept, execute, deliver, notify", "Plan, build, test, hand over", "Authorize, review, approve, close", "Accept, execute, evaluate, notify"],a:3,e:"PRINCE2 7: Accept a Work Package → Execute → Evaluate → Notify Work Package Completion. 'Deliver' is the old 6th-edition term — now 'evaluate'."},
{s:"processes",q:"Which process produces the End Project Report?",o:["Managing a Stage Boundary", "Controlling a Stage", "Directing a Project", "Closing a Project"],a:3,e:"The End Project Report is produced in Closing a Project."},
{s:"processes",q:"The Project Board authorises the project at the end of:",o:["Initiating a Project", "Starting up a Project", "The first delivery stage", "Closing a Project"],a:0,e:"After IP, the Board authorises the project (decision point 2)."},
{s:"processes",q:"Corrective action within tolerance is taken in:",o:["Controlling a Stage", "Directing a Project", "Managing a Stage Boundary", "Closing a Project"],a:0,e:"The PM takes corrective action within tolerance in Controlling a Stage."},
{s:"processes",q:"Which process is triggered by an Exception Plan request?",o:["Starting up a Project","Managing a Stage Boundary","Closing a Project","Managing Product Delivery"],a:1,e:"SB produces the Exception Plan when the Board requests one."},
{s:"processes",q:"During which process does the Project Board give ongoing direction, including informal advice to the project manager?",o:["Initiating a Project", "Directing a Project", "Controlling a Stage", "Closing a Project"],a:1,e:"Give ongoing direction is a directing a project activity. It covers formal direction and informal advice, for example responding to requests for advice or to exceptions."},
{s:"processes",q:"Which process confirms acceptance of the project product and hands over the products?",o:["Managing a Stage Boundary", "Controlling a Stage", "Initiating a Project", "Closing a Project"],a:3,e:"Closing a project confirms user acceptance, checks the business can support the products after closure, and hands them over. Why not the others: managing a stage boundary prepares the next stage, controlling a stage manages day-to-day work, and initiating a project builds the PID."},
{s:"processes",q:"The initiation stage is planned during:",o:["Starting up a Project","Initiating a Project","Directing a Project","Managing a Stage Boundary"],a:0,e:"SU produces the Initiation Stage Plan."},
{s:"processes",q:"Which process is performed by the Project Board, not the Project Manager?",o:["Controlling a Stage", "Directing a Project", "Managing Product Delivery", "Initiating a Project"],a:1,e:"Directing a Project is the Board's process."},
{s:"processes",q:"A Work Package is accepted by the Team Manager in:",o:["Controlling a Stage","Managing Product Delivery","Managing a Stage Boundary","Initiating a Project"],a:1,e:"'Accept a Work Package' is the first MP activity."},
{s:"processes",q:"Which process confirms the prerequisites for initiation are in place?",o:["Starting up a Project", "Initiating a Project", "Directing a Project", "Controlling a Stage"],a:0,e:"SU confirms prerequisites: 'do we have a viable, worthwhile project?'"},
{s:"processes",q:"The Project Plan is first created in:",o:["Starting up a Project", "Managing a Stage Boundary", "Controlling a Stage", "Initiating a Project"],a:3,e:"The Project Plan is created in IP as part of the PID."},
{s:"processes",q:"Which process is concerned with reviewing the current stage and planning the next?",o:["Controlling a Stage", "Managing Product Delivery", "Closing a Project", "Managing a Stage Boundary"],a:3,e:"SB reviews the current stage and plans the next."},
{s:"processes",q:"Premature closure differs from planned closure in that:",o:["It uses a different PRINCE2 process", "It ends before all products are delivered", "It does not need an end project report", "The project board is not involved in it"],a:1,e:"Premature closure (still within CP) ends the project early."},
{s:"processes",q:"In which process are the management approaches (Risk, Quality, Communication, Issue, etc.) created?",o:["Starting up a Project","Initiating a Project","Directing a Project","Controlling a Stage"],a:1,e:"The Risk, Quality, Communication and Issue Management Approaches are created in IP (among others)."},
{s:"processes",q:"The trigger that begins the whole PRINCE2 method is the:",o:["Project mandate", "Project Brief", "PID", "Stage Plan"],a:0,e:"The project mandate, from the business layer, triggers starting up a project."},
{s:"processes",q:"Which process produces Checkpoint Reports?",o:["Controlling a Stage", "Managing Product Delivery", "Managing a Stage Boundary", "Closing a Project"],a:1,e:"Checkpoint Reports are produced in MP by the Team Manager."},
// ---------- PRODUCTS (20) ----------
{s:"products",q:"Which of these is part of the project baseline, so that a change to it must go through change control?",o:["Daily log", "Business case", "Highlight report", "Issue register"],a:1,e:"The project baseline is the current approved versions of the management products and project products that are subject to change control, such as the business case and plans. The daily log and issue register are parts of the live project log, and a highlight report is a periodic progress report."},
{s:"products",q:"The PID is best described as:",o:["The baseline defining the project", "A working log updated each day", "A point-in-time progress report", "An external input from the business"],a:0,e:"The PID gives the direction and scope of the project and is used to authorize it; with the stage plan it forms the “contract” between the PM and the board. Why not the others: the daily log is a working log, a highlight report is a point-in-time report, and the mandate is the external trigger."},
{s:"products",q:"Which record tracks the status and version of products?",o:["Product register", "Daily log", "Lessons log", "Quality register"],a:0,e:"The product register lists the products required by a plan and their status. The quality register records quality activities.",retired:1},
{s:"products",q:"A Product Status Account is a type of:",o:["Baseline", "Report", "Record", "Approach"],a:1,e:"It is a report on the status of products, produced by Project Support.",retired:1},
{s:"products",q:"Which is true of the Daily Log?",o:["It is a baseline under change control", "It is a record, despite its name", "It is a report sent to the board", "It is owned by the executive"],a:1,e:"The Daily Log is a record (the naming is the classic trap).",retired:1},
{s:"products",q:"The Project Brief is created in SU and:",o:["Replaces the PID once approved", "Is owned by the senior user", "Is the basis for the PID in IP", "Is a report sent to the business"],a:2,e:"The Project Brief is refined and expanded into the PID during IP."},
{s:"products",q:"Which approach defines how the project will engage stakeholders with information?",o:["Quality Management Approach", "Issue Management Approach", "Risk Management Approach", "Communication Management Approach"],a:3,e:"The Communication Management Approach covers who needs what information, when and how."},
{s:"products",q:"The Issue Report is produced for:",o:["Every minor issue on the project", "Risks only, not issues", "Issues managed formally", "Lessons captured during a stage"],a:2,e:"An Issue Report is created for formally-managed issues."},
{s:"products",q:"Which product is updated and handed to the business for post-project benefit measurement?",o:["Benefits management approach", "End project report", "Lessons report", "Sustainability management approach"],a:0,e:"The Benefits Management Approach is handed forward for post-project measurement."},
{s:"products",q:"A Stage Plan is produced:",o:["At project start, for every stage", "Near the end of the previous stage", "Only when an exception occurs", "By the team manager for each package"],a:1,e:"Each Stage Plan is produced near the end of the preceding stage (in SB)."},
{s:"products",q:"The Exception Report recommends:",o:["Closing the project at the next stage end", "A new team plan for the work package", "Options for a forecast tolerance breach", "New quality specifications for products"],a:2,e:"It alerts the Board to a forecast breach and recommends options."},
{s:"products",q:"Which product describes the project's overall output and its acceptance criteria?",o:["Project product description", "Product description", "Work package description", "Product breakdown structure"],a:0,e:"The Project Product Description covers the whole project output and acceptance criteria."},
{s:"products",q:"Configuration control in PRINCE2 7 helps to:",o:["Staff the project with the right people", "Plan the marketing of the outputs", "Track product versions and changes", "Set the risk budget for each stage"],a:2,e:"Configuration control keeps a record of changes to baselined products and an archive of superseded versions, so the actual status of products can be verified.",retired:1},
{s:"products",q:"The Lessons Report is a type of:",o:["Baseline", "Record", "Approach", "Report"],a:3,e:"It is a report, produced in Closing a Project.",retired:1},
{s:"products",q:"Which is created continuously rather than at a single point?",o:["End Stage Report", "PID", "Project Brief", "Risk Register"],a:3,e:"The risk register is part of the project log, the live record of the project, so it is updated throughout. The end stage report and project brief are each produced at a specific point, and the PID is compiled during initiation (then kept up to date)."},
{s:"products",q:"Which role provides administrative support, advice on tools, planning support, and risk and change management services?",o:["Executive","Project Support","Senior User","Team members"],a:1,e:"Project support provides administrative support, advice and guidance on project tools, planning support, risk management and change management. It can never perform project assurance."},
{s:"products",q:"A baseline product is one that is:",o:["Informal and frequently changed", "Never updated", "Approved and subject to change control", "Owned by the Team Manager"],a:2,e:"Baselines are approved and change-controlled.",retired:1},
{s:"products",q:"The Issue Management Approach defines:",o:["How benefits will be measured", "The schedule for each stage", "How issues and changes are controlled", "The quality specifications of products"],a:2,e:"It governs how issues/changes are handled."},
{s:"products",q:"Which two logs are started in Starting up a Project?",o:["Daily Log and Lessons Log", "Risk Register and Issue Register", "Quality Register and Risk Register", "Issue Register and Quality Register"],a:0,e:"Daily Log and Lessons Log start in SU; the registers start in IP."},
{s:"products",q:"The Highlight Report's audience is the:",o:["Team Manager", "Customer's customers", "Project Board", "Suppliers"],a:2,e:"Highlight Reports go from the PM to the Project Board."},
// ---------- ROLES (15) ----------
{s:"roles",q:"The Executive's appointment continuity rule is that they:",o:["Rotate at every stage boundary", "Are appointed by the project manager", "Remain throughout the project", "Are optional on small projects"],a:2,e:"For continuity, the Executive should stay throughout the project."},
{s:"roles",q:"Who is responsible for the day-to-day management of the project?",o:["Executive","Project Manager","Senior Supplier","Project Assurance"],a:1,e:"The Project Manager runs the project day-to-day."},

{s:"roles",q:"The Senior Supplier is accountable for:",o:["The quality of products from suppliers", "Realizing the benefits after closure", "Chairing the project board meetings", "Writing and owning the business case"],a:0,e:"The Senior Supplier is accountable for supplier-side product quality."},
{s:"roles",type:"Negative",q:"Which combination is explicitly NOT allowed?",o:["PM and Team Manager", "Executive and Project Manager", "PM and Project Support", "Executive and Senior User (small projects)"],a:1,e:"Executive and Project Manager can never be the same person. Why not the others: PM plus Team Manager and PM plus Project Support are both allowed on small projects."},
{s:"roles",q:"On a small project, the Project Manager MAY also perform:",o:["Project Assurance", "The Executive role", "Senior User", "Project Support"],a:3,e:"The PM may take on Project Support on small projects (not Assurance or Executive)."},
{s:"roles",q:"The user interest on the Board is represented by the:",o:["Senior User", "Executive", "Senior Supplier", "Change Authority"],a:0,e:"The Senior User represents the user interest."},
{s:"roles",q:"Who specifies the needs of those who will use the project's products?",o:["Senior Supplier", "Project Support", "Senior User", "Team Manager"],a:2,e:"The Senior User specifies user needs and validates acceptance."},
{s:"roles",q:"The Project Board is responsible for:",o:["Doing the specialist delivery work", "Unified direction and key decisions", "Writing the work package descriptions", "Logging issues in the daily log"],a:1,e:"The Board directs and decides; it does not do delivery work."},
{s:"roles",q:"Which role is optional and may be absent on small projects?",o:["Executive","Project Manager","Team Manager","Senior User"],a:2,e:"Team Manager is optional; members may report directly to the PM."},
{s:"roles",q:"Three project interests must be represented to avoid:",o:["Excessive cost on the project", "One interest dominating decisions", "Long and unproductive meetings", "Too much documentation"],a:1,e:"Balancing business, user and supplier prevents any single interest dominating."},
{s:"roles",q:"The person accountable for the Business Case and project success is the:",o:["Project Manager", "Senior User", "Senior Supplier", "Executive"],a:3,e:"The Executive owns the Business Case and is ultimately accountable."},
{s:"roles",q:"Project Support provides services such as:",o:["Independent assurance on the board’s behalf", "Decisions on behalf of the board", "Administration, tools and planning support", "Realizing benefits after closure"],a:2,e:"Project support provides administrative support, advice on project tools, planning support, risk management and change management. It never performs assurance, which is independent of the project manager."},
{s:"roles",q:"If Project Assurance and the Project Manager were the same person, this would breach:",o:["Continued business justification", "Focus on products", "Manage by stages", "Independence of assurance"],a:3,e:"Assurance must be independent of the PM it oversees."},

const LS = 'p2f_state_v1';
const STATE_VERSION = 2;
let state = load();
function defaults(){
  return { version:STATE_VERSION, read:{}, cards:{}, examBest:null, examHistory:[],
           drillStats:{}, checklist:{}, recentSeen:[], missQ:{}, lastView:'dashboard' };
}
function migrate(raw){
  if(!raw || typeof raw!=='object') return defaults();
  // v1 (no version, or older card shape) → v2
  if(!raw.version || raw.version<2){
    // old flashcard shape was {due,grade,ts}; reset to SM-2 baseline so intervals recompute cleanly
    if(raw.cards){
      Object.keys(raw.cards).forEach(k=>{
        const m=raw.cards[k];
        if(m && m.ease===undefined){
          raw.cards[k]={ease:2.5, interval:1, reps:1, lapses:0, due:m.due||Date.now(), last:m.ts||Date.now()};
        }
      });
    }
    raw.recentSeen = raw.recentSeen||[];
    raw.version = 2;
  }
  return raw;
}
function load(){
  let parsed;
  try{ parsed = JSON.parse(localStorage.getItem(LS)||'{}'); }
  catch(e){ return defaults(); }
  const merged = Object.assign(defaults(), migrate(parsed));
  // guard: ensure nested containers exist even if stored state was partial
  ['read','cards','drillStats','checklist','missQ'].forEach(k=>{ if(!merged[k]||typeof merged[k]!=='object')merged[k]={}; });
  if(!Array.isArray(merged.examHistory))merged.examHistory=[];
  if(!Array.isArray(merged.recentSeen))merged.recentSeen=[];
  return merged;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
