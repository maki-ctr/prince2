{s:"processes",q:"The board instructs the project manager to close the project early because a merger has removed the need for it. What should happen?",o:["Managing a stage boundary is used instead, to produce an end stage report", "Closing a project is still used, so the project is closed in an orderly way", "The project stops immediately and no closing activities are needed at all", "The business layer takes over and closes the project without the project board"],a:1,e:"Closing a project is also used for premature closure. Its objectives include closing in an orderly way rather than simply abandoning the project, handing over anything usable and recording follow-on actions for open issues and risks.",ref:"Closing a Project",of:1},
{s:"processes",type:"List",q:"Which TWO are objectives of the closing a project process?\n1. To ensure the business can support the products after the project closes\n2. To prepare the stage plan for the final management stage\n3. To authorize the work packages for the final delivery stage\n4. To update the benefits management approach with any post-project benefit reviews",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:3,e:"Closing a project checks user acceptance, ensures the business can support the products, reviews performance against baselines, assesses benefits realized and updates the benefits management approach to include post-project reviews, and ensures open issues and risks have follow-on actions. Stage plans and work packages belong to other processes.",ref:"Purpose and objectives",of:1},
{s:"processes",q:"When should the activities for closing a project normally be planned?",o:["As part of the stage plan for the final stage", "In the benefits management approach, after closure", "In the project brief, during starting up a project", "In the end stage report for the first delivery stage"],a:0,e:"Closure activities should be planned as part of the stage plan for the final stage. A project with a clear end transfers ownership to the agreed owners and identifies any unachieved goals for the future.",ref:"Closing a Project",of:1},
{s:"processes",q:"Which statement describes the purpose of the directing a project process?",o:["To let the business layer approve each work package before the team manager accepts it", "To let the board manage each stage day to day while the project manager reports to the business layer", "To let the board be accountable through key decisions while delegating day-to-day management", "To let the project manager decide when the project should move from one stage to the next"],a:2,e:"Directing a project enables the board to be accountable for the project's success by making key decisions and exercising overall control, while delegating day-to-day management to the project manager.",ref:"Purpose and objectives",of:1},
{s:"practices",q:"The project board asks how it will know, throughout the project, whether continued investment is still worthwhile. Which practice provides this?",o:["Progress, which compares actual achievement with the plan and forecasts the outcome", "Risk, which identifies and controls the uncertainty that could affect the objectives", "Business case, which judges whether the project remains desirable, viable and achievable", "Plans, which define the products and how, when and at what cost they are delivered"],a:2,e:"The purpose of the business case practice is to establish mechanisms to judge whether the project is, and remains, desirable, viable and achievable, to support decisions about continued investment. Progress provides forecasts, but the judgement of worthwhile investment is the business case.",ref:"The value chain",of:1},
{s:"practices",q:"A bank delivers new mortgage application software. As a result, applications are processed in two days instead of ten, and the cost of each application falls by 30%. What is the 30% fall in cost?",o:["A business objective", "An outcome", "An output", "A benefit"],a:3,e:"The software is the output; faster processing is the outcome (the result of the change); the measurable improvement that justifies the investment, a 30% cost reduction, is the benefit. A business objective is a measurable outcome showing progress against the organization's strategy, to which the project contributes.",ref:"The value chain",of:1},
{s:"practices",q:"A council's new online parking permit service goes live. Residents now apply online instead of visiting the council office. How is the change in how residents apply best described?",o:["An outcome", "An output", "A dis-benefit", "A benefit"],a:0,e:"The online service is the output (the product). Residents changing how they apply is the outcome: the result of the change brought about by using the output. A benefit would be a measurable improvement, such as lower processing costs.",ref:"The value chain",of:1},
{s:"practices",q:"A company moves its two offices into one new site. It expects better joint working, but knows some staff will have a longer commute with poor public transport. How should the longer commute be treated in the business case?",o:["As an issue, an event that has happened and needs a change to the baseline", "As a dis-benefit: an expected negative outcome, valued in the investment appraisal", "As a threat, an uncertain event recorded in the risk register with a response", "As a constraint, a limit recorded in the project definition section of the PID"],a:1,e:"Dis-benefits are expected consequences perceived as negative by stakeholders, while a risk is uncertain and may never happen. Dis-benefits must be valued and included in the investment appraisal.",ref:"The value chain",of:1},
{s:"practices",q:"During starting up a project, the costs, timescales and risks are not yet well understood. What business case should be produced at this point?",o:["No business case, because the justification is first considered during initiation", "An outline business case, to be developed into a full business case during initiation", "A full business case, which must be complete before initiation can be authorized", "A benefits management approach, which replaces the business case until delivery"],a:1,e:"The business case is developed as an outline at the start, from the project mandate, with enough information for the board to authorize initiation. As planning becomes more detailed it is developed into the full business case.",ref:"The business case management technique",of:1},
{s:"practices",q:"During initiation, the project manager explores the business options and gathers the information needed for the investment appraisal. Which step of the business case management technique is this?",o:["Maintain", "Confirm", "Develop", "Check"],a:2,e:"Develop means exploring options and getting the right information on which investment appraisal decisions can be made. Check assesses whether the project is still worthwhile, maintain keeps the business case updated, and confirm assesses whether benefits have been realized.",ref:"The business case management technique",of:1},
{s:"practices",q:"Halfway through a stage, a key supplier raises its prices. The project manager assesses whether this affects the justification for the project. Which step of the business case management technique is this?",o:["Maintain", "Check", "Confirm", "Develop"],a:1,e:"Check means assessing whether the project is still worthwhile. The project manager checks the business case when assessing progress, risks and issues to see their effect on the business justification.",ref:"The business case management technique",of:1},
{s:"practices",q:"At the end of a stage, the project manager updates the business case with the actual costs to date and the latest forecast of benefits. Which step of the business case management technique is this?",o:["Develop", "Check", "Maintain", "Confirm"],a:2,e:"Maintain means keeping the business case updated with actual progress and current forecasts, including forecast benefits.",ref:"The business case management technique",of:1},
{s:"practices",q:"Twelve months after a project closed, a review assesses whether the expected reduction in customer complaints has been achieved. Which step of the business case management technique is this?",o:["Check", "Maintain", "Confirm", "Develop"],a:2,e:"Confirm means assessing whether the intended benefits have been, or will be, realized. It mostly takes place after closure, though benefits may be realized during the project when products are released iteratively.",ref:"The business case management technique",of:1},
{s:"practices",q:"Which management product describes how and when the project's benefits will be measured, including reviews after the project has closed?",o:["Benefits management approach", "Full business case", "End project report", "Communication management approach"],a:0,e:"The benefits management approach supports the business case by defining how and when benefits are measured. In closing a project it is updated to include any post-project benefit reviews. The business case documents the justification; the end project report reviews performance.",ref:"What's in the Business Case",of:1},
{s:"practices",q:"An organization has committed to cutting its carbon emissions by 2030. Where should a project's own sustainability performance targets and tolerances be documented?",o:["In the risk register, as threats to the organization's environmental goals", "In the quality register, as quality activities to be carried out by the teams", "In the sustainability management approach, which supports the business case", "In the communication management approach, as messages for external stakeholders"],a:2,e:"The sustainability performance targets and tolerances for the project are documented in the sustainability management approach, which supports the business case and should reference the organization's environmental, social and governance goals.",ref:"What's in the Business Case",of:1},
{s:"practices",q:"At the end of a stage, the forecast benefits fall outside the benefits tolerance that was set. What should happen?",o:["The senior user should revise the benefits tolerance so that it matches the forecast", "No action is needed because benefits are only confirmed after the project closes", "The project manager should reduce the scope so that the benefits return to tolerance", "The deviation should be escalated to the appropriate level for review and action"],a:3,e:"Forecast benefits are checked throughout the project, at a minimum at the end of every stage. If they fall outside the set tolerances, they should be escalated to the appropriate level for review and action.",ref:"The business case management technique",of:1},
{s:"roles",q:"What is a purpose of the organizing practice?",o:["To define the products to be delivered and the means and timescale for delivering them", "To establish mechanisms that judge whether the project remains desirable and viable", "To define how the business will move from its current state to the target state", "To define the project's roles and responsibilities, representing all three interests"],a:3,e:"The organizing practice defines the roles and responsibilities the project management team needs, ensures the user, supplier and business interests are represented, and establishes the design and development of the project organization. The other options describe change management, plans and the business case.",ref:"Four levels of organisation",of:1},
{s:"roles",q:"A project is forecast to exceed its project-level cost tolerance. Who decides whether to authorize the breach?",o:["The executive", "The project board", "The project manager", "The business layer"],a:3,e:"The business layer (commissioning) provides the mandate, identifies the executive, defines the project tolerances, and decides whether to authorize any potential breach of a project tolerance. When project tolerances are forecast to be exceeded, the board no longer has authority and must refer the matter to the business layer.",ref:"Four levels of organisation",of:1},
{s:"roles",q:"A small internal project has a limited number of senior managers available. Which combination of project board roles does PRINCE2 allow?",o:["The executive combined with the project manager", "The executive combined with the senior user", "The senior user combined with the senior supplier", "Project assurance combined with project support"],a:1,e:"On smaller, less complex projects the executive can be combined with the senior user or the senior supplier. Combining senior user and senior supplier is not recommended because of the conflict of interest. The executive cannot be the project manager, and project support must be kept separate from project assurance.",ref:"Combining Board roles",of:1},
{s:"roles",q:"Which role represents the interests of those who design, develop and implement the project's products?",o:["Team manager", "Senior supplier", "Senior user", "Executive"],a:1,e:"PRINCE2 defines the senior supplier role to represent the supplier interest: the people with the skills and knowledge to deliver the products, from inside or outside the organization. The senior user represents users, and the executive represents the business.",ref:"The Project Board",of:1},
{s:"roles",q:"Who must ensure ongoing commitment from the user community so that benefits continue to be realized after the project has closed?",o:["Project manager", "Senior supplier", "Senior user", "Executive"],a:2,e:"The senior user must ensure sufficient ongoing commitment from people in the user community, particularly where there is a longer-term commitment beyond the project's lifespan, such as the realization of benefits.",ref:"The Project Board",of:1},
{s:"roles",q:"The project board delegates its assurance tasks to an internal audit team. Who remains accountable for project assurance?",o:["Project support", "The project board members", "The internal audit team", "The project manager"],a:1,e:"Assurance tasks may be done by a board member, someone appointed from within the organization or an external party. Where project assurance is delegated, the project board members remain accountable.",ref:"Support & assurance",of:1},
{s:"roles",q:"Why must project support be kept separate from project assurance?",o:["Because project support is accountable for the project's continued justification", "To maintain the independence of assurance from the people running the project", "Because project support reports to the business layer rather than to the PM", "Because project assurance can only be performed by external organizations"],a:1,e:"Project support can help with integration across the project ecosystem but must be kept separate from project assurance roles to maintain the independence of assurance.",ref:"Support & assurance",of:1},
{s:"roles",q:"On a small project with one team, who may carry out the team manager role?",o:["The senior supplier", "Project assurance", "The executive", "The project manager"],a:3,e:"The team manager role may be assigned to the project manager, for example on a small project, or to a separate person who is accountable to the project manager.",ref:"Project & delivery levels",of:1},
{s:"roles",q:"A project has many work packages delivered by internal staff and two external suppliers. The project manager wants to show the hierarchy of the work to be done. What should be produced?",o:["A product flow diagram", "A work breakdown structure", "A product register", "A project management team structure"],a:1,e:"The work breakdown structure represents the hierarchy of work to be done, usually visually, and is most useful when there are several work packages. The product flow diagram shows product sequence, the team structure shows who is involved, and the product register lists products and their status.",ref:"Organizing products in the PID",of:1},
{s:"roles",q:"Halfway through a project, feedback shows the next phase needs data specialists the team does not have. Which step of the organizational design and development technique applies?",o:["Understand the organizational ecosystem", "Manage changes to the project ecosystem", "Transition the project into the organizational ecosystem", "Design the project ecosystem"],a:1,e:"Managing changes to the project ecosystem relies on clear feedback loops to find capability or capacity gaps and relational issues as the project's needs change. Designing the ecosystem happens earlier; transition happens at closure.",ref:"The organizational design and development technique",of:1},
{s:"roles",q:"As a project closes, the project manager makes sure the team's knowledge, the products and the people move back into the business units. Which step of the organizational design and development technique is this?",o:["Transition the project into the organizational ecosystem", "Develop the project ecosystem", "Manage changes to the project ecosystem", "Understand the organizational ecosystem in depth"],a:0,e:"The final step transitions the project's products, people and learning into the organizational ecosystem, incorporating lessons learned. Develop is about implementing the design and adapting it as the project progresses.",ref:"The organizational design and development technique",of:1},
{s:"roles",q:"A project will buy equipment from three suppliers after a tender. Which management product describes how these supplier relationships, procurement and contracts will be managed?",o:["Communication management approach", "Work package description", "Commercial management approach", "Risk management approach"],a:2,e:"The commercial management approach is part of the PID and supports the organizing practice: it sets out how commercial relationships with suppliers, including procurement and contracts, are managed.",ref:"Organizing products in the PID",of:1},
{s:"practices",q:"What is the purpose of the plans practice?",o:["To establish how the business will judge whether the project is still worthwhile", "To identify, assess and control uncertainty so the objectives are more likely to be met", "To compare actual achievement with planned achievement and control deviations", "To facilitate communication and control by defining products and how they are delivered"],a:3,e:"The plans practice facilitates communication and control by defining the products to be delivered (what) and the means to deliver them (who, how, where, when and how much) to satisfy the business case (why).",ref:"The planning technique",of:1},
{s:"practices",q:"Which plan gives the project board confidence that the project can fulfil its business case, by showing the major products and when, how and at what cost they will be delivered?",o:["Team plan", "Project plan", "Stage plan", "Exception plan"],a:1,e:"The project plan is a high-level plan of the major products and when, how and at what cost they will be delivered. Its purpose is to give the board confidence that the project will fulfil its business case. It is created in initiating a project and updated in managing a stage boundary.",ref:"Three levels + the exception",of:1},
{s:"practices",q:"Which plan is divided to the level of detail the project manager needs for day-to-day control?",o:["Stage plan", "Team plan", "Project plan", "Exception plan"],a:0,e:"A stage plan is prepared for each stage and is the basis for project management control during it. It is similar to the project plan in structure but detailed enough for day-to-day control by the project manager.",ref:"Three levels + the exception",of:1},
{s:"practices",q:"Which statement about team plans is CORRECT?",o:["They are created in starting up a project to plan the work of the initiation stage", "They are mandatory, and are approved by the project board at each stage boundary", "They are optional, and are created in managing product delivery", "They replace the stage plan when a stage is forecast to exceed its tolerances"],a:2,e:"Team plans are optional; whether they are needed depends on the size and complexity of the project and the resources involved. They are created in managing product delivery as the basis for organizing a team's work on a work package.",ref:"Three levels + the exception",of:1},
{s:"practices",q:"When is the plan for the initiation stage created?",o:["During managing a stage boundary", "During starting up a project", "During initiating a project", "During directing a project"],a:1,e:"The initiation stage plan is created in starting up a project. All later stage plans are produced near the end of the current stage, in managing a stage boundary, using lessons from previous stages.",ref:"Three levels + the exception",of:1},
{s:"practices",q:"Stage 4 of a project is eighteen months away and depends on the results of a design stage. The project manager cannot plan it accurately yet. How does PRINCE2 deal with this?",o:["Leave stage 4 out of the project plan until the design stage has been fully completed", "Ask the team managers to plan stage 4 in their own team plans during the design stage", "Plan stage 4 in full detail now so that the board can approve all of the stages at once", "Keep stage 4 high level in the project plan and plan it in detail near the end of stage 3"],a:3,e:"The planning horizon is the period over which it is possible to plan accurately. PRINCE2 plans the project at a high level in the project plan, and each stage in detail near the end of the previous stage.",ref:"Planning horizon and stages",of:1},
{s:"practices",q:"A product cannot be started until the city council grants a permit, which is outside the project's control. What type of dependency is this?",o:["A product flow", "An external dependency", "A stage tolerance", "An internal dependency"],a:1,e:"A dependency means one product depends on another. There are at least two types: internal (within the project's control) and external (outside it, such as a permit from a third party).",ref:"The planning technique",of:1},
{s:"practices",q:"A work package to procure long-lead equipment will run across a stage boundary. What should happen?",o:["It should be moved into the next stage plan before it is authorized", "It should be split so that no work package ever crosses a boundary", "It should be approved by the business layer as an exception", "Its status should be reviewed as part of managing the stage boundary"],a:3,e:"It is good practice to avoid work packages spanning stage boundaries, because boundary decisions can lead to rework or waste. Where one does span a boundary, such as procuring long-lead items, its status is reviewed as part of managing a stage boundary.",ref:"Planning horizon and stages",of:1},
{s:"practices",q:"A project manager groups closely related products and their activities so that each group can be given to a team manager. Which step of the planning technique is this?",o:["Preparing estimates", "Defining and analysing products", "Organizing work packages", "Preparing a schedule"],a:2,e:"Once the delivery method is decided, the delivery activities for each product can be identified and organized into work packages, each combining closely related people, resources and activities.",ref:"The planning technique",of:1},
{s:"practices",q:"In which step of the planning technique are the risk budget, the change budget and cost tolerances included?",o:["Preparing estimates", "Documenting the plan", "Preparing the budget", "Organizing work packages"],a:2,e:"Preparing the budget includes the costs of the activities, the risk budget, the change budget and cost tolerances. Estimates of resources, duration and cost come earlier; documenting the plan brings the parts together.",ref:"The planning technique",of:1},
{s:"practices",q:"A shopping centre project depends on a new bus route that the transport authority will deliver. How should the bus route be shown in the product breakdown structure?",o:["As a specialist product with a product description written by the project", "As a work package to be authorized for the transport authority's team", "It should be left out because the project is not responsible for delivering it", "As an external product that the project depends on but does not produce"],a:3,e:"A product breakdown structure can show external products the project depends on, such as revised public transport routes. They are outside the project's control, so they are not work packages for the project's teams.",ref:"Inside step 1",of:1},
{s:"practices",q:"Which management product describes the project's major products and purpose, the user's quality expectations, the acceptance criteria and the acceptance methods?",o:["Project product description", "Work package description", "Quality management approach", "Product description"],a:0,e:"The project product description describes the project's major products and their purpose, including the user's quality expectations, acceptance criteria and acceptance methods. It is created in starting up a project and refined during initiation.",ref:"Inside step 1",of:1},
{s:"practices",q:"What is the purpose of the quality practice?",o:["To confirm that the project is being conducted correctly on behalf of the board", "To check that every product is approved by the project board before it is used", "To define the activities, resources and schedule for delivering each product", "To document the user's requirements of the products and how they will be met"],a:3,e:"The purpose of the quality practice is to document the user's requirements of the project's products and to establish the means by which they will be met. Confirming that the project is conducted correctly is project assurance.",ref:"Three quality words",of:1},
{s:"practices",q:"Stakeholders have listed far more requirements than the budget allows. What does PRINCE2 advise?",o:["Leave the requirements unprioritized until the products are being built", "Raise an exception report so the business layer can increase the project budget", "Prioritize the requirements and agree them in a controlled way", "Record all the requirements as acceptance criteria so none can be rejected later"],a:2,e:"PRINCE2 uses 'requirements' for the stakeholders' expectations, needs and desires for the products, outcomes and benefits. No project can satisfy all requirements, so they must be prioritized and agreed in a controlled manner.",ref:"Three quality words",of:1},
{s:"practices",q:"At start-up, the senior user says the new website must be 'fast, reliable and accessible to everyone'. What is this, and where should it be captured?",o:["The quality specifications, captured in the quality register for the stage", "The acceptance criteria, captured in the product description for each product", "A request for change, captured in the issue register for a decision", "The user's quality expectations, captured in the project product description"],a:3,e:"User's quality expectations are general statements of the quality expected from the project product, captured early in the project product description. They are then turned into measurable acceptance criteria and, for each product, quality specifications.",ref:"The quality audit trail",of:1},
{s:"practices",q:"A project agrees that, before the users will accept the new website, pages must load in under two seconds, it must meet the accessibility standard, and it must be available 99.5% of the time, in that order of priority. What are these?",o:["Quality tolerances", "Acceptance criteria", "User's quality expectations", "Quality specifications"],a:1,e:"Acceptance criteria are a prioritized list of measurable criteria the project product must meet before the users will accept it. They are recorded in the project product description. Quality specifications apply to individual products in their product descriptions.",ref:"The quality audit trail",of:1},
{s:"practices",q:"Where are the quality specifications for an individual product, such as a training manual, documented?",o:["In the quality management approach", "In the project product description", "In the quality register for the stage", "In that product's product description"],a:3,e:"A product description describes a product's purpose, composition, derivation and quality specifications. The project product description covers the whole project product; the quality register records quality activities; the quality management approach sets the techniques, standards and responsibilities.",ref:"The quality audit trail",of:1},
{s:"practices",q:"A team manager records that a review of the user manual is planned for 12 May, and later records its result. Where is this information held?",o:["Product register", "Daily log", "Quality management approach", "Quality register"],a:3,e:"The quality register summarizes all quality management activities that are planned or have occurred, and is used for reviewing progress. The product register lists products and their status.",ref:"The quality audit trail",of:1},
{s:"practices",q:"A project manager needs a list of all the products in the stage plan, showing whether each is not started, in development or approved. Where is this held?",o:["Quality register", "Product register", "Lessons log", "Issue register"],a:1,e:"The product register lists all products required by a plan and their status. The quality register records quality activities rather than product status.",ref:"The project log",of:1},
{s:"practices",q:"When does quality control of a product begin?",o:["When the project board approves the project initiation documentation", "When the finished product is handed to the users for acceptance testing", "When the team manager sends the first checkpoint report for the work package", "When its product description is approved and recorded in the product register"],a:3,e:"Project quality control is a series of activities for each product. It begins when a product description is approved and recorded in the product register.",ref:"The quality management technique",of:1},
{s:"practices",q:"A group independent of the project team checks whether the techniques the project is using are sufficient to confirm the quality requirements will be met. What is this?",o:["Project assurance", "Quality assurance", "Quality control", "Quality planning"],a:1,e:"Quality assurance ensures the techniques are sufficient to confirm quality requirements are met, and is engaged throughout the lifecycle. Project assurance is the board's responsibility and confirms the project is being conducted correctly. Quality control checks the products themselves.",ref:"Three quality words",of:1},
{s:"practices",q:"Which management product describes the quality techniques and standards to be applied, and the roles and responsibilities for achieving the quality specifications and acceptance criteria?",o:["Project product description", "Quality management approach", "Quality register", "Product description"],a:1,e:"The quality management approach describes the quality techniques and standards to be applied and the responsibilities for achieving the required quality specifications and acceptance criteria. It is part of the PID.",ref:"Three quality words",of:1},
{s:"practices",type:"List",q:"Which TWO are key outputs of quality planning?\n1. Records of the tests that have been completed\n2. Product descriptions\n3. The quality management approach\n4. Records of the users' acceptance of the products",o:["1 and 2", "2 and 3", "3 and 4", "1 and 4"],a:1,e:"Product descriptions and the quality management approach are two key outcomes of quality planning. Records of tests and of acceptance are produced later, during quality control and acceptance.",ref:"The quality management technique",of:1},
{s:"practices",q:"Which principle is central to the PRINCE2 approach to quality?",o:["Manage by stages", "Manage by exception", "Learn from experience", "Focus on products"],a:3,e:"The focus on products principle is central to quality: quality should be built into the products from the start, not just tested at the end. The quality management technique is integrated around this principle.",ref:"Focus on products",of:1},
{s:"practices",q:"What is the purpose of the risk practice?",o:["To set the tolerances within which the project manager can act without escalating", "To collect and assess events that have happened and control changes to the baseline", "To identify, assess and control uncertainty to improve the chance of success", "To make sure that every threat is removed before a stage is authorized"],a:2,e:"The risk practice addresses how the project deals with uncertainty: identifying, assessing and controlling it. Events that have already happened are issues; not every threat can or should be removed.",ref:"The risk management procedure",of:1},
{s:"practices",q:"'Because the vendor's staff are new to our systems, the data migration may fail, which would delay go-live by six weeks.' Which part of this statement is the risk event?",o:["The vendor's staff are new to our systems", "The data migration may fail", "The whole statement is the risk cause", "Go-live would be delayed by six weeks"],a:1,e:"A risk is expressed as cause, event and effect. The cause is the source (the vendor's inexperienced staff), the event is the area of uncertainty (the migration may fail), and the effect is the impact on objectives (a six-week delay).",ref:"Risk definitions the exam uses",of:1},
{s:"practices",q:"An IT lead is responsible for managing and monitoring a data-loss risk. A technician has been nominated to carry out the agreed daily backup. What is the technician's role for this risk?",o:["Risk action owner", "Change authority", "Risk owner", "Project assurance"],a:0,e:"The risk owner is responsible for managing, monitoring and controlling all aspects of a particular risk. The risk action owner (also known as the risk actionee) is the nominated owner of an agreed action to respond to it.",ref:"Owner vs action owner",of:1},
{s:"practices",q:"A risk assessment notes that if a cyber attack occurs, its impact would be felt across the business within minutes. Which characteristic of the risk does this describe?",o:["Probability", "Proximity", "Exposure", "Velocity"],a:3,e:"Risk velocity is how quickly a risk would affect objectives should it occur. Proximity is how near in time it might occur; probability is the chance it occurs; exposure is the degree to which an objective is at risk.",ref:"Risk definitions the exam uses",of:1},
{s:"practices",q:"An organization states that it is willing to take moderate financial risks to grow its market share, but very little risk with customer safety. What does this describe?",o:["Risk appetite", "Risk budget", "Risk tolerance", "Risk exposure"],a:0,e:"Risk appetite is the amount and type of risk the business is willing to take in pursuit of its objectives. Risk tolerance is a measurable threshold for a specific objective; exposure is how much an objective is at risk; the risk budget funds responses.",ref:"Risk definitions the exam uses",of:1},
{s:"practices",q:"The project board sets a threshold that the project's total cost exposure from threats must not exceed €200,000. What is this an example of?",o:["Change budget", "Risk tolerance", "Risk budget", "Risk appetite"],a:1,e:"Risk tolerance is a measurable threshold for the tolerable range of outcomes for an objective at risk, using the same units as that objective. Appetite is the broader willingness to take risk; the risk and change budgets are sums of money to fund responses and changes.",ref:"Risk definitions the exam uses",of:1},
{s:"practices",q:"A project and its main supplier agree that any cost savings or overruns on the fit-out will be split between them. Which risk response is this?",o:["Accept", "Reduce", "Transfer", "Share"],a:3,e:"Sharing seeks multiple parties to share a risk on a pain/gain basis, typically within a supply chain. Transfer passes part of the risk to a third party, such as an insurer, without that gain-share arrangement.",ref:"Responses",of:1},
{s:"practices",q:"There is a chance the project could finish two weeks early if testing goes well. The project manager adds an extra tester now to make this more likely. Which risk response is this?",o:["Exploit", "Enhance", "Share", "Accept"],a:1,e:"Enhance is a definite action taken now to increase the probability or impact of an opportunity (the opportunity equivalent of reduce). Exploit makes the uncertain opportunity certain.",ref:"Responses",of:1},
{s:"practices",q:"A project arranges in advance to hire temporary generators, but will only call them in if the main power upgrade is delayed. Which risk response is this?",o:["Prepare contingent plans", "Transfer the risk", "Accept the risk", "Reduce the threat"],a:0,e:"Preparing contingent plans means planning a set of actions now that will be taken only if the risk occurs. It applies to both threats and opportunities.",ref:"Responses",of:1},
{s:"practices",q:"Moving a data migration to a weekend reduces the risk of disrupting customers, but creates a new risk that key staff are not available. What is the new risk called?",o:["An issue", "A risk cause", "A residual risk", "A secondary risk"],a:3,e:"Responses can change the project and lead to secondary risks, which must be identified, assessed and controlled like the original risk. A residual risk is what remains of the original risk after a response.",ref:"Risk definitions the exam uses",of:1},
{s:"practices",q:"In a risk workshop, nobody challenges an optimistic schedule because the team wants to avoid conflict with a respected colleague. Which decision bias is this?",o:["Loss aversion", "Proximity bias", "Groupthink", "Optimism bias"],a:2,e:"Groupthink is a mindset that values social cohesion in a group above expressing an alternative view or reaching the right decision. Optimism bias discounts disadvantageous risks; loss aversion values avoiding loss over making a gain; proximity bias treats nearer situations as more important.",ref:"Risk definitions the exam uses",of:1},
{s:"practices",q:"Where should the mechanisms for controlling and accessing the risk budget be defined?",o:["In the risk register", "In the current stage plan", "In the full business case", "In the risk management approach"],a:3,e:"The risk management approach should define the mechanisms for control of, and access to, the risk budget, so it is not treated as another sum of money to spend from the project budget. The risk register records the individual risks.",ref:"Owner vs action owner",of:1},
{s:"practices",q:"How does the issues practice contribute to a successful project?",o:["It records lessons so that future projects avoid making the same mistakes", "It defines the tolerances within which any issue may be resolved", "It collects and assesses issues and controls changes to the baseline", "It identifies uncertain events and plans the responses before they happen"],a:2,e:"The purpose of the issues practice is to collect and assess issues and control changes to the project's baseline. Uncertain future events are risks.",ref:"Risk vs issue",of:1},
{s:"practices",q:"What is meant by the project baseline?",o:["The current approved versions of products that are subject to change control", "The list of products in the product register that have not yet been started", "The set of tolerances agreed by the business layer for the whole project", "The original project plan, which is never changed after the project is authorized"],a:0,e:"The project baseline is the current approved versions of the management products and project products that are subject to change control. Changes are not incorporated until approved by whoever holds the delegated authority.",ref:"The change control procedure",of:1},
{s:"practices",q:"After the design has been approved, the senior user asks for the booking system to handle 800 users instead of 500. What type of issue is this?",o:["Off-specification", "Problem/concern", "Business opportunity", "Request for change"],a:3,e:"A request for change is a proposal to change a baseline; it must identify the management products to be changed and give a justification. An off-specification is something the project should provide but will not.",ref:"Types of issue",of:1},
{s:"practices",q:"A supplier warns that the sensors it is delivering will not meet the accuracy stated in their product description. What type of issue is this?",o:["Off-specification", "Request for change", "Business opportunity", "Event external to the project"],a:0,e:"An off-specification is something that should be provided by the project but is not, or is forecast not to be: a missing product or one that will not meet its quality specifications.",ref:"Types of issue",of:1},
{s:"practices",q:"The project board agrees to accept a product that does not meet its specification, without any corrective action. What is this called?",o:["A concession", "A contingent plan", "A dis-benefit", "A request for change"],a:0,e:"A concession is an off-specification that is accepted by the project board without corrective action.",ref:"Types of issue",of:1},
{s:"practices",q:"During a project, the government announces a new data-protection rule that will affect how the system stores records. What type of issue is this?",o:["Problem/concern", "Off-specification", "Event external to the project", "Request for change"],a:2,e:"An event external to the project is something outside the project that may affect it, such as new regulation or a supplier going out of business. The project's external environment should be monitored regularly.",ref:"Types of issue",of:1},
{s:"practices",q:"A supplier offers a newer model of server at the same price, which would cut the organization's running costs. What type of issue is this?",o:["Business opportunity", "Request for change", "Event external to the project", "Off-specification"],a:0,e:"A business opportunity is an issue representing unanticipated positive consequences for the project or the user organization.",ref:"Types of issue",of:1},
{s:"practices",q:"The project board delegates authority for approving minor changes to a change authority. What should the project manager ensure goes with this delegated authority?",o:["A transfer of the board's accountability for the project to the change authority", "An appropriate change budget from which approved changes can be delivered", "A separate exception plan for each change the change authority approves", "A risk budget that can be used for any change the change authority approves"],a:1,e:"The board is the ultimate authority for requests for change and off-specifications but may delegate authority to approve changes. The project manager should ensure delegated authority comes with an appropriate change budget, usually money earmarked to fund changes.",ref:"The change control procedure",of:1},
{s:"practices",q:"A project manager decides what type of issue has been raised, whether to handle it formally or informally, and makes an initial assessment of its severity and priority. Which step of the issue management technique is this?",o:["Capture", "Assess", "Recommend", "Decide"],a:0,e:"Capture is the first step: an initial analysis to determine the issue type and whether to manage it formally or informally, with an initial assessment of severity and priority. Assess then analyses its impact.",ref:"The change control procedure",of:1},
{s:"practices",q:"Before analysing an issue in detail, the project manager considers whether a full impact analysis is worth the effort, as it could itself cause a deviation from the plan. Which step of the issue management technique is this?",o:["Implement", "Capture", "Assess", "Recommend"],a:2,e:"The assess step analyses the issue's impact. The project manager should consider whether a detailed impact analysis is worthwhile, because the time and effort it takes may itself cause a deviation from the plan.",ref:"The change control procedure",of:1},
{s:"practices",q:"The project manager evaluates alternative ways of responding to an issue and proposes a course of action, making the consequences of each option clear. Which step of the issue management technique is this?",o:["Assess", "Implement", "Recommend", "Decide"],a:2,e:"In the recommend step, with a full understanding of the impact, the project manager considers alternative options and proposes a course of action, making the consequences of all choices clear. The decision is taken in the next step.",ref:"The change control procedure",of:1},
{s:"practices",q:"A team member mentions a minor concern that the project manager can resolve informally within tolerance. Where should it be recorded?",o:["In the daily log", "In the issue register", "In the risk register", "In the lessons report"],a:0,e:"Issues managed informally, such as minor problems the project manager can deal with, are recorded in the daily log. Issues managed formally are recorded in the issue register, with an issue report.",ref:"The project log",of:1},
{s:"practices",q:"What is the purpose of the progress practice?",o:["To compare actual and planned achievement, forecast and control deviations", "To define the products and the means and timescale for delivering them", "To decide whether the project remains desirable, viable and achievable overall", "To capture and assess issues and to control any changes to the baseline"],a:0,e:"The progress practice establishes mechanisms to monitor and compare actual against planned achievement, provide a forecast for the project's objectives and continued viability, and control any unacceptable deviations.",ref:"Tolerances and the cascade",of:1},
{s:"practices",q:"Actual spend on the current stage is within budget, but the project manager forecasts that the stage will exceed its cost tolerance by the end. What does PRINCE2 say about this?",o:["An exception exists only if the forecast also exceeds the project tolerances", "An exception exists now, because an exception is a forecast deviation beyond tolerance", "No exception exists, because forecasts are reported only in the end stage report", "No exception exists yet, because the tolerance has not actually been exceeded"],a:1,e:"An exception is a situation where it can be forecast that a deviation beyond the agreed tolerance will occur. It is not necessary or helpful to wait until the deviation has happened.",ref:"Tolerances and the cascade",of:1},
{s:"practices",q:"A team manager forecasts that a work package will exceed its agreed time tolerance. What should the team manager do?",o:["Produce an exception plan for the work package", "Refer the deviation to the business layer", "Send an exception report to the project board", "Inform the project manager by raising an issue"],a:3,e:"Work-package-level exceptions are referred to the project manager: the team manager raises an issue and the project manager advises on corrective action. Exception reports go from the project manager to the board for stage or project exceptions.",ref:"Tolerances and the cascade",of:1},
{s:"practices",q:"The project manager's forecast shows that the project as a whole will exceed its project time tolerance. Who must decide what to do?",o:["The business layer, because the board no longer has authority to direct the project", "The project board, because it sets the project tolerances in the PID", "The executive alone, because only the executive is accountable for the project", "The project manager, because the forecast deviation is within the stage"],a:0,e:"If the forecast is for project tolerances to be exceeded, the project board no longer has the authority to direct the project and must refer the matter to the business layer (corporate, programme management or the customer) for a decision.",ref:"Tolerances and the cascade",of:1},
{s:"practices",q:"The project board asks for a short summary of stage status every two weeks. What type of control is this?",o:["A risk tolerance", "A quality control", "A time-driven control", "An event-driven control"],a:2,e:"Time-driven controls take place at predefined periodic intervals, such as highlight reports to the board or checkpoint reports. Event-driven controls take place when a specific event occurs, such as the end of a stage or an exception.",ref:"Two kinds of control",of:1},
{s:"practices",q:"How is the frequency of checkpoint reports from a team manager decided?",o:["It is defined in the work package description", "It is decided by the team manager after each report", "It is defined by the board in the communication management approach", "It is set by the business layer in the project mandate"],a:0,e:"The checkpoint report reports the status of the work package to the project manager at a frequency defined in the work package.",ref:"Who reports what to whom",of:1},
{s:"practices",q:"Which report provides the project board, and other stakeholders, with a summary of stage status at intervals that the board defines?",o:["Checkpoint report", "Exception report", "End stage report", "Highlight report"],a:3,e:"The highlight report summarizes stage status for the board and other stakeholders at intervals they define. Checkpoint reports go from team manager to project manager; end stage reports are produced at the end of a stage; exception reports are triggered by a forecast breach.",ref:"Who reports what to whom",of:1},
{s:"practices",q:"Against what does the end project report review the project's performance?",o:["The version of the PID used to authorize the project", "The stage plan for the final stage of the project", "The latest highlight report sent to the project board", "The project mandate provided by the business layer"],a:0,e:"The end project report reviews how the project performed against the version of the PID used to authorize it.",ref:"Who reports what to whom",of:1},
{s:"practices",type:"Missing word",q:"Identify the missing word in the following sentence.\n\nThe [?] is used to capture lessons, so that they can be reported when progress is reviewed.",o:["lessons log", "lessons report", "daily log", "issue register"],a:0,e:"The lessons log captures lessons for reporting when reviewing progress. The lessons report passes on lessons that can usefully be applied to other projects and triggers action to embed them.",ref:"The project log",of:1},
